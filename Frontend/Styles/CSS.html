/* ==========================================================
   SALES SUMMARY — FINAL TABLE STYLE
========================================================== */

.sales-summary-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 4px;
  border: 1px solid #dfc3c8;
}

.sales-summary-table th {
  background: #faf5f6;
  color: #70464d;
  font-size: 9px;
  font-weight: 700;
  padding: 6px 8px;

  border: 1px solid #dfc3c8;
}

.sales-summary-table td {
  padding: 5px 8px;
  vertical-align: middle;

  border-left: 1px solid #ead6da;
  border-right: 1px solid #ead6da;
  border-bottom: 1px solid #ead6da;
}


/* ================= CATEGORY ================= */

.sales-category-row td {
  background: #f8edef;
  color: #70464d;
  font-weight: 700;

  border-top: 1px solid #d8afb6;
  border-bottom: 1px solid #d8afb6;
}


/* ================= NORMAL SALE ================= */

.sales-item-row td {
  background: #fff;
}

.sales-item-name {
  padding-left: 18px !important;
  font-weight: 600;
  color: #343434;
}

.sales-code {
  color: #777;
  font-family: monospace;
  font-size: 9px;
}

.sales-center {
  text-align: center;
}

.sales-money {
  text-align: right;
  white-space: nowrap;
}


/* ================= EXCHANGE ================= */

.sales-exchange-row td {
  background: #fcf9fa;
  color: #796b6e;
  font-size: 8.5px;

  border-top: 1px dashed #dfcfd2;
  border-bottom: 1px dashed #dfcfd2;
}

.sales-exchange-name {
  padding-left: 38px !important;
  font-weight: 500;
}

.sales-negative {
  color: #a43d4b !important;
  font-weight: 700;
}

/* Alternating detail rows */
tbody > tr:nth-child(odd):not(.category):not(.total) > td {
  background-color: #ffffff;
}

tbody > tr:nth-child(even):not(.category):not(.total) > td {
  background-color: #f3f5f7;
}

/* Clear category separators */
.category td {
  background-color: #f4e3e7;
  color: #70464d;
  font-weight: bold;
  border-top: 2px solid #cc929e;
}

/* Softer detail borders */
tbody > tr:not(.category):not(.total) > td {
  border-color: #d8dce1;
}

/* Keep exchange rows easy to follow */
.exchange-table td {
  border-top-style: solid;
  border-bottom-style: solid;
}

.movement {
  margin-top: 2px;
  font-size: 7.5px;
  font-weight: bold;
  color: #555;
}

/* Highlight totals */
.total td {
  background-color: #f4e3e7;
  color: #8f2441;
  font-weight: bold;
  border-top: 2px solid #cc929e;
}

/* Final combined amount */
.combined-total {
  background-color: #f4e3e7;
  padding: 8px;
  border: 1px solid #cc929e;
  font-weight: bold;
}

/* Negative values stay distinct */
.negative {
  color: #b4233c;
  font-weight: bold;
}

/* Preserve cell shading in print output */
table, th, td {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* Compact exchange rows with separate fields */
.exchange-table {
  table-layout: fixed;
}

.exchange-table th,
.exchange-table td {
  padding: 4px 3px;
  font-size: 7.5px;
  vertical-align: middle;
  border: 1px solid #c8cdd3;
}

.exchange-table .exchange-type {
  font-weight: bold;
}

.exchange-table .receipt {
  font-size: 7px;
}

.exchange-table .exchange-date {
  font-size: 7px;
  white-space: nowrap;
}

/* Variance and remarks share the same color */
.report-variance,
.report-variance b,
.report-remark {
  color: #a96519 !important;
}

.report-variance {
  font-weight: bold;
}

/* Keep category and total rows distinct */
.category td,
.total td {
  background-color: #f4e3e7 !important;
  font-weight: bold;
}

/* Solid border around the exchange total row */
.exchange-table tbody tr.total td {
  border-top: 1px solid #cc929e !important;
  border-bottom: 1px solid #cc929e !important;
}

/* No separator line beneath Final Net Sales */
.combined-total {
  border-bottom: none !important;
}

thead th {

  color: #70464d !important;

.category td {
