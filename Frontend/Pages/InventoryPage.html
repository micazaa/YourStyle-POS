entory-sort-marker" aria-hidden="true">↕</span></button></th><th class="text-center" data-inventory-sort="active" aria-sort="none" id="inventoryActiveHeading" style="display:none;"><button type="button" class="btn btn-link p-0 text-reset text-decoration-none fw-semibold text-nowrap" onclick="sortInventoryTable('active')">Active / Inactive <span class="inventory-sort-marker" aria-hidden="true">↕</span></button></th><th class="text-center">Actions</th></tr>

<script>
var inventoryPageData = [];
var dashboardInventoryReminder = '';
var inventoryIncompleteOnly = false;
var inventorySort = { key: 'name', direction: 1 };
var inventorySummaryKind = 'products';
var inventorySummarySort = { key: 'category', direction: 1 };
function inventoryIsManager() { return hasManagerViewAccess(); }
function inventoryIsYourFinds(item) {
  return String(item.category).toUpperCase() === 'YOURFINDS' && String(item.inventoryType).toUpperCase() === 'UNIQUE';
}
function inventoryColumnCount() { return inventoryIsManager() ? 10 : 9; }
function inventoryManagerReadToken(){return inventoryIsManager()?(canAuthorizeManagerActions()?(currentEmployee.inventoryManagerToken||'expired'):(currentEmployee.dashboardToken||'expired')):'';}
function inventoryCostText(value){return value===null||value===undefined||value===''?'—':'₱'+Number(value).toFixed(2);}
var inventoryListPage=1, inventoryListPageCount=1, inventoryListRequest=0, inventoryListPending=null;
var inventoryListPages=new Map(), inventoryListVersion='', inventoryCards={products:0,low:0,sold:0};
var inventorySummaryPages=new Map();
var inventorySummaryPage=1, inventorySummaryPageCount=1, inventorySummaryRequest=0, inventorySummaryResult=null;
var inventorySearchTimer=null, inventoryLoadingActive=false, inventoryHasLoaded=false, inventoryHeaderDisabled=new Map(), inventoryLoadingFocus=null;
var inventoryDataset=null,inventoryDownload=null,inventoryDataEpoch=0,inventoryDownloadTimer=null,inventoryVersionCheckAt=0;
var inventoryLocalViews=new Map();
var inventoryScrollPage=null;
var inventoryChangesRead=null,inventoryChangesTimer=null;
var inventoryInitialWarmups=[],inventoryInitialWarmupTimer=null;
function afterInventoryFirstPage(callback) {
  const owner=currentEmployee&&currentEmployee.dashboardToken;if(!owner)return;
  inventoryInitialWarmups.push({owner:owner,callback:callback});
  runInventoryInitialWarmups();
}
function runInventoryInitialWarmups() {
  if(!inventoryHasLoaded||!inventoryInitialWarmups.length)return;
  clearTimeout(inventoryInitialWarmupTimer);
  inventoryInitialWarmupTimer=setTimeout(()=>{
    const tasks=inventoryInitialWarmups;inventoryInitialWarmups=[];
    tasks.forEach(task=>{if(currentEmployee&&currentEmployee.dashboardToken===task.owner)task.callback();});
  },200);
}
function inventoryListCacheKey(query) {
  return JSON.stringify(inventoryListRequest_(query));
}
function inventorySummaryCacheKey(query,version=inventoryListVersion) {
  return JSON.stringify([version,inventoryListCacheKey(query),query.kind||'products',query.summarySort||'category',Number(query.summaryDirection)===-1?-1:1]);
}
function rememberInventorySummaryPage(query,data) {
  inventorySummaryPages.set(inventorySummaryCacheKey(query,data.version),{data:data,time:Date.now()});
  if(inventorySummaryPages.size>96)inventorySummaryPages.delete(inventorySummaryPages.keys().next().value);
}
function rememberInventoryListPage(query,data) {
  const entry={data:data,checked:Date.now()};
  inventoryListPages.set(inventoryListCacheKey(query),entry);
  if(data.page!==Number(query.page))inventoryListPages.set(inventoryListCacheKey({...query,page:data.page}),entry);
  if(inventoryListPages.size>48)inventoryListPages.delete(inventoryListPages.keys().next().value);
  (data.summaryPreviews||[]).forEach(preview=>rememberInventorySummaryPage(preview.query,preview.data));
  (data.priorityPages||[]).forEach(page=>rememberInventoryListPage(page.query,page.data));
}
function inventoryDatasetReady() {
  return inventoryDataset&&inventoryDataset.complete&&currentEmployee&&inventoryDataset.owner===currentEmployee.dashboardToken;
}
function inventoryDatasetCanAnswer(query) {
  if(inventoryDatasetReady())return true;
  if(!inventoryDataset?.nonInactiveReady||inventoryDataset.stale||!currentEmployee||inventoryDataset.owner!==currentEmployee.dashboardToken)return false;
  const request=inventoryListRequest_(query);
  return !request.search&&(request.exclude.includes('DEACTIVATED')||
    request.status.length>0&&request.status.every(status=>status==='ACTIVE'||status==='ON SALE'));
}
function updateInventoryDatasetStatus(message='') {
  const status=document.getElementById('inventoryDatasetStatus');
  if(message){status.replaceChildren(document.createTextNode(message+' '));const retry=document.createElement('button');retry.type='button';retry.className='btn btn-link btn-sm p-0';retry.textContent='Retry';retry.onclick=()=>startInventoryDownload('');status.appendChild(retry);return;}
  if(inventoryDownload){
    const label=inventoryDownload.segment==='INACTIVE'?'Preparing inactive inventory…':inventoryDatasetReady()?'Refreshing inventory…':'Preparing available inventory…';
    status.innerHTML=loadingIndicator(label)+(inventoryDownload.total?' '+inventoryDownload.offset+' / '+inventoryDownload.total:'');
  }else if(inventoryItemDetailPreload){
    status.innerHTML=loadingIndicator('Preparing item details…')+(inventoryItemDetailPreload.total?' '+inventoryItemDetailPreload.offset+' / '+inventoryItemDetailPreload.total:'');
  }else status.replaceChildren();
}
function inventoryLocalView(query) {
  const normalized=inventoryListRequest_(query),key=inventoryListCacheKey({...normalized,page:1});
  if(inventoryLocalViews.has(key))return inventoryLocalViews.get(key);
  const index=inventoryDataset.items,groups=inventoryListGroups_(index,normalized);
  const rows=inventoryListSaleRows_(index.filter(item=>!inventoryListExcluded_(item,normalized)&&inventoryListMatches_(item,normalized)));
  const compare=inventorySortComparer_();
  rows.sort((left,right)=>{
    const field=normalized.sort,a=field==='active'?left.productStatus:field==='availability'?inventoryListStatus_(left):left[field];
    const b=field==='active'?right.productStatus:field==='availability'?inventoryListStatus_(right):right[field];
    return (typeof a==='number'?a-b:compare(a,b))*normalized.direction||compare(left.code,right.code)||(left.saleTierIndex||0)-(right.saleTierIndex||0);
  });
  const view={rows:rows,groups:groups,cards:{products:groups.length,low:groups.filter(group=>group.status==='LOW STOCK').length,sold:groups.filter(group=>group.status==='SOLD OUT').length}};
  inventoryLocalViews.set(key,view);if(inventoryLocalViews.size>4)inventoryLocalViews.delete(inventoryLocalViews.keys().next().value);
  return view;
}
function applyLocalInventoryPage(query) {
  const view=inventoryLocalView(query);
  applyInventoryPage(inventoryListResponse_(view.rows,inventoryListRequest_(query),inventoryDataset.version,view.cards));
}
function finishInventoryDownload(job) {
  inventoryDataset={owner:job.owner,version:job.version,items:job.items,complete:true,stale:false,detailsReady:false};
  inventoryDownload=null;inventoryListVersion=job.version;inventoryLocalViews.clear();inventoryListPages.clear();inventorySummaryPages.clear();
  ++inventoryListRequest;++inventorySummaryRequest;inventoryListPending=null;
  updateInventoryDatasetStatus();
  if(document.getElementById('inventoryPage').style.display!=='none')loadInventoryPage(false,true);
  else if(inventoryLoadingActive)inventoryListBusy(false);
  if(document.getElementById('inventorySummaryModal').style.display==='flex')renderInventorySummary();
  preloadInventoryItemDetails();
}
function startInventoryDownload(version='',restarts=0) {
  const owner=currentEmployee&&currentEmployee.dashboardToken;if(!owner)return;
  if(inventoryDownload&&inventoryDownload.owner===owner&&(!version||!inventoryDownload.version||inventoryDownload.version===version))return;
  if(inventoryDatasetReady()&&!inventoryDataset.stale&&(!version||inventoryDataset.version===version))return;
  clearTimeout(inventoryDownloadTimer);
  const job={owner:owner,version:version,items:[],segment:'NON_INACTIVE',segmentStart:0,offset:0,total:0,inventoryTotal:0,epoch:++inventoryDataEpoch,restarts:restarts};
  inventoryDownload=job;updateInventoryDatasetStatus();
  const current=()=>inventoryDownload===job&&job.epoch===inventoryDataEpoch&&currentEmployee&&currentEmployee.dashboardToken===owner;
  const failed=()=>{if(!current())return;inventoryDownload=null;updateInventoryDatasetStatus(inventoryDatasetReady()?'Inventory refresh paused.':'Background preparation paused.');};
  function next(){
    if(!current())return;
    secureScriptRun.withSuccessHandler(result=>{
      if(!current())return;if(!result||!result.success)return failed();
      if(result.changed){
        inventoryDownload=null;
        if(job.restarts>=3)return updateInventoryDatasetStatus('Inventory is changing. Try preparing it again.');
        inventoryDownloadTimer=setTimeout(()=>startInventoryDownload(result.version,job.restarts+1),300);return;
      }
      if(result.segment!==job.segment||result.offset!==job.offset||job.version&&result.version!==job.version||!Array.isArray(result.fields)||!Array.isArray(result.items))return failed();
      if(job.inventoryTotal&&job.inventoryTotal!==result.inventoryTotal)return failed();
      job.version=result.version;job.total=result.total;job.inventoryTotal=result.inventoryTotal;
      result.items.forEach(values=>{
        const item={};result.fields.forEach((field,index)=>{item[field]=values[index];});
        item.availability=inventoryListStatus_(item);item.searchText=[item.code,item.name,item.category,item.size].join(' ').toLowerCase();job.items.push(item);
      });
      if(result.nextOffset!==job.items.length-job.segmentStart||!result.done&&result.nextOffset<=job.offset)return failed();
      job.offset=result.nextOffset;updateInventoryDatasetStatus();
      if(result.done){
        if(job.offset!==result.total)return failed();
        if(job.segment==='NON_INACTIVE'&&job.items.length<job.inventoryTotal){
          job.segment='INACTIVE';job.segmentStart=job.items.length;job.offset=0;job.total=job.inventoryTotal-job.items.length;
          if(!inventoryDatasetReady()){
            inventoryDataset={owner:owner,version:job.version,items:job.items.slice(),complete:false,nonInactiveReady:true,stale:false,detailsReady:false};
            inventoryListVersion=job.version;inventoryLocalViews.clear();
            if(document.getElementById('inventoryPage').style.display!=='none'&&inventoryDatasetCanAnswer(inventoryListQuery()))loadInventoryPage(false,true);
            if(document.getElementById('inventorySummaryModal').style.display==='flex')renderInventorySummary();
          }
          updateInventoryDatasetStatus();
        }else{
          if(job.items.length!==job.inventoryTotal)return failed();
          finishInventoryDownload(job);return;
        }
      }
      inventoryDownloadTimer=setTimeout(next,50);
    }).withFailureHandler(failed).getInventorySnapshotBatch({version:job.version,segment:job.segment,offset:job.offset,limit:1000});
  }
  inventoryDownloadTimer=setTimeout(next,150);
}
function observeInventoryVersion(version) {
  if(!version||!currentEmployee||(!inventoryHasLoaded&&!inventoryDatasetReady()&&!inventoryDownload))return;
  if(inventoryDownload&&(!inventoryDownload.version||inventoryDownload.version===version))return;
  const known=inventoryDatasetReady()?inventoryDataset.version:inventoryListVersion;
  if(known===version&&!inventoryDataset?.stale)return;
  if(inventoryDatasetReady()&&!inventoryDataset.stale){refreshInventoryChanges();return;}
  invalidateLocalInventoryReads(false);startInventoryDownload(version);
  if(inventoryLoadingActive&&!inventoryDatasetReady())loadInventoryPage(false,true);
}
function applyInventoryPatch(patch) {
  if(!patch||patch.success!==true||!patch.version||patch.reset||patch.pending||!inventoryDatasetReady()||inventoryDataset.stale)return false;
  if(patch.version===inventoryDataset.version)return true;
  if(patch.fromVersion!==inventoryDataset.version||!Array.isArray(patch.items)||!Array.isArray(patch.removedCodes))return false;
  const owner=currentEmployee.dashboardToken,previous=inventoryDataset.version;
  const changed=new Set(patch.items.map(item=>String(item.code))),removed=new Set(patch.removedCodes.map(String));
  const updated=new Map(patch.items.map(item=>{
    const full={...item,category:String(item.category||'OTHERS').trim().toUpperCase().replace(/^WHOLE\s+SALE$/,'WHOLESALE'),availability:inventoryListStatus_(item)};
    full.searchText=inventoryItemSearchText_(full);
    return [String(full.code),full];
  }));
  inventoryDataset.items=inventoryDataset.items.filter(item=>!removed.has(String(item.code))).map(item=>{
    const code=String(item.code),next=updated.get(code);if(next){updated.delete(code);return next;}return item;
  });
  inventoryDataset.items.push(...updated.values());inventoryDataset.version=patch.version;inventoryListVersion=patch.version;
  inventoryItemDetailCache.forEach((entry,code)=>{
    if(removed.has(code)||changed.has(code))inventoryItemDetailCache.delete(code);
    else if(entry.owner===owner&&entry.version===previous)entry.version=patch.version;
  });
  inventoryItemDetailPending.forEach((entry,code)=>{

function renderInventoryTable(items) {
  const body = document.getElementById('inventoryTableBody');
  body.innerHTML = '';

  if (!items.length) {
    body.innerHTML = `
      <tr>
        <td colspan="${inventoryColumnCount()}"
            class="text-center text-muted py-5">
          No inventory found.
        </td>
      </tr>
    `;
    return;
  }

  const isManager = inventoryIsManager();

  items.forEach(function(item) {
    const row = document.createElement('tr');
    const state = String(item.status || 'ACTIVE').trim().toUpperCase();
    const productState = String(item.productStatus || (state === 'INACTIVE' ? 'DEACTIVATED' : 'ACTIVE')).trim().toUpperCase();
    const stock = Number(item.stock) || 0;
    const isYourFinds = inventoryIsYourFinds(item);
    const isConverted = state === 'CONVERTED';
    const canToggle = state === 'ACTIVE' || state === 'INACTIVE';
    const isAllocatedSaleRow = item.saleVariant === 'SALE';
    const saleLabel = item.saleVariant === 'SALE' || item.saleVariant === 'ALL'
      ? '<span class="badge bg-danger text-white ms-2">SALE</span>'
      : item.saleVariant === 'REGULAR' ? '<span class="badge bg-light text-dark border ms-2">REGULAR</span>' : '';

    const image = item.imageUrl
      ? `
        <button type="button"
                class="btn p-0 inventory-photo"

          <img

            loading="lazy" decoding="async" width="50" height="50"
            alt="${escapeInventoryHtml(item.name)}"
            style="width:50px;height:50px;object-fit:cover;border-radius:8px;">
        </button>
      `
      : '<span class="small text-muted">No Image</span>';

    row.innerHTML = `
      <td class="ps-3">${image}</td>
      <td class="font-monospace small">
        ${escapeInventoryHtml(item.code)}
      </td>
      <td class="fw-semibold">
        ${escapeInventoryHtml(item.name)} ${saleLabel}
      </td>
      <td>${escapeInventoryHtml(item.category)}</td>
      <td class="text-center">${escapeInventoryHtml(item.size)}</td>
      <td class="text-center fw-semibold">
        ₱${(Number(item.price) || 0).toFixed(2)}
      </td>
      <td class="text-center fw-bold">${stock}</td>
      <td class="text-center">
        ${buildInventoryStatusBadge(getInventoryDisplayStatus(item))}
      </td>
      ${
        isManager
          ? `
            <td>
              ${state === 'RESERVED' ? '<input class="form-control form-control-sm" value="Reserved" disabled aria-label="Reserved inventory status">' : isAllocatedSaleRow ? '<span class="badge bg-danger text-white">On Sale</span>' : isConverted ? '<span class="badge bg-secondary">Converted</span>' : `<select
                class="form-select form-select-sm inventory-active"
                aria-label="Active status for ${escapeInventoryHtml(item.code)}"
                ${canToggle ? '' : 'disabled'}
                title="${
                  canToggle
                    ? 'Change active status'
                    : 'Complete the item first; returned items cannot be activated.'
                }">
                <option value="ACTIVE"
                  ${productState === 'ACTIVE' ? 'selected' : ''}>
                  Active
                </option>
                <option value="DEACTIVATED"
                  ${productState === 'DEACTIVATED' ? 'selected' : ''}>
                  Inactive
                </option>
                <option value="ON SALE"
                  ${productState === 'ON SALE' ? 'selected' : ''}>
                  On Sale
                </option>
              </select>`}
            </td>
          `
          : ''
      }
      <td><div class="inventory-actions"></div></td>
    `;

    const photo = row.querySelector('.inventory-photo');
    if (photo) {
      photo.addEventListener('click', () => openInventoryImageViewer(item));
    }

    const select = row.querySelector('.inventory-active');
    if (select) {
      select.addEventListener('change', () =>
        changeInventoryActiveInline(item, select)
      );
    }

    const actions = row.querySelector('.inventory-actions');

    function action(name, label, callback) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className =
        'btn btn-sm ' +
        (name === 'delete'
          ? 'btn-outline-danger'
          : 'btn-outline-secondary');

      button.title = label;
      button.setAttribute('aria-label', label);
      button.innerHTML = inventoryIcon(name);
      button.addEventListener('click', callback);
      actions.appendChild(button);
    }

    const canEditDetails =
      !isYourFinds ||
      ['ACTIVE', 'INACTIVE', 'INCOMPLETE'].includes(state);

    if (isManager && canEditDetails) {
      action(
        'edit',
        state === 'INCOMPLETE' ? 'Add selling details' : 'Edit item',
        () => editInventoryRow(item)
      );
    }

    action('view', 'View item', () =>
      openInventoryDetails(item.code)
    );

    if (isManager && !isAllocatedSaleRow && !isConverted) {
      action('delete', 'Delete item', () => deleteInventoryRow(item));
    }

    body.appendChild(row);
  });
}

  if (item.imageUrl) image.src = item.imageUrl;
  else image.onerror();
  viewer.onclick = function(event) { if(event.target === viewer) closeInventoryImageViewer(); };
}
function closeInventoryImageViewer() {
  const viewer = document.getElementById('inventoryImageViewer');
  const image = document.getElementById('inventoryViewerImage');
  image.onload = null; image.onerror = null; image.removeAttribute('src'); image.style.display = 'none';
  document.getElementById('inventoryViewerStatus').hidden = true;
  viewer.setAttribute('aria-busy', 'false'); viewer.close();
}
function changeInventoryActiveInline(item, select) {
  if(inventoryLoadingActive)return;
  const status = select.value;
  select.value = item.productStatus || (String(item.status).toUpperCase()==='INACTIVE'?'DEACTIVATED':'ACTIVE');
  if (!inventoryIsManager()) return;
  if (status === 'ON SALE') {
    editInventoryRow(item, 'ON SALE');
    return;
  }
  const auth = managerCredentials('Manager PIN to change status:');
  if (!auth) return;
  select.disabled=true;
  secureScriptRun.withSuccessHandler(result=>{
    if(!result||!result.success){select.disabled=false;return showNotificationToast(result&&result.message||'Status change failed.',true);}
    pageReadCache.delete('productMaster');pageReadCache.delete('cashierInventory');deliveryCatalogCache=null;deliveryCatalogPending=null;
    showNotificationToast('Item set to '+String(result.productStatus||result.status).toLowerCase()+'.');
    loadInventoryPage(false,true);if(typeof refreshInventory==='function')refreshInventory();
  }).withFailureHandler(error=>{select.disabled=false;showNotificationToast(error.message||String(error),true);})
    .setInventoryAdministrativeStatus({code:item.code,status:status,...auth});
}

function editInventoryRow(item, requestedStatus) {
  if(inventoryLoadingActive)return;
  if (!inventoryIsManager()) return;
  if(item.listOnly){
    const request=++inventoryItemOpenRequest,yourFinds=inventoryIsYourFinds(item);
    const modalId=yourFinds?'yourFindsEditorModal':'productEditorModal';
    document.getElementById(yourFinds?'yfEditorTitle':'pmEditorTitle').textContent=yourFinds?'YourFinds Selling Details':'Edit Product';
    document.getElementById(yourFinds?'yfEditorSubtitle':'pmModeLabel').textContent=(item.name||'Item')+' · '+item.code;
    setInventoryEditorLoading(modalId,true);
    const current=()=>request===inventoryItemOpenRequest&&document.getElementById(modalId).style.display==='flex';
    withInventoryItemDetails(item.code,full=>{
      if(!current())return;
      setInventoryEditorLoading(modalId,false);editInventoryRow(full,requestedStatus);
    },error=>{
      if(!current())return;
      closeModal(modalId);setInventoryEditorLoading(modalId,false);showNotificationToast(error.message||'Unable to load item.',true);
    });
    return;
  }
  if (inventoryIsYourFinds(item)) { phase8SelectedItem = item; openYourFindsEditor(); return; }
  clearProductMasterForm();
  editInventoryProduct(item, requestedStatus);
}
function deleteInventoryRow(item) {
  if(inventoryLoadingActive)return;
  if (!inventoryIsManager()) return;
  if (Number(item.stock) !== 0) return showNotificationToast('Only zero-stock items can be deleted. Use a stock adjustment first.', true);
  if (!window.confirm('Delete ' + (item.name || item.code) + '? Items with transaction or delivery history cannot be deleted.')) return;
  const auth = managerCredentials('Manager PIN to delete this item:');
  if (!auth) return;
  secureScriptRun.withSuccessHandler(function(result) {
    if (!result || !result.success) return showNotificationToast(result && result.message || 'Delete failed.', true);
    showNotificationToast('Inventory item deleted.'); loadInventoryPage(false,true);
  }).withFailureHandler(error => showNotificationToast(error.message || String(error), true)).deleteUnusedInventoryItem({code:item.code,...auth});
}
function getInventoryDisplayStatus(
  item
) {

  const stock =
    Number(item.stock) || 0;


  const lowStockAt =
    Number(item.lowStockAt) || 0;


  const status =
    String(
      item.status || "ACTIVE"
    )
      .trim()
      .toUpperCase();

  /* INCOMPLETE FIRST */

  if (
    status === "INCOMPLETE"
  ) {

    return "INCOMPLETE";

  }


  if (status === "RESERVED") return "RESERVED";
  if (status === "RETURNED") return "RETURNED";

  if (status === "CONVERTED") return "CONVERTED";

  if (stock < 0) {

    return "NEGATIVE STOCK";

  }


  if (stock === 0) {

    return "SOLD OUT";

  }

  if (inventoryIsYourFinds(item)) return "IN STOCK";


  if (
    lowStockAt > 0 &&
    stock <= lowStockAt
  ) {

    return "LOW STOCK";

  }


  return "IN STOCK";

}


/* ==========================================================
   STATUS BADGE
========================================================== */

function buildInventoryStatusBadge(status) {
  if (status === "RESERVED") return '<span class="badge bg-warning text-dark">Reserved</span>';
  if (status === "RETURNED") return '<span class="badge bg-secondary">Returned</span>';

  if (status === "CONVERTED") return '<span class="badge bg-secondary">Converted</span>';

  if (status === "NEGATIVE STOCK") return '<span class="badge bg-danger">Sold Out</span>';

  if (
  status === "INCOMPLETE"
) {

  return `
    <span class="badge bg-info text-dark">
      Incomplete
    </span>
  `;

}

  if (status === "INACTIVE") {

    return `
      <span class="badge bg-secondary">
        Inactive
      </span>
    `;

  }


  if (status === "SOLD OUT") {

    return `
      <span class="badge bg-danger">
        Sold Out
      </span>
    `;

  }


  if (status === "LOW STOCK") {

    return `
      <span class="badge bg-warning text-dark">
        Low Stock
      </span>
    `;

  }


  return `
    <span class="badge bg-success">
      In Stock
    </span>
  `;

}


/* ==========================================================
   SUMMARY
========================================================== */

function updateInventorySummary() {
  document.getElementById('inventoryTotalProducts').textContent=inventoryCards.products;
  document.getElementById('inventoryLowStock').textContent=inventoryCards.low;
  document.getElementById('inventorySoldOut').textContent=inventoryCards.sold;
}


function escapeInventoryHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
