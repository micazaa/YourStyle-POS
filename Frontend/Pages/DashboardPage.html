<div id="dashboardPage" class="container-fluid p-3 p-lg-4" style="display: none">
  <header class="dashboard-header">
    <div>
      <h1 id="dashboardGreeting" class="h2 mb-1">Welcome!</h1>
      <p id="dashboardQuote" class="mb-0"></p>
    </div>
    <div class="dashboard-header-period">
      <button type="button" class="btn btn-light" aria-haspopup="dialog" onclick="openDashboardCalendar()">
        <span class="visually-hidden">Change date range, </span><span id="dashboardPeriodLabel" aria-live="polite">Date range</span>
        <span class="dashboard-period-chevron" aria-hidden="true"></span>
      </button>
    </div>
  </header>
  <section class="dashboard-overview" aria-labelledby="dashboardOverviewHeading">
    <h2 id="dashboardOverviewHeading" class="h5 mb-3">Overview</h2>
    <div class="dashboard-overview-grid">
      <button type="button" class="dashboard-overview-card" onclick="openTransactionHistoryModal()">
        <span class="dashboard-card-title">Sales <span aria-hidden="true">↗</span></span>
        <strong id="dashboardSalesTotal">—</strong>
        <span id="dashboardSalesScope">Net sales</span>
        <small id="dashboardSalesDetail"></small>
      </button>
      <button type="button" class="dashboard-overview-card" onclick="navigateSidebar('inventoryPage')">
        <span class="dashboard-card-title">Inventory <span aria-hidden="true">↗</span></span>
        <strong id="dashboardStockTotal">—</strong>
        <span>Items in stock now</span>
        <small id="dashboardStockDetail" class="dashboard-card-attention"></small>
      </button>
      <button type="button" class="dashboard-overview-card" onclick="navigateSidebar('deliveriesPage')">
        <span class="dashboard-card-title">Delivery <span aria-hidden="true">↗</span></span>
        <strong id="dashboardDeliveryTotal">—</strong>
        <span>Deliveries received</span>
        <small id="dashboardDeliveryDetail" class="dashboard-card-attention"></small>
      </button>
      <button type="button" class="dashboard-overview-card" aria-haspopup="dialog" onclick="openDashboardReturnSummary()">
        <span class="dashboard-card-title">Return <span aria-hidden="true">↗</span></span>
        <strong id="dashboardReturnTotal">—</strong>
        <span>Supplier returns</span>
        <small id="dashboardReturnDetail"></small>
      </button>
    </div>
    <p id="dashboardOverviewStatus" class="small text-muted mt-2 mb-0" role="status"></p>
    <button id="dashboardOverviewRetry" type="button" class="btn btn-outline-pink btn-sm mt-2" onclick="loadDashboardOverview()" hidden>Retry</button>
  </section>
  <dialog id="dashboardReturnSummary" aria-labelledby="dashboardReturnHeading">
    <header class="d-flex justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h2 id="dashboardReturnHeading" class="h4 mb-1">Return summary</h2>
        <p id="dashboardReturnPeriod" class="small text-muted mb-0"></p>
      </div>
      <div class="d-flex gap-2">
        <form method="dialog">
          <button class="btn btn-light dashboard-return-icon" aria-label="Close return summary">×</button>
        </form>
      </div>
    </header>
    <p class="visually-hidden"><span id="dashboardReturnReceiptCount">—</span> supplier returns</p>
    <p id="dashboardReturnMessage" class="small text-muted mb-2" role="status"></p>
    <table id="dashboardReturnTable" class="table table-sm mb-0" hidden>
      <thead class="visually-hidden"><tr><th scope="col">Item description</th><th scope="col" class="text-end">Qty</th></tr></thead>
      <tfoot><tr><th scope="row">Grand total</th><td class="text-end"><strong id="dashboardReturnItemCount">—</strong> <small>pcs</small></td></tr></tfoot>
    </table>
    <footer class="d-flex justify-content-between gap-2 pt-3 mt-2">
      <button type="button" class="btn btn-light" onclick="viewDashboardReturns()">View returns</button>
      <button id="dashboardReturnDownload" type="button" class="btn btn-pink dashboard-return-icon" title="Download PDF" aria-label="Download Return Report Summary PDF" onclick="downloadDashboardReturnSummary()" disabled>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 15v5h14v-5"/></svg>
      </button>
    </footer>
  </dialog>
  <dialog id="dashboardCalendar" aria-labelledby="dashboardCalendarMonth">
    <div class="dashboard-calendar-top">
      <button type="button" class="btn btn-light" aria-label="Previous month" onclick="moveDashboardMonth(-1)">‹</button>
      <strong id="dashboardCalendarMonth" aria-live="polite"></strong>
      <button type="button" class="btn btn-light" aria-label="Next month" onclick="moveDashboardMonth(1)">›</button>
    </div>
    <div class="dashboard-calendar-grid text-muted" aria-hidden="true">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div id="dashboardCalendarDays" class="dashboard-calendar-grid" aria-label="Days"
      onpointerdown="startDashboardDrag(event)" onpointermove="moveDashboardDrag(event)"
      onpointerup="finishDashboardDrag(event)" onlostpointercapture="cancelDashboardDrag(event)"
      onclick="if (event.detail === 0) selectDashboardDay(event)"></div>
    <div class="dashboard-calendar-shortcuts" onclick="selectDashboardShortcut(event)">
      <button type="button" class="btn btn-light" data-preset="today">Today</button>
      <button type="button" class="btn btn-light" data-preset="yesterday">Yesterday</button>
      <button type="button" class="btn btn-light" data-preset="week">This week</button>
      <button type="button" class="btn btn-light" data-preset="month">This month</button>
      <button type="button" class="btn btn-light" data-preset="year">This year</button>
      <button type="button" class="btn btn-light" data-preset="last-week">Last week</button>
      <button type="button" class="btn btn-light" data-preset="last-month">Last month</button>
      <button type="button" class="btn btn-light" data-preset="last-year">Last year</button>
    </div>
    <p id="dashboardCalendarSelection" class="visually-hidden" aria-live="polite"></p>
    <form method="dialog" class="d-flex justify-content-end gap-2 mt-3">
      <button class="btn btn-light">Cancel</button>
      <button type="button" class="btn btn-pink" onclick="applyDashboardCalendar()">Apply</button>
    </form>
  </dialog>
</div>

<style>
  .dashboard-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 20px 28px;
    padding: clamp(20px, 4vw, 32px);
    border: 1px solid #ead9de;
    border-radius: 18px;
    background: var(--pink-light);
    color: #381f2c;
  }
  .dashboard-header h1 {
    font-weight: 650;
    letter-spacing: -0.035em;
  }
  .dashboard-header p,
  .dashboard-header-period span {
    color: #684657;
    font-size: 0.875rem;
  }
  .dashboard-header-period {
    display: grid;
    justify-items: end;
    gap: 6px;
  }
  .dashboard-period-chevron {
    display: inline-block;
    width: 0.5em;
    height: 0.5em;
    margin-inline-start: 0.35em;
    vertical-align: 0.15em;
    border: solid currentColor;
    border-width: 0 0.12em 0.12em 0;
    transform: rotate(45deg);
  }
  .dashboard-overview { margin-top: 24px; }
  .dashboard-overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
    gap: 12px;
  }
  .dashboard-overview-card {
    display: grid;
    align-content: start;
    gap: 3px;
    padding: 14px;
    border: 1px solid #ead9de;
    border-radius: 12px;
    background: white;
    color: #381f2c;
    text-align: left;
    font-size: 0.875rem;
  }
  .dashboard-overview-card:hover { background: var(--pink-light); }
  .dashboard-card-title { display: flex; justify-content: space-between; font-weight: 650; margin-bottom: 8px; }
  .dashboard-card-title span, .dashboard-overview-card small { color: #684657; }
  .dashboard-overview-card strong { font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .dashboard-overview-card small { margin-top: 5px; }
  .dashboard-overview-card .dashboard-card-attention { color: #8a3e33; }
  #dashboardReturnSummary {
    width: min(580px, calc(100% - 24px));
    max-height: calc(100% - 24px);
    padding: clamp(14px, 4vw, 24px);
    border: 1px solid #ead9de;
    border-radius: 18px;
    color: #381f2c;
  }
  #dashboardReturnSummary::backdrop { background: #25131e55; }
  .dashboard-return-icon { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; font-size: 1.35rem; }
  #dashboardReturnTable { font-size: .875rem; --bs-table-bg: transparent; }
  #dashboardReturnTable thead th { background: transparent; color: #736970; font-size: .75rem; font-weight: 500; padding: 0 12px 10px; border: 0; }
  #dashboardReturnTable tbody td { padding: 10px 12px; background: transparent; border-color: #eee6e9; }
  #dashboardReturnTable .dashboard-return-group th { padding: 10px 12px; border-bottom: 0; border-top: 10px solid white; background: var(--pink-light); color: #88475d; }
  .dashboard-return-group-label { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .dashboard-return-group-label small { font-size: .75rem; white-space: nowrap; font-weight: 500; font-variant-numeric: tabular-nums; }
  #dashboardReturnTable tbody td:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }
  #dashboardReturnTable tfoot th, #dashboardReturnTable tfoot td { padding: 16px 12px 2px; border-top: 2px solid #eee6e9; border-bottom: 0; background: transparent; vertical-align: middle; }
  #dashboardReturnItemCount { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  #dashboardReturnTable tfoot small { color: #736970; font-weight: 400; }
  #dashboardCalendar {
    width: min(390px, calc(100% - 24px));
    max-height: calc(100% - 24px);
    padding: 16px;
    border: 1px solid #ead9de;
    border-radius: 16px;
    box-shadow: 0 14px 48px #381f2c30;
    color: #381f2c;
  }
  #dashboardCalendar::backdrop { background: #25131e55; }
  .dashboard-calendar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .dashboard-calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
  .dashboard-calendar-grid button { min-height: 40px; padding: 0; border: 0; background: transparent; color: inherit; }
  #dashboardCalendarDays { touch-action: none; user-select: none; }
  .dashboard-calendar-grid button:hover, .dashboard-calendar-grid .in-range { background: var(--pink-light); }
  .dashboard-calendar-grid .range-edge { background: var(--pink-main); border-radius: 20px; font-weight: 700; }
  .dashboard-calendar-grid .range-start { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .dashboard-calendar-grid .range-end { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .dashboard-calendar-grid button[aria-current="date"] { text-decoration: underline; text-underline-offset: 4px; }
  .dashboard-calendar-shortcuts { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid #ead9de; margin-top: 12px; padding-top: 12px; }
  .dashboard-calendar-shortcuts button { font-size: .8rem; }
  @media (max-width: 575px) {
    .dashboard-header-period { justify-items: start; }
  }
</style>

<script>
  function updateDashboardHeader(now = new Date()) {
    const manila = new Intl.DateTimeFormat('en', {
      timeZone: 'Asia/Manila', year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', hourCycle: 'h23'
    });
    const parts = Object.fromEntries(manila.formatToParts(now).map(({type, value}) => [type, value]));
    const hour = Number(parts.hour);
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const firstName = String(currentEmployee?.fullName || '').trim().split(/\s+/)[0];
    document.getElementById('dashboardGreeting').textContent = firstName ? greeting + ', ' + firstName + '!' : greeting + '!';

    const today = new Date(Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day)));
    dashboardToday = today;
    const quoteIndex = Math.floor(today.getTime() / 86400000) % dashboardQuotes.length;
    document.getElementById('dashboardQuote').textContent = dashboardQuotes[quoteIndex];
    renderDashboardPeriod();
  }

  const dashboardQuotes = [
    'One customer at a time. You’ve got this.',
    'Small wins add up. Here’s to a good shift.',
    'Take it one step at a time. Every bit of progress counts.',
    'A little patience goes a long way.',
    'A warm welcome can make someone’s day.',
    'Give yourself credit for the details you get right.',
    'Set a pace you can keep. You’re doing fine.'
  ];
  const dashboardDateFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'long', day: 'numeric', year: 'numeric' });
  const dashboardMonthFormat = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', month: 'long', year: 'numeric' });
  let dashboardToday, dashboardRange, dashboardDraft, dashboardMonth, dashboardDrag;
  let dashboardReturnPdfRequest = null;
  const dashboardNumberFormat = new Intl.NumberFormat('en-PH');
  const dashboardMoneyFormat = new Intl.NumberFormat('en-PH', {style:'currency', currency:'PHP', minimumFractionDigits:0});

  function renderDashboardOverview(data) {
    const fields = {
      dashboardSalesTotal: data ? dashboardMoneyFormat.format(data.sales.net) : '—',
      dashboardSalesScope: data?.sales.own ? 'Your net sales' : 'Net sales',
      dashboardSalesDetail: data ? dashboardNumberFormat.format(data.sales.count) + ' transactions' + (data.sales.limited ? ' · last 7 days only' : '') : '',
      dashboardStockTotal: data ? dashboardNumberFormat.format(data.inventory.stock) : '—',
      dashboardStockDetail: data ? dashboardNumberFormat.format(data.inventory.low) + ' low-stock products' : '',
      dashboardDeliveryTotal: data ? dashboardNumberFormat.format(data.delivery.count) : '—',
      dashboardDeliveryDetail: data ? dashboardNumberFormat.format(data.delivery.incomplete) + ' still incomplete' : '',
      dashboardReturnTotal: data ? dashboardNumberFormat.format(data.returns.count) : '—',
      dashboardReturnDetail: data ? dashboardNumberFormat.format(data.returns.items) + ' items returned' : '',
    };
    Object.entries(fields).forEach(([id, value]) => { document.getElementById(id).textContent = value; });
    if (document.getElementById('dashboardReturnSummary').open) renderDashboardReturnSummary(data?.returns);
  }

  function loadDashboardOverview() {
    if (!currentEmployee) return;
    const [start, end] = dashboardRange || [dashboardToday, dashboardToday];
    const range = {start:start.toISOString().slice(0, 10), end:end.toISOString().slice(0, 10)};
    const key = range.start + ':' + range.end;
    const cacheKey = 'dashboardOverview:' + key;
    const entry = pageReadCache.get(cacheKey);
    const fresh = entry?.data && Date.now() - entry.data.loadedAt < 30000;
    const read = beginPageRead(cacheKey, key, !!(entry?.pending || fresh));
    const selectedEntry = pageReadCache.get(cacheKey);
    pageReadCache.set('dashboardOverview', selectedEntry);
    const status = document.getElementById('dashboardOverviewStatus');
    const retry = document.getElementById('dashboardOverviewRetry');
    const saved = read.cached?.overview || (typeof readDeviceOverview === 'function' ? readDeviceOverview(range) : null);
    renderDashboardOverview(saved);
    retry.hidden = true;
    status.textContent = read.cached ? '' : saved ? 'Saved totals · refreshing…' : 'Loading overview…';
    if (saved) finishWorkspacePageLoad('dashboardPage');
    if (!read.shouldFetch) return;
    secureScriptRun.withSuccessHandler(data => {
      if (!read.current()) return;
      read.save({overview:data, loadedAt:Date.now()});
      if (typeof writeDeviceOverview === 'function') writeDeviceOverview(range, data);
      const ranges = Array.from(pageReadCache.keys()).filter(value => value.startsWith('dashboardOverview:'));
      if (ranges.length > 24) {
        const oldest = ranges.find(value => value !== cacheKey && !pageReadCache.get(value)?.pending);
        if (oldest) pageReadCache.delete(oldest);
      }
      if (pageReadCache.get('dashboardOverview') !== selectedEntry) return;
      renderDashboardOverview(data);
      status.textContent = '';
      if (!read.cached) finishWorkspacePageLoad('dashboardPage');
    }).withFailureHandler(() => {
      if (!read.current()) return;
      read.fail();
      if (pageReadCache.get('dashboardOverview') !== selectedEntry) return;
      status.textContent = saved ? 'Saved totals · couldn’t refresh.' : 'Couldn’t load the overview.';
      if (!saved && document.getElementById('dashboardReturnSummary').open)
        document.getElementById('dashboardReturnMessage').textContent = 'Couldn’t load the return summary.';
      retry.hidden = false;
      if (!read.cached) finishWorkspacePageLoad('dashboardPage');
    }).getDashboardOverview(range);
  }

  function renderDashboardReturnSummary(returns) {
    const table = document.getElementById('dashboardReturnTable');
    Array.from(table.tBodies).forEach(body => body.remove());
    document.getElementById('dashboardReturnReceiptCount').textContent = returns ? dashboardNumberFormat.format(returns.count) : '—';
    document.getElementById('dashboardReturnItemCount').textContent = returns ? dashboardNumberFormat.format(returns.items) : '—';
    document.getElementById('dashboardReturnMessage').textContent = !returns ? 'Loading return summary…'
      : returns.count === 0 ? 'No supplier returns in this date range.'
      : returns.groups.length === 0 ? 'No item quantities recorded for these returns.' : '';
    const download = document.getElementById('dashboardReturnDownload');
    download.disabled = !returns?.count || !!dashboardReturnPdfRequest;
    table.hidden = !returns?.groups.length;
    (returns?.groups || []).forEach(group => {
      const body = table.createTBody();
      const heading = document.createElement('th');
      heading.scope = 'rowgroup';
      heading.colSpan = 2;
      const label = document.createElement('div');
      label.className = 'dashboard-return-group-label';
      const title = document.createElement('span');
      title.textContent = group.title === 'YourStyle · Other' ? 'YourStyle · Others' : group.title;
      const subtotal = document.createElement('small');
      subtotal.textContent = dashboardNumberFormat.format(group.rows.reduce((sum,item) => sum + Number(item.quantity || 0),0)) + ' pcs';
      label.append(title, subtotal);
      heading.append(label);
      const groupRow = body.insertRow();
      groupRow.className = 'category dashboard-return-group';
      groupRow.append(heading);
      group.rows.forEach(item => {
        const row = body.insertRow();
        let description = group.title === 'YourStyle · Pins' && item.description === '-' ? 'Standard' : item.description;
        if (group.title === 'YourStyle · Other' && /^(shoes|bags)$/i.test(item.description)) {
          description = item.description.toUpperCase();
        }
        row.insertCell().textContent = description;
        const qty = row.insertCell();
        qty.className = 'text-end';
        qty.textContent = dashboardNumberFormat.format(item.quantity);
      });
    });
  }

  function openDashboardReturnSummary() {
    const [start, end] = dashboardRange || [dashboardToday, dashboardToday];
    document.getElementById('dashboardReturnPeriod').textContent = describeDashboardRange([start, end]);
    document.getElementById('dashboardReturnSummary').showModal();
    loadDashboardOverview();
  }

  function viewDashboardReturns() {
    document.getElementById('dashboardReturnSummary').close();
    navigateSidebar('supplierReturnsPage');
  }

  function downloadDashboardReturnSummary() {
    const button = document.getElementById('dashboardReturnDownload');
    if (button.disabled || dashboardReturnPdfRequest) return;
    const [start, end] = dashboardRange || [dashboardToday, dashboardToday];
    const request = {start:start.toISOString().slice(0, 10), end:end.toISOString().slice(0, 10)};
    dashboardReturnPdfRequest = request;
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    const message = document.getElementById('dashboardReturnMessage');
    message.textContent = 'Preparing return report…';
    const finish = error => {
      if (dashboardReturnPdfRequest !== request) return;
      dashboardReturnPdfRequest = null;
      button.removeAttribute('aria-busy');
      button.disabled = !pageReadCache.get('dashboardOverview')?.data?.overview?.returns?.count;
      message.textContent = error ? error.message || String(error) : '';
    };
    secureScriptRun.withSuccessHandler(result => {
      if (dashboardReturnPdfRequest !== request) return;
      try {
        downloadSupplierReturnPdf_(result);
        finish();
      } catch (error) { finish(error); }
    }).withFailureHandler(finish).createDashboardReturnPdf(request);
  }

  function dashboardDate(year, month, day) {
    return new Date(Date.UTC(year, month, day));
  }

  function describeDashboardRange([start, end]) {
    return +start === +end ? dashboardDateFormat.format(start) : dashboardDateFormat.formatRange(start, end);
  }

  function renderDashboardPeriod() {
    document.getElementById('dashboardPeriodLabel').textContent =
      describeDashboardRange(dashboardRange || [dashboardToday, dashboardToday]);
  }

  function openDashboardCalendar() {
    updateDashboardHeader();
    dashboardDraft = (dashboardRange || [dashboardToday, dashboardToday]).slice();
    const [start] = dashboardDraft;
    dashboardMonth = dashboardDate(start.getUTCFullYear(), start.getUTCMonth(), 1);
    renderDashboardCalendar();
    document.getElementById('dashboardCalendar').showModal();
  }

  function moveDashboardMonth(offset) {
    dashboardMonth = dashboardDate(dashboardMonth.getUTCFullYear(), dashboardMonth.getUTCMonth() + offset, 1);
    renderDashboardCalendar();
  }

  function renderDashboardCalendar() {
    const year = dashboardMonth.getUTCFullYear(), month = dashboardMonth.getUTCMonth();
    const count = dashboardDate(year, month + 1, 0).getUTCDate();
    const [start, end = start] = dashboardDraft;
    document.getElementById('dashboardCalendarMonth').textContent = dashboardMonthFormat.format(dashboardMonth);
    const days = document.getElementById('dashboardCalendarDays');
    const focusedDay = days.contains(document.activeElement) ? document.activeElement.dataset.day : '';
    let markup = '<span></span>'.repeat(dashboardMonth.getUTCDay());
    for (let day = 1; day <= count; day++) {
      const date = dashboardDate(year, month, day);
      const inRange = date >= start && date <= end;
      const edge = +date === +start || +date === +end;
      let selectionClass = edge ? 'range-edge' : inRange ? 'in-range' : '';
      if (+date === +start && start < end && date.getUTCDay() !== 6 && day < count) selectionClass += ' range-start';
      if (+date === +end && start < end && date.getUTCDay() !== 0 && day > 1) selectionClass += ' range-end';
      const current = +date === +dashboardToday ? ' aria-current="date"' : '';
      markup += '<button type="button" data-day="' + day + '" aria-label="' + dashboardDateFormat.format(date) +
        '" aria-pressed="' + inRange + '" class="' + selectionClass + '"' + current + '>' + day + '</button>';
    }
    days.innerHTML = markup;
    if (focusedDay) days.querySelector('[data-day="' + focusedDay + '"]')?.focus();
    document.getElementById('dashboardCalendarSelection').textContent = dashboardDraft.length === 1
      ? 'Start: ' + dashboardDateFormat.format(start) + ' · Choose an end date'
      : describeDashboardRange(dashboardDraft);
  }

  function selectDashboardDay(event) {
    const day = Number(event.target.dataset.day);
    if (!day) return;
    const date = dashboardDate(dashboardMonth.getUTCFullYear(), dashboardMonth.getUTCMonth(), day);
    dashboardDraft = dashboardDraft.length === 1 ? dashboardDraft.concat(date).sort((a, b) => a - b) : [date];
    renderDashboardCalendar();
  }

  function startDashboardDrag(event) {
    const day = Number(event.target.dataset.day);
    if (!day || event.button !== 0 || dashboardDrag) return;
    event.currentTarget.setPointerCapture(event.pointerId);
    dashboardDrag = { pointerId: event.pointerId, startDay: day, lastDay: day, previousDraft: dashboardDraft, moved: false };
  }

  function moveDashboardDrag(event) {
    if (dashboardDrag?.pointerId !== event.pointerId) return;
    const target = document.elementFromPoint(event.clientX, event.clientY);
    if (!target || !event.currentTarget.contains(target)) return;
    const day = Number(target.dataset.day);
    if (!day || day === dashboardDrag.lastDay) return;
    dashboardDrag.lastDay = day;
    dashboardDrag.moved = true;
    const year = dashboardMonth.getUTCFullYear(), month = dashboardMonth.getUTCMonth();
    dashboardDraft = [
      dashboardDate(year, month, Math.min(dashboardDrag.startDay, day)),
      dashboardDate(year, month, Math.max(dashboardDrag.startDay, day))
    ];
    renderDashboardCalendar();
  }

  function finishDashboardDrag(event) {
    if (dashboardDrag?.pointerId !== event.pointerId) return;
    moveDashboardDrag(event);
    const { startDay, moved } = dashboardDrag;
    dashboardDrag = null;
    if (!moved) selectDashboardDay({ target: { dataset: { day: startDay } } });
  }

  function cancelDashboardDrag(event) {
    if (dashboardDrag?.pointerId !== event.pointerId) return;
    dashboardDraft = dashboardDrag.previousDraft;
    dashboardDrag = null;
    renderDashboardCalendar();
  }

  function dashboardPresetRange(preset, today) {
    const year = today.getUTCFullYear(), month = today.getUTCMonth(), day = today.getUTCDate();
    const offset = preset.startsWith('last-') ? -1 : 0;
    switch (preset.replace('last-', '')) {
      case 'week': {
        const monday = day - (today.getUTCDay() + 6) % 7 + offset * 7;
        return [dashboardDate(year, month, monday), dashboardDate(year, month, monday + 6)];
      }
      case 'month':
        return [dashboardDate(year, month + offset, 1), dashboardDate(year, month + offset + 1, 0)];
      case 'year':
        return [dashboardDate(year + offset, 0, 1), dashboardDate(year + offset, 11, 31)];
      default: {
        const date = preset === 'yesterday' ? dashboardDate(year, month, day - 1) : today;
        return [date, date];
      }
    }
  }

  function selectDashboardShortcut(event) {
    const preset = event.target.dataset.preset;
    if (!preset) return;
    dashboardDraft = dashboardPresetRange(preset, dashboardToday);
    const [start, end] = dashboardDraft;
    const visibleDate = dashboardToday >= start && dashboardToday <= end ? dashboardToday : end;
    dashboardMonth = dashboardDate(visibleDate.getUTCFullYear(), visibleDate.getUTCMonth(), 1);
    renderDashboardCalendar();
  }

  function applyDashboardCalendar() {
    const [start, end = start] = dashboardDraft;
    dashboardRange = [start, end];
    renderDashboardPeriod();
    document.getElementById('dashboardCalendar').close();
    loadDashboardOverview();
  }

  function clearDashboardState() {
    Array.from(pageReadCache.keys()).filter(key => key.startsWith('dashboardOverview')).forEach(key => pageReadCache.delete(key));
    document.getElementById('dashboardReturnSummary').close();
    dashboardReturnPdfRequest = null;
    document.getElementById('dashboardReturnDownload').removeAttribute('aria-busy');
    renderDashboardReturnSummary();
    document.getElementById('dashboardReturnMessage').textContent = '';
    document.getElementById('dashboardReturnPeriod').textContent = '';
    renderDashboardOverview();
    document.getElementById('dashboardOverviewStatus').textContent = '';
    document.getElementById('dashboardOverviewRetry').hidden = true;
    document.getElementById('dashboardCalendar').close();
    document.getElementById('dashboardGreeting').textContent = 'Welcome!';
    document.getElementById('dashboardQuote').textContent = '';
    document.getElementById('dashboardPeriodLabel').textContent = 'Date range';
    document.getElementById('dashboardCalendarSelection').textContent = '';
    document.getElementById('dashboardCalendarDays').replaceChildren();
    dashboardToday = dashboardRange = dashboardDraft = dashboardMonth = dashboardDrag = null;
  }
</script>
