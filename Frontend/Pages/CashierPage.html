  <div class="container-fluid p-4" id="terminalWorkspace" style="display:none;">
    <div class="d-flex align-items-center flex-wrap gap-2 flex-shrink-0">
      <button class="btn btn-outline-secondary btn-sm" onclick="toggleShiftReportModal(true, 'report')">Cashier Shift Report</button>
      <button id="cashierManagerReportBtn" class="btn btn-outline-pink btn-sm" style="display:none;" onclick="openManagerReportModal()">Manager Daily Report</button>
      <div class="cashier-petty-cash ms-auto" title="Petty cash received this shift">
        <span>Petty Cash</span> <strong id="cashierPettyCash">₱0.00</strong>

    </div>

            <h6>Add Items</h6>

            </div>

            <div class="mb-4">
              <label class="form-label">Or Search Item Manually</label>

                <input type="text" class="form-control" id="manualItemSearch" placeholder="Type item name, size, or category..." autocomplete="off" oninput="filterManualItemList()" onfocus="filterManualItemList()" onkeydown="handleManualSearchKeydown(event)">

              <button type="button" class="btn btn-dark-custom w-100 mt-2" onclick="addManualItem()">Add to Cart</button>

            <div class="p-3 rounded" style="background-color:#fdfafa; border: 1px solid var(--border-color);">

              <div class="mb-2"><input type="text" class="form-control form-control-sm" id="customName" placeholder="Item Name / Description">
              </div>
              <div class="row g-2 mb-2">
                <div class="col-5">
                  <select
                    id="customSize"
                    class="form-select form-select-sm"

                    <option value="SNE">SNE</option>
                    <option value="MNE">MNE</option>
                    <option value="LNE">LNE</option>
                    <option value="XLNE">XLNE</option>
                    <option value="NO SIZE">NO SIZE</option>
                    <option value="BNE">BNE</option>
                    <option value="SE">SE</option>
                    <option value="ME">ME</option>
                    <option value="LE">LE</option>
                    <option value="XLE">XLE</option>
                    <option value="CUSTOM">Custom </option>
                  </select>

                  <input
                    id="customSizeText"
                    type="text"
                    class="form-control form-control-sm mt-2"
                    placeholder="FREE SIZE"
                    aria-label="Custom size"
                    maxlength="50"
                    hidden
                  >
                </div>
                <div class="col-7"><input type="number" class="form-control form-control-sm text-end" id="customPrice" placeholder="Price (₱)" min="0">
                </div>
              </div>
              <button type="button" class="btn btn-outline-pink btn-sm w-100" onclick="addCustomItem()">Add Custom Item</button>
            </div>
          </fieldset>
          <fieldset class="cashier-actions-footer" data-cashier-controls aria-label="Void and exchange" disabled>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="toggleVoidModal(true)"><span aria-hidden="true">⊘</span> Void</button>
            <button  type="button" class="btn btn-sm btn-outline-secondary" onclick="openCustomerExchangeModal()"><span aria-hidden="true">⇄</span> Exchange</button>
          </fieldset>
        </div>
      </div>

      <div class="col-md-8 h-100">
        <fieldset class="card-pane" data-cashier-controls aria-label="Shopping cart and checkout" disabled>
          <div class="pane-header">
            <h6>Shopping Cart</h6>
            <button class="btn btn-sm text-danger border-0 bg-transparent fw-semibold" onclick="clearCart()">Clear All</button>
          </div>

          <div class="pane-body p-0">
            <table class="table align-middle">

                <tr>
                  <th class="ps-3" style="width:70px;">Image</th>
                  <th>Product</th>
                  <th class="text-center" style="width:80px;">Size</th>
                  <th class="text-center" style="width:80px;">Qty</th>
                  <th class="text-end" style="width:100px;">Price</th>

            </div>
          </div>

          <!-- ===== Optimized Checkout / Summary Section ===== -->
          <div class="summary-box">

              <!-- LEFT: all totals & discount controls -->
              <div class="summary-totals">
                <div class="row mb-1">
                  <div class="col-8 text-end small text-muted">Total Items:</div>
                  <div class="col-4 text-end fw-bold"><span id="totalItemsCountOut">0</span></div>
                </div>

                <div class="row mb-1">
                  <div class="col-8 text-end small text-muted">Subtotal:</div>
                  <div class="col-4 text-end fw-bold">₱<span id="subTotalOut">0.00</span></div>
                </div>

                <div class="row mb-1">
                  <div class="col-8 text-end small text-muted">12% VAT (Included):</div>

                <div class="row align-items-center mt-2">
                  <div class="col-4 text-end small text-muted">Global Discount:</div>
                  <div class="col-4">
                    <select class="form-select form-select-sm text-center" id="globalDiscountType" onchange="updateCashierCartTotals();scheduleCashierSessionSave()">
                        <option value="percentage">% Percentage</option>
                        <option value="amount">Fixed Amount</option>
                      </select>
                  </div>
                  <div class="col-4">
                    <input type="number" class="form-control form-control-sm text-end fw-bold" id="globalDiscountValue" placeholder="0" min="0" oninput="updateCashierCartTotals();scheduleCashierSessionSave()">

                </div>

              <!-- RIGHT: grand total + checkout action -->

                <div class="grand-total-block">

    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center;">
    <div
      style="background: white; padding: 30px; border-radius: 8px; text-align: center; max-width: 400px; width: 90%;">
      <h2 style="color: #28a745; margin-top: 0;">Transaction Complete!</h2>
      <p>Receipt ID: <strong id="successReceiptId"></strong></p>
      <p id="successChangeContainer" style="display: none; font-size: 1.2em;">Change Due:
        <strong id="successChangeGiven" style="color: #d9534f;"></strong></p>
      <button
        type="button"
        class="btn btn-pink mt-3 px-4"
        onclick="startNewTransaction()"
      >
        New Transaction
      </button>
    </div>

<script>

  function toggleCustomItemSize() {
  const input = document.getElementById('customSizeText');
  const isCustom = document.getElementById('customSize').value === 'CUSTOM';

  input.hidden = !isCustom;

  if (isCustom) {
    input.focus();
  } else {
    input.value = '';
  }
}

/* ==========================================================
   CART HELPERS
========================================================== */
  function calculateLineDiscount(item) {
      const lineRawCost = item.price * item.quantity;
      if (item.discountValue <= 0) {
          return 0;
      }
      if (item.discountType === "percentage") {
          return lineRawCost * (item.discountValue / 100);
      }
      return item.discountValue;
  }

  function calculateGlobalDiscount(subtotal){
    const value = parseFloat(document.getElementById("globalDiscountValue").value) || 0;
    const type =document.getElementById("globalDiscountType").value;

    if(value <= 0){
      return 0;}

    if(type === "percentage"){
      return subtotal * value / 100;}
    return value;
  }

  function updateCartSummary(items, subtotal){
    calculatedBaseTotalDue = Math.max(0, subtotal - calculateGlobalDiscount(subtotal));

    const vat = calculatedBaseTotalDue - (calculatedBaseTotalDue / 1.12);

    document.getElementById("totalItemsCountOut").textContent = items;
    document.getElementById("subTotalOut").textContent = subtotal.toFixed(2);
    document.getElementById("vatBreakdownOut").textContent = vat.toFixed(2);
    document.getElementById("grandTotal").textContent = calculatedBaseTotalDue.toFixed(2);
  }

  function restoreCartFocus(tbody, focusInfo){
    if (focusInfo) {
      let selector = `[data-idx="${focusInfo.idx}"][data-field="${focusInfo.field}"]`;
      let target = tbody.querySelector(selector);
      if (target) {
        target.focus();
        if (focusInfo.selStart !== null && target.setSelectionRange) {
          try {
            target.setSelectionRange(focusInfo.selStart, focusInfo.selEnd);
          } catch (e) {}
        }
      }
    }
  }
  
  function cashierItemDisplayName(item) {
    const name = String(item && item.name || '').trim();
    return String(item && item.priceSource || '').toUpperCase() === 'SALE' && !/\s(?:·\s*)?SALE$/i.test(name)
      ? name + ' · SALE'
      : name;
  }

  var cashierSessionSaveTimer = null;
  function scheduleCashierSessionSave() {
    clearTimeout(cashierSessionSaveTimer);
    const owner = currentEmployee;
    cashierSessionSaveTimer = setTimeout(function() {
      if (owner && owner === currentEmployee) saveSession();
    }, 180);
  }
  function updateCashierCartTotals() {
    let subtotal = 0, quantity = 0;
    const rows = document.getElementById('cartRows').rows;
    cart.forEach(function(item, index) {
      const net = item.reservationReceiptId ? Number(item.balanceDue) : Math.max(0, item.price * item.quantity - calculateLineDiscount(item));
      subtotal += net; quantity += Number(item.quantity) || 0;
      if (rows[index]) rows[index].cells[6].textContent = '₱' + net.toFixed(2);
    });
    calculatedBaseTotalDue = Math.max(0, subtotal - (cartReservation() ? 0 : calculateGlobalDiscount(subtotal)));
    document.getElementById('totalItemsCountOut').textContent = quantity;
    document.getElementById('subTotalOut').textContent = subtotal.toFixed(2);
    document.getElementById('vatBreakdownOut').textContent = (calculatedBaseTotalDue - calculatedBaseTotalDue / 1.12).toFixed(2);
    document.getElementById('grandTotal').textContent = calculatedBaseTotalDue.toFixed(2);
  }

  function renderCart() {
    updateReservationCartControls();
    let tbody = document.getElementById("cartRows");
    let activeEl = document.activeElement;
    let focusInfo = null;
    if (
      activeEl &&
      activeEl.hasAttribute &&
      activeEl.hasAttribute("data-idx") &&
      tbody.contains(activeEl)
    ) {
      focusInfo = {
        idx: activeEl.getAttribute("data-idx"),
        field: activeEl.getAttribute("data-field"),
        selStart:
          typeof activeEl.selectionStart === "number"
            ? activeEl.selectionStart
            : null,
        selEnd:
          typeof activeEl.selectionEnd === "number"
            ? activeEl.selectionEnd
            : null,
      };
      saveSession();
    }

    tbody.innerHTML = "";

    if (cart.length === 0) {

      document.getElementById(
        "emptyCartMessage"
      ).style.display = "block";

      updateCartSummary(0, 0);

      calculatedBaseTotalDue = 0;

      return;
    }

    document.getElementById("emptyCartMessage").style.display = "none";
    let subtotalAccumulator = 0;
    let itemQuantityAccumulator = 0;

    const fragment = document.createDocumentFragment();
    cart.forEach((item, index) => {
      itemQuantityAccumulator += Number(item.quantity) || 0;
      let lineRawCost = item.price * item.quantity;
      const isSaleItem = String(item.priceSource || "").toUpperCase() === "SALE";
      const calculatedLineDiscount = calculateLineDiscount(item);

      let lineNetValue = item.reservationReceiptId ? Number(item.balanceDue) : Math.max(0, lineRawCost - calculatedLineDiscount);
      subtotalAccumulator += lineNetValue;

      let tr = document.createElement("tr");
      let imgTag = item.imageUrl
        ? `<button type="button" class="btn p-0 cart-photo" aria-label="View product image" title="View product image"><img loading="lazy" decoding="async" src="${escapeInventoryHtml(item.imageUrl)}" alt="${escapeInventoryHtml(item.name || item.code)}" class="cart-img"></button>`
        : `<div class="cart-img bg-light border d-flex align-items-center justify-content-center text-muted small" style="font-size:10px;">No Img</div>`;

      tr.innerHTML = `
            <td class="ps-3">${imgTag}</td>
            <td><div class="fw-bold${isSaleItem ? " text-danger" : ""}">${escapeInventoryHtml(
              cashierItemDisplayName(item)
            )}</div><div class="small${isSaleItem ? " text-danger" : " text-muted"}">${escapeInventoryHtml(item.code)}</div>${cashierBundleKind(item) ? `<select class="form-select form-select-sm mt-1 cart-bundle-select" aria-label="Bundle code for ${escapeInventoryHtml(item.name || item.code)}" data-idx="${index}" data-field="bundle"><option value="">${escapeInventoryHtml(item.bundleSelection ? item.bundleSelection.label : 'Loading bundle codes…')}</option></select>${item.bundleSelection ? `<div class="small text-muted text-break">${escapeInventoryHtml(item.bundleSelection.deliveryId)}</div>` : ''}` : ''}</td>
            <td class="text-center fw-semibold">${item.size || ""}</td>
            <td class="text-center">
              <input type="number" class="form-control form-control-sm text-center mx-auto" style="width:60px; font-weight:600;" value="${
                item.quantity
              }" min="1" ${cashierBundleKind(item)&&!item.bundleUnlinked ? `max="${cashierBundleQuantityLimit(item,index)}"${cashierBundleKind(item) === 'FULL' ? ' readonly aria-label="One bundle per cart row"' : ''}` : ''} data-idx="${index}" data-field="qty" onchange="updateQty(${index}, this.value)">
            </td>
            <td class="text-end fw-semibold">₱${item.price.toFixed(2)}</td>
            <td>
              <div class="input-group input-group-sm mx-auto" style="width:130px;">
                <select class="form-select p-1 text-center" style="font-size:11px;" data-idx="${index}" data-field="discountType" onchange="changeDiscountType(${index}, this.value)">
                  <option value="percentage" ${
                    item.discountType === "percentage" ? "selected" : ""
                  }>%</option>
                  <option value="amount" ${
                    item.discountType === "amount" ? "selected" : ""
                  }>₱</option>
                </select>
                <input type="text" inputmode="decimal" class="form-control text-end p-1 fw-bold" style="font-size:12px;" value="${
                  item.discountValue || ""
                }" placeholder="0" data-idx="${index}" data-field="discount" oninput="updateDiscountValue(${index}, this.value)">
              </div>
            </td>
            <td class="text-end fw-bold pe-3">₱${lineNetValue.toFixed(2)}</td>
            <td><button class="btn btn-sm text-danger p-0 border-0 bg-transparent fw-bold" onclick="removeItem(${index})">✕</button></td>
          `;
      const photo = tr.querySelector('.cart-photo');
      if (photo) {
        photo.addEventListener('click', () => openInventoryImageViewer(item));
      }
      fragment.appendChild(tr);
    });
    tbody.appendChild(fragment);
    tbody.querySelectorAll('.cart-bundle-select').forEach(select => {
      const item=cart[Number(select.dataset.idx)];
      loadCashierCartBundleOptions(select,item);
      select.addEventListener('focus',()=>{
        if(!select.bundleChoices||select.bundleState!==cashierCartBundleState())loadCashierCartBundleOptions(select,item);
      });
      select.addEventListener('change',()=>selectCashierCartBundle(select,item));
    });

    const globalReduction = cartReservation() ? 0 : calculateGlobalDiscount(subtotalAccumulator);

    calculatedBaseTotalDue = Math.max(0, subtotalAccumulator - globalReduction);
    let includedVatAmount =
      calculatedBaseTotalDue - calculatedBaseTotalDue / 1.12;

    document.getElementById("totalItemsCountOut").textContent =
      itemQuantityAccumulator;
    document.getElementById("subTotalOut").textContent =
      subtotalAccumulator.toFixed(2);
    document.getElementById("vatBreakdownOut").textContent =
      includedVatAmount.toFixed(2);
    document.getElementById("grandTotal").textContent =
      calculatedBaseTotalDue.toFixed(2);

    if (cartReservation()) tbody.querySelectorAll('input,select').forEach(input => input.disabled = true);
    restoreCartFocus(
    tbody,
    focusInfo
    );
  }

  // Scanner Input Automation Keydown Listener
document
  .getElementById("codeInput")
  .addEventListener("keydown", function (e) {

    if (e.key !== "Enter") {
      return;
    }

    e.preventDefault();

    const scannedCode =
      this.value.trim();

    if (!scannedCode) {
      return;
    }

    if (cashierIndexedInventory !== masterInventory) indexCashierInventory(masterInventory);
    const matchingItems = cashierBarcodeIndex.get(scannedCode) || [];
    if (matchingItems.length > 1) {
      const search = document.getElementById('manualItemSearch');
      search.value = scannedCode;
      filterManualItemList();
      search.focus();
      showNotificationToast('Choose a price for ' + matchingItems[0].name + '.');
      this.value = '';
      return;
    }
    const foundItem = matchingItems[0];


    if (foundItem) {

      addItemToCart(
        foundItem,
        false
      );

      showNotificationToast(
        "Added: " + foundItem.name
      );

    } else {

      showNotificationToast(
        "Code " +
        scannedCode +
        " not found.",
        true
      );

    }


    this.value = "";

    saveSession();

  });

  function updateQty(index, val) {
    let qty = parseInt(val) || 1;
    if (cashierBundleKind(cart[index]) && qty > cashierBundleQuantityLimit(cart[index],index)) {
      showNotificationToast('That quantity exceeds the selected bundle. Add another bundle separately.',true);
      renderCart();return;
    }
    cart[index].quantity = qty <= 0 ? 1 : qty;
    if (!cart[index].isCustom && cart[index].quantity > (Number(cart[index].stock) || 0)) {
      showNotificationToast(
        `Warning: only ${Number(cart[index].stock) || 0} available. Sale is still allowed.`,
        true,
      );
    }
    const quantityInput = document.querySelector('#cartRows [data-idx="' + index + '"][data-field="qty"]');
    if (quantityInput) quantityInput.value = cart[index].quantity;
    updateCashierCartTotals();
    scheduleCashierSessionSave();
  }

    function changeDiscountType(index, type) {
    cart[index].discountType = type;
    updateCashierCartTotals();
    scheduleCashierSessionSave();
  }

  function updateDiscountValue(index, val) {
    let cleaned = val.replace(/[^0-9.]/g, "");
    cart[index].discountValue = parseFloat(cleaned) || 0;
    updateCashierCartTotals();
    scheduleCashierSessionSave();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function clearCart() {
    cart = [];
    document.getElementById("globalDiscountValue").value = "";
    document.getElementById("globalDiscountType").value = "percentage";
    renderCart();
  }

function cashierBundleKind(item) {
  if (item.bundleKind) return item.bundleKind;
  const category=String(item.category||'').trim().toUpperCase().replace(/^WHOLE\s+SALE$/,'WHOLESALE');
  const name=String(item.name||'').trim().toUpperCase().replace(/\s+/g,' ').replace(/\s*[·-]\s*SALE$/,'');
  if(category==='WHOLESALE'&&/ · \([1-9]\d*\) PCS$/.test(name))return 'FULL';
  if(['PINS','OTHERS'].includes(category))return name==='BUNDLE'?'FULL':name==='HALF BUNDLE'?'HALF':'';
  return '';
}
function cashierBundleKey(selection) {
  return JSON.stringify([selection.deliveryId,Number(selection.sheetRow),Number(selection.bundleNo)]);
}
function cashierBundleQuantityLimit(item,index) {
  const choice=item.bundleSelection;
  if(!choice)return item.bundleUnlinked?Infinity:cashierBundleKind(item)==='FULL'?1:cashierBundleKind(item)==='HALF'?2:Infinity;
  const others=cart.filter((line,i)=>i!==index&&line.bundleSelection&&cashierBundleKey(line.bundleSelection)===cashierBundleKey(choice));
  if(others.some(line=>line.bundleSelection.kind==='FULL')||(choice.kind==='FULL'&&others.length))return 0;
  return Math.max(0,Number(choice.capacity)||1)-others.reduce((sum,line)=>sum+(Number(line.quantity)||0),0);
}

var cashierCartBundleCache=null;
function cashierCartBundleState() {
  const owner=currentEmployee&&currentEmployee.dashboardToken||'';
  const version=typeof inventoryDataset==='undefined'?'':inventoryDataset.version||'';
  if(!cashierCartBundleCache||cashierCartBundleCache.owner!==owner||cashierCartBundleCache.version!==version){
    if(cashierCartBundleCache)clearTimeout(cashierCartBundleCache.timer);
    cashierCartBundleCache={owner:owner,version:version,choices:new Map(),pending:new Map(),preloadCodes:[],preloading:false,timer:null};
  }
  return cashierCartBundleCache;
}
function rememberCashierCartBundleChoices(code,result) {
  cashierCartBundleState().choices.set(String(code),result);
}
function getCashierCartBundleChoices(code,refresh) {
  const state=cashierCartBundleState(),key=String(code),cached=state.choices.get(key);
  if(!refresh&&cached)return Promise.resolve(cached);
  if(state.pending.has(key))return state.pending.get(key);
  const promise=new Promise((resolve,reject)=>{
    secureScriptRun.withSuccessHandler(result=>{
      if(!result||!result.success)return reject(new Error(result&&result.message||'Unable to load bundle codes.'));
      if(state!==cashierCartBundleState())return reject(new Error('Inventory changed. Choose a bundle again.'));
      rememberCashierCartBundleChoices(key,result);resolve(result);
    }).withFailureHandler(reject).getCashierBundleChoices(code);
  });
  state.pending.set(key,promise);
  promise.finally(()=>{if(state.pending.get(key)===promise)state.pending.delete(key);}).catch(()=>{});
  return promise;
}
function preloadCashierBundleCodes(items) {
  if(!currentEmployee||!currentSessionIsCashier)return;
  const state=cashierCartBundleState();
  const codes=items.filter(item=>cashierBundleKind(item)&&Number(item.stock)>0&&Number(item.price)>0).map(item=>String(item.code));
  state.preloadCodes=Array.from(new Set([...state.preloadCodes,...codes])).filter(code=>!state.choices.has(code));
  if(state.preloading||!state.preloadCodes.length)return;
  state.preloading=true;
  function next(){
    if(state!==cashierCartBundleState()||!currentEmployee||!currentSessionIsCashier)return;
    if(typeof workspaceForegroundLoading==='function'&&workspaceForegroundLoading()){
      state.timer=setTimeout(next,250);return;
    }
    const code=state.preloadCodes.shift();
    if(!code){state.preloading=false;return;}
    getCashierCartBundleChoices(code).catch(()=>{}).finally(()=>{
      if(state===cashierCartBundleState())state.timer=setTimeout(next,75);
    });
  }
  state.timer=setTimeout(next,75);
}
function loadCashierCartBundleOptions(select,item,refresh=false) {
  const state=cashierCartBundleState();
  const current=()=>select.isConnected&&cart.includes(item)&&state===cashierCartBundleState();
  getCashierCartBundleChoices(item.code,refresh).then(result=>{
    if(!current())return;
    const unlinked=result.managed===false;
    if(!!item.bundleUnlinked!==unlinked){item.bundleUnlinked=unlinked;renderCart();saveSession();return;}
    const index=cart.indexOf(item),quantity=Number(item.quantity)||1;
    const choices=(result.choices||[]).filter(choice=>cashierBundleQuantityLimit({bundleSelection:choice},index)>=quantity);
    select.bundleChoices=choices;select.bundleState=state;select.replaceChildren();
    const placeholder=document.createElement('option');placeholder.value='';
    placeholder.textContent=result.managed===false?'No linked bundle':choices.length?'Select bundle code':'No available bundle codes';
    select.appendChild(placeholder);
    choices.forEach(choice=>{
      const option=document.createElement('option');option.value=cashierBundleKey(choice);option.textContent=choice.label;
      option.title=choice.deliveryId+' · '+(choice.deliveryDate||'');select.appendChild(option);
    });
    const selected=item.bundleSelection&&choices.find(choice=>cashierBundleKey(choice)===cashierBundleKey(item.bundleSelection));
    if(selected)select.value=cashierBundleKey(selected);
    else if(item.bundleSelection)placeholder.textContent='Selected bundle unavailable';
    select.disabled=result.managed===false||!!cartReservation();select.title='';
  }).catch(error=>{
    if(!current())return;
    select.title=error.message||String(error);
    if(!select.bundleChoices){select.options[0].textContent='Unable to load bundle codes';select.value='';}
    if(refresh)showNotificationToast(select.title,true);
  });
}
function selectCashierCartBundle(select,item) {
  const index=cart.indexOf(item),choice=(select.bundleChoices||[]).find(choice=>cashierBundleKey(choice)===select.value);
  if(index<0||cartReservation())return;
  if(!choice){renderCart();return;}
  if(cashierBundleQuantityLimit({bundleSelection:choice},index)<(Number(item.quantity)||1)){
    showNotificationToast('This bundle is already selected in the cart. Choose another bundle.',true);renderCart();return;
  }
  const base=item.bundleBaseVariantKey||item.variantKey||item.code;
  Object.assign(item,{bundleSelection:{...choice},bundleKind:choice.kind,bundleBaseVariantKey:base,variantKey:base+'|BUNDLE|'+cashierBundleKey(choice)});
  renderCart();saveSession();
}
function cashierCartBundlesReady() {
  const state=cashierCartBundleState();
  const index=cart.findIndex(item=>{
    if(item.isCustom||!cashierBundleKind(item))return false;
    const result=state.choices.get(String(item.code));
    if(result&&result.managed===false)return false;
    return !result||!item.bundleSelection||!result.choices.some(choice=>cashierBundleKey(choice)===cashierBundleKey(item.bundleSelection))||
      (Number(item.quantity)||1)>cashierBundleQuantityLimit(item,cart.indexOf(item));
  });
  if(index<0)return true;
  showNotificationToast('Choose an available bundle code in the cart for '+cart[index].name+'.',true);
  const select=document.querySelector('#cartRows .cart-bundle-select[data-idx="'+index+'"]');
  if(select){loadCashierCartBundleOptions(select,cart[index]);select.focus();}
  return false;
}

var cashierSearchRows = [];
var cashierBarcodeIndex = new Map();
var cashierIndexedInventory = null;

function cashierInventoryCacheKey() { return new Date().toLocaleDateString('en-CA'); }
function indexCashierInventory(items) {
  cashierIndexedInventory = items;
  cashierBarcodeIndex = new Map();
  cashierSearchRows = items.map(function(item, index) {
    const code = String(item.code || '').trim();
    const category = String(item.category || '').trim().toUpperCase().replace(/^WHOLE\s+SALE$/, 'WHOLESALE');
    const aliases = category === 'WHOLESALE' ? 'bundle bundles wholesale whole sale' : '';
    if (!cashierBarcodeIndex.has(code)) cashierBarcodeIndex.set(code, []);
    cashierBarcodeIndex.get(code).push(item);
    return {item:item, index:index, searchText:[item.name, item.size, item.category, code, aliases].join(' ').toLowerCase()};
  });
  preloadCashierBundleCodes(items);
}
function rememberCashierInventory(items) {
  const read = beginPageRead('cashierInventory', cashierInventoryCacheKey());
  masterInventory = Array.isArray(items) ? items : [];
  read.save(masterInventory);
  populateManualDropdown(masterInventory);
  finishWorkspacePageLoad('posPage');
}
function refreshInventory(callback) {
  const read = beginPageRead('cashierInventory', cashierInventoryCacheKey(), true);
  if (!read.shouldFetch) {
    if (read.cached !== undefined) {
      if (masterInventory !== read.cached) {
        masterInventory = read.cached;
        populateManualDropdown(masterInventory);
      }
      if (callback) callback();
      finishWorkspacePageLoad('posPage');
    } else if (callback) {
      const pending = pageReadCache.get('cashierInventory');
      if (pending) (pending.callbacks || (pending.callbacks = [])).push(callback);
    }
    return;
  }
  const entry = pageReadCache.get('cashierInventory');
  entry.callbacks = callback ? [callback] : [];
  secureScriptRun.withSuccessHandler(function(data) {
    if (!read.current()) return;
    masterInventory = Array.isArray(data) ? data : [];
    read.save(masterInventory);
    populateManualDropdown(masterInventory);
    entry.callbacks.forEach(done => done());
    entry.callbacks = [];
    finishWorkspacePageLoad('posPage');
  }).withFailureHandler(function(error) {
    if (!read.current()) return;
    read.fail();
    pageReadCache.delete('cashierInventory');
    entry.callbacks = [];
    finishWorkspacePageLoad('posPage');
    showNotificationToast(error.message || 'Failed to load inventory.', true);
  }).getSellableInventory();
}

  function populateManualDropdown(items) {
    indexCashierInventory(Array.isArray(items) ? items : masterInventory);
    document.getElementById("manualItemSearch").value = "";
    document.getElementById("manualItemSelect").value = "";
    manualSearchHighlightIndex = -1;
    let resultsBox = document.getElementById("manualItemResults");
    resultsBox.innerHTML = "";
    resultsBox.style.display = "none";
  }

  // Renders the filtered, clickable list under the search box.
  function filterManualItemList() {
    let query = document
      .getElementById("manualItemSearch")
      .value.trim()
      .toLowerCase();
    let resultsBox = document.getElementById("manualItemResults");

    if (!masterInventory || masterInventory.length === 0) {
      resultsBox.innerHTML =
        '<div class="list-group-item small text-muted">No items registered</div>';
      resultsBox.style.display = "block";
      return;
    }

    if (cashierIndexedInventory !== masterInventory) indexCashierInventory(masterInventory);
    const matches = [];
    for (const entry of cashierSearchRows) {
      if (!query || entry.searchText.includes(query)) matches.push(entry);
      if (matches.length === 50) break;
    }

    manualSearchHighlightIndex = -1;

    if (matches.length === 0) {
      resultsBox.innerHTML =
        '<div class="list-group-item small text-muted">No matching items</div>';
      resultsBox.style.display = "block";
      return;
    }

    resultsBox.innerHTML = matches
      .map(
        ({ item, index }, pos) => `
          <button type="button" class="list-group-item list-group-item-action small py-2${item.priceSource === 'SALE' ? ' text-danger' : ''}" data-pos="${pos}" data-inventory-index="${index}" onclick="selectManualItem(${index})">
            <span class="fw-semibold">[${escapeInventoryHtml(item.category)}] ${escapeInventoryHtml(item.name)}</span>
            <span class="${item.priceSource === 'SALE' ? 'text-danger' : 'text-muted'}"> (${escapeInventoryHtml(item.size)}) - ₱${item.price.toFixed(
          2,
        )}${item.priceSource === 'SALE' ? ' · SALE' : ''}</span>
          </button>
        `,
      )
      .join("");
    resultsBox.style.display = "block";
  }

  // Arrow-key navigation + Enter-to-select within the results list.
  function handleManualSearchKeydown(e) {
    let resultsBox = document.getElementById("manualItemResults");
    if (resultsBox.style.display === "none") return;
    let options = Array.from(
      resultsBox.querySelectorAll("[data-inventory-index]"),
    );
    if (options.length === 0) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      manualSearchHighlightIndex = Math.min(
        manualSearchHighlightIndex + 1,
        options.length - 1,
      );
      highlightManualOption(options);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      manualSearchHighlightIndex = Math.max(manualSearchHighlightIndex - 1, 0);
      highlightManualOption(options);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (
        manualSearchHighlightIndex >= 0 &&
        options[manualSearchHighlightIndex]
      ) {
        let invIndex = parseInt(
          options[manualSearchHighlightIndex].getAttribute(
            "data-inventory-index",
          ),
        );
        selectManualItem(invIndex);
      } else if (options.length === 1) {
        let invIndex = parseInt(
          options[0].getAttribute("data-inventory-index"),
        );
        selectManualItem(invIndex);
      }
    } else if (e.key === "Escape") {
      resultsBox.style.display = "none";
    }
  }

  function highlightManualOption(options) {
    options.forEach((el, pos) => {
      el.classList.toggle(
        "active-highlight",
        pos === manualSearchHighlightIndex,
      );
    });
    let activeEl = options[manualSearchHighlightIndex];
    if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
  }

  // Called when a result row is clicked (or selected via Enter).
function selectManualItem(index) {

  const item =
    masterInventory[index];

  if (!item) {
    return;
  }


  document.getElementById(
    "manualItemSearch"
  ).value =
    `${item.name}` +
    `${item.size ? " (" + item.size + ")" : ""}` +
    ` - ₱${Number(item.price || 0).toFixed(2)}`;


  document.getElementById(
    "manualItemSelect"
  ).value =
    String(index);


  document.getElementById(
    "manualItemResults"
  ).style.display =
    "none";


  manualSearchHighlightIndex =
    -1;

}

  // Close the results dropdown when clicking outside of it.
  document.addEventListener("click", function (e) {
    let wrapper = document
      .getElementById("manualItemSearch")
      .closest(".item-search-wrapper");
    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById("manualItemResults").style.display = "none";
    }
  });

  function addManualItem() {

  const selectInput =
    document.getElementById(
      "manualItemSelect"
    );

  const searchInput =
    document.getElementById(
      "manualItemSearch"
    );

  const resultsBox =
    document.getElementById(
      "manualItemResults"
    );


  const indexStr =
    selectInput.value;


  if (indexStr === "") {

    showNotificationToast(
      "Please search and select an item first.",
      true
    );

    searchInput.focus();

    return;
  }


  const index =
    parseInt(indexStr, 10);

  const selectedItem =
    masterInventory[index];


  if (!selectedItem) {

    showNotificationToast(
      "Selected inventory item could not be found.",
      true
    );

    resetManualItemSearch();

    return;
  }


  addItemToCart(
    selectedItem,
    false
  );


  resetManualItemSearch();


  // Immediately ready for another product
  searchInput.focus();

}

function resetManualItemSearch() {

  const searchInput =
    document.getElementById(
      "manualItemSearch"
    );

  const selectInput =
    document.getElementById(
      "manualItemSelect"
    );

  const resultsBox =
    document.getElementById(
      "manualItemResults"
    );


  searchInput.value = "";

  selectInput.value = "";

  resultsBox.innerHTML = "";

  resultsBox.style.display =
    "none";

  manualSearchHighlightIndex =
    -1;

}

  function addCustomItem() {
    let name = document.getElementById("customName").value.trim();
    const selectedSize = document.getElementById('customSize').value;
    const sizeInput = selectedSize === 'CUSTOM'
      ? document.getElementById('customSizeText').value.trim().toUpperCase()
      : selectedSize;

    if (selectedSize === 'CUSTOM' && !sizeInput) {
      showNotificationToast('Enter the custom size.', true);
      return;
    }

    let size = sizeInput;
    let price = parseFloat(document.getElementById("customPrice").value);
    if (!name || isNaN(price) || price < 0) {
      showNotificationToast(
        "Please check structural breakdown text parameters.",
        true,
      );
      return;
    }
    let category = sizeInput ? "YourFinds" : "Others";
    addItemToCart(
      {
        code: "CUSTOM-" + Date.now().toString().slice(-5),
        name: name,
        size: size,
        price: price,
        stock: 999,
        category: category,
      },
      true,
    );
    document.getElementById("customName").value = "";
    document.getElementById("customSize").value = "";
    toggleCustomItemSize();
    document.getElementById("customPrice").value = "";
  }

function addItemToCart(
  product,
  isCustom
) {

  if (cartReservation()) return showNotificationToast('Complete or remove the reserved item before adding other items.', true);

  const productCode =
    String(product.code || "").trim();


  let existingItem = null;


  if (!isCustom && (!cashierBundleKind(product) || product.bundleSelection || product.bundleUnlinked)) {

    existingItem =
      cart.find(function(item) {

        return String(item.variantKey || item.code || "").trim() ===
          String(product.variantKey || productCode).trim();

      });

  }


  if (existingItem) {
    if(existingItem.bundleSelection&&existingItem.quantity>=cashierBundleQuantityLimit(existingItem,cart.indexOf(existingItem))){
      showNotificationToast('This bundle is already selected. Choose another bundle.',true);return;
    }

    existingItem.quantity++;

  } else {

    cart.push({

      code:
        productCode,

      name:
        product.name || "",

      size:
        product.size || "",

      price:
        Number(product.price) || 0,

      stock:
        Number(product.stock) || 0,

      imageUrl:
        product.imageUrl || "",

      inventoryType:
        product.inventoryType || "STOCK",

      quantity:
        1,

      discountType:
        "percentage",

      discountValue:
        0,

      isCustom:
        !!isCustom,

      category:
        product.category || "Others",

      variantKey:
        product.variantKey || productCode,

      priceSource:
        product.priceSource || (isCustom ? "MANUAL" : "REGULAR"),

      saleReferenceId:
        product.saleReferenceId || "",

      bundleKind:product.bundleKind || cashierBundleKind(product),
      bundleSelection:product.bundleSelection || null,
      bundleUnlinked:!!product.bundleUnlinked,
      bundleBaseVariantKey:product.bundleBaseVariantKey || product.variantKey || productCode

    });

  }

  if (!isCustom) {
    const availableStock = Number(product.stock) || 0;
    const requestedQuantity = existingItem ? existingItem.quantity : 1;
    if (requestedQuantity > availableStock) {
      showNotificationToast(
        `Warning: ${product.name || productCode} has ${availableStock} available. Sale is still allowed.`,
        true,
      );
    }
  }


  renderCart();

  saveSession();

}

function startNewTransaction() {

  const successModal =
    document.getElementById("successModal");

  if (successModal) {
    successModal.style.display = "none";
  }


  /* RESET SUCCESS DISPLAY */

  const receiptOutput =
    document.getElementById(
      "successReceiptId"
    );

  if (receiptOutput) {
    receiptOutput.textContent = "";
  }


  const changeOutput =
    document.getElementById(
      "successChangeGiven"
    );

  if (changeOutput) {
    changeOutput.textContent = "";
  }


  const changeContainer =
    document.getElementById(
      "successChangeContainer"
    );

  if (changeContainer) {
    changeContainer.style.display = "none";
  }


  /* RESET CART */

  cart = [];

  document.getElementById(
    "globalDiscountValue"
  ).value = "";

  document.getElementById(
    "globalDiscountType"
  ).value = "percentage";

  renderCart();

  saveSession();


  /* GET LATEST STOCK */

  refreshInventory(function() {

    renderCart();

    const codeInput =
      document.getElementById(
        "codeInput"
      );

    if (codeInput) {

      codeInput.value = "";

      codeInput.focus();

    }

  });

}
  function getCashierShiftDownloadKey() {
    const day = new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD in local time
    return `cashierShiftReportDownloaded_${day}_${currentCashier}`;
  }
