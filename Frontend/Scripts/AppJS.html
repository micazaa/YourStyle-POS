<script>

  var pageReadCache = new Map();
  function invalidateDeliveryItemCaches() {
    invalidateBundleDistributionDetails();
    ['standardDeliveryDetails', 'deliveryItems', 'deliveryDetails', 'deliveryLabels', 'exchangeProducts', 'cashierInventory'].forEach(key => pageReadCache.delete(key));
    if(currentEmployee&&typeof deliveriesPageData!=='undefined')preloadDeliveryDetails(deliveriesPageData);
  }
  let deliveryCatalogCache = null;
  let deliveryCatalogPending = null;
  function cachedDeliveryCatalog() {
    return currentEmployee && deliveryCatalogCache && deliveryCatalogCache.owner === currentEmployee.dashboardToken ? deliveryCatalogCache.products : null;
  }
  function rememberDeliveryCatalog(products) {
    deliveryCatalogCache = {owner:currentEmployee.dashboardToken, products:products};
  }
  function invalidateDeliveryCatalog() {
    deliveryCatalogCache = null;deliveryCatalogPending = null;
  }
  function warmDeliveryCatalog() {
    if (currentEmployee) getDeliveryCatalog().catch(function() {});
  }
  function deliveryCatalogAffectedByPatch(patch) {
    const products = cachedDeliveryCatalog();
    if (!products && !deliveryCatalogPending) return false;
    const codes = new Set((products || []).map(product => String(product.productCode)));
    if (patch.removedCodes.some(code => !products || codes.has(String(code)))) return true;
    const previous = new Map(inventoryDataset.items.map(item => [String(item.code), item]));
    return patch.items.some(item => {
      const old = previous.get(String(item.code));
      if (String(item.inventoryType).toUpperCase() !== 'STOCK' && String(old && old.inventoryType).toUpperCase() !== 'STOCK') return false;
      return !old || old.name !== item.name || String(old.category).toUpperCase() !== String(item.category).toUpperCase() ||
        old.productStatus !== item.productStatus || Number(old.regularPrice ?? old.price) !== Number(item.regularPrice ?? item.price);
    });
  }
  function getDeliveryCatalog() {
    const cached = cachedDeliveryCatalog();
    if (cached) return Promise.resolve({success:true, products:cached});
    if (!currentEmployee) return Promise.reject(new Error('Please sign in to load products.'));
    const owner = currentEmployee.dashboardToken;
    if (deliveryCatalogPending && deliveryCatalogPending.owner === owner) return deliveryCatalogPending.promise;
    const request = {owner:owner};
    request.promise = new Promise((resolve, reject) => {
      secureScriptRun.withSuccessHandler(result => {
        if (!currentEmployee || currentEmployee.dashboardToken !== owner) return reject(new Error('Account changed. Reopen the delivery.'));
        if (deliveryCatalogPending !== request) {getDeliveryCatalog().then(resolve, reject);return;}
        const current = deliveryCatalogPending === request;
        if (current) deliveryCatalogPending = null;
        if (!result || !result.success) return reject(new Error(result && result.message || 'Unable to load products.'));
        if (current) rememberDeliveryCatalog(result.products || []);
        resolve(result);
      }).withFailureHandler(error => {if(deliveryCatalogPending===request)deliveryCatalogPending=null;reject(error);}).getYourStyleDeliveryProducts();
    });
    deliveryCatalogPending = request;
    return request.promise;
  }

  function beginPageRead(view, key = '', reuse = false) {
    const employee = currentEmployee;
    const owner = JSON.stringify([employee, typeof currentCashier === 'undefined' ? '' : currentCashier]);
    const previous = pageReadCache.get(view);
    const matching = previous && previous.owner === owner && previous.key === key;
    if (reuse && matching && (previous.pending || previous.data !== undefined)) {
      return { cached: previous.data, shouldFetch: false };
    }
    const entry = { owner, key, pending: true, data: previous && previous.owner === owner && previous.key === key ? previous.data : undefined };
    pageReadCache.set(view, entry);
    return {
      cached: entry.data,
      shouldFetch: true,
      fail: () => { entry.pending = false; },
      current: () => pageReadCache.get(view) === entry && !!currentEmployee && JSON.stringify([currentEmployee, typeof currentCashier === 'undefined' ? '' : currentCashier]) === owner,
      save: data => { entry.data = data; entry.pending = false; }
    };
  }

  var workspacePreloadState = null;
  var workspaceTableStates = new Map();

  function setWorkspaceTableLoading(pageId, busy, error = '') {
    const page = document.getElementById(pageId), owner = currentEmployee && currentEmployee.dashboardToken;
    let state = workspaceTableStates.get(pageId);
    if (!state || state.owner !== owner) {
      if (state) state.buttons.forEach((disabled, button) => {button.disabled = disabled;});
      state = {owner: owner, loaded: false, buttons: new Map()};
      workspaceTableStates.set(pageId, state);
    }
    if (!busy && !error) state.loaded = true;
    const initial = !state.loaded, content = page.querySelector('[data-page-content]');
    const loading = page.querySelector('[data-page-loading]'), failure = page.querySelector('[data-page-error]');
    content.hidden = initial && (busy || !!error);
    content.inert = content.hidden;
    content.setAttribute('aria-busy', String(busy));
    content.querySelectorAll('table').forEach(table => {table.inert = busy;});
    loading.hidden = !initial || !busy;
    loading.innerHTML = initial && busy ? loadingIndicator(loading.dataset.pageLoading) : '';
    failure.hidden = !initial || !error;
    failure.querySelector('[data-page-error-message]').textContent = error;
    page.querySelectorAll('[data-page-header-actions] button').forEach(button => {
      if (initial && busy) {
        if (!state.buttons.has(button)) state.buttons.set(button, button.disabled);
        button.disabled = true;
      } else if (state.buttons.has(button)) {
        button.disabled = state.buttons.get(button);state.buttons.delete(button);
      }
    });
  }

  function resetWorkspacePreload() {
    clearTimeout(workspacePreloadState && workspacePreloadState.timer);
    workspacePreloadState = null;
    workspaceTableStates.forEach(state => state.buttons.forEach((disabled, button) => {button.disabled = disabled;}));
    workspaceTableStates.clear();
  }

  function prioritizeWorkspacePage(pageId) {
    if (!currentEmployee) return;
    const owner = currentEmployee.dashboardToken;
    if (!workspacePreloadState || workspacePreloadState.owner !== owner) {
      resetWorkspacePreload();
      workspacePreloadState = {owner: owner, started: false, timer: null};
    }
    clearTimeout(workspacePreloadState.timer);
    workspacePreloadState.page = pageId;
    workspacePreloadState.waiting = true;
    scheduleWorkspacePreload();
  }

  function workspaceForegroundLoading() {
    return !!(workspacePreloadState && currentEmployee && workspacePreloadState.owner === currentEmployee.dashboardToken && workspacePreloadState.waiting);
  }

  function finishWorkspacePageLoad(pageId) {
    const state = workspacePreloadState;
    if (!state || !currentEmployee || state.owner !== currentEmployee.dashboardToken || state.page !== pageId) return;
    state.waiting = false;
    warmDeliveryCatalog();
    if (state.started) {preloadHistoryAndReports();return;}
    scheduleWorkspacePreload();
  }

  function scheduleWorkspacePreload() {
    const state = workspacePreloadState;
    if (!state || state.started) return;
    clearTimeout(state.timer);
    state.timer = setTimeout(() => {
      if (workspacePreloadState !== state || !currentEmployee || state.owner !== currentEmployee.dashboardToken || state.started) return;
      state.started = true;
      const pages = {
        posPage: () => {if (currentSessionIsCashier) refreshInventory();},
        inventoryPage: () => loadInventoryPage(false, true),
        deliveriesPage: () => loadDeliveriesPage(false, true),
        supplierReturnsPage: () => loadSupplierReturnsPage()
      };
      Object.keys(pages).forEach(page => {if (page !== state.page) pages[page]();});
      warmDeliveryCatalog();
    }, 75);
  }

  function preloadHistoryAndReports() {
    const delivery = pageReadCache.get('deliveries');
    if (!currentEmployee || workspaceForegroundLoading() || !inventoryDatasetReady() || inventoryDataset.stale || !inventoryDataset.detailsReady ||
        !delivery || delivery.data === undefined || delivery.owner !== JSON.stringify([currentEmployee, currentCashier])) return;
    warmTransactionHistory();
    warmCashierReport();
    if (hasManagerViewAccess()) warmManagerExpectedCash(getCashReportToday());
  }

  function sanitizeDenominationCount(input) {
    const value = input.value;
    if (/^\d*$/.test(value) && (value === '' || Number.isSafeInteger(Number(value)))) {
      input.dataset.validCount = value;
    } else {
      input.value = input.dataset.validCount || '';
    }
  }

  function loadingIndicator(label = 'Loading…') {
    const escaped = String(label).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
    return `<span class="app-loading" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span>${escaped}</span></span>`;
  }

  // Inputs and selects cannot contain spinner markup, so place it beside them.
  function setControlLoading(control, busy, label = 'Loading…') {
    if (!control) return;
    const id = control.id + 'LoadingIndicator';
    let indicator = document.getElementById(id);
    control.setAttribute('aria-busy', String(busy));
    if (busy && !indicator) {
      indicator = document.createElement('span');
      indicator.id = id;
      indicator.className = 'control-loading';
      control.insertAdjacentElement('afterend', indicator);
    }
    if (indicator) {
      indicator.innerHTML = busy ? loadingIndicator(label) : '';
      indicator.hidden = !busy;
    }
  }

  let masterInventory = [];
  let cart = [];

  let currentEmployee = null;
  function employeeIsOic(employee = currentEmployee) {
    return ['OIC', 'OFFICER IN CHARGE'].includes(String(employee && employee.role || '').trim().toUpperCase());
  }
  function canAuthorizeManagerActions(employee = currentEmployee) {
    return ['OWNER','MANAGER'].includes(String(employee && employee.role || '').trim().toUpperCase());
  }
  function cashierTransactionActionsEnabled() {
    return !!currentEmployee && currentSessionIsCashier === true;
  }
  function requireCashierTransactionActions() {
    if(cashierTransactionActionsEnabled())return true;
    showNotificationToast('Start a cashier shift to change a transaction.',true);return false;
  }
  function hasManagerViewAccess(employee = currentEmployee) {
    return employeeIsOic(employee) || canAuthorizeManagerActions(employee);
  }


  const POS_LOGIN_OPERATIONS = new Set(['verifyEmployee','loginAndStartShift','getLoginSetup',
    'getAccountSessionStatus','revokeDashboardSession','revokeInventoryManagerSession']);
  function posActionCredential(operation, args) {
    const first = args[0] && typeof args[0] === 'object' ? args[0] : {};
    let value = operation === 'saveCashierShiftExit' ? first.managerCredential
      : operation === 'generateCashierShiftReportPDF' ? args[6]
      : operation === 'regenerateCashierReport' ? args[1]
      : operation === 'voidAndRefundTransactionBackend' ? args[6]
      : operation === 'generateManagerDailyReportPDF' ? args[4] : first;
    if (typeof value === 'string') return {managerPin:value};
    value = value || {};
    if (value.managerPin && typeof value.managerPin === 'object') return value.managerPin;
    return {managerPin:value.managerPin, managerToken:value.managerToken};
  }
  let posApprovalRequest = null;
  function posScriptRunner(handlers = {}) {
    return new Proxy({}, {get(target, operation) {
      if (operation === 'withSuccessHandler') return callback=>posScriptRunner({...handlers, success:callback});
      if (operation === 'withFailureHandler') return callback=>posScriptRunner({...handlers, failure:callback});
      if (operation === 'withUserObject') return userObject=>posScriptRunner({...handlers, userObject:userObject});
      if (operation === 'then' || typeof operation !== 'string') return undefined;
      return (...args)=>{
        const owner = currentEmployee, sessionToken = owner && owner.dashboardToken;
        let approvalRequest = null;
        const releaseApproval = ()=>{if(approvalRequest && posApprovalRequest===approvalRequest)posApprovalRequest=null;};
        const fail = error=>{
          releaseApproval();
          if(!POS_LOGIN_OPERATIONS.has(operation) && (!currentEmployee || currentEmployee.dashboardToken!==sessionToken))return;
          if (/Dashboard session expired|Your manager session expired|Authenticated app request required/i.test(error && error.message || '')) logoutEndedAccount(sessionToken);
          if (handlers.failure) handlers.failure(error,handlers.userObject);
          else showNotificationToast(error && error.message || 'Unable to complete this action.',true);
        };
        const succeed = value=>{
          releaseApproval();if(!POS_LOGIN_OPERATIONS.has(operation)&&(!currentEmployee||currentEmployee.dashboardToken!==sessionToken))return;
          let parsed=value;if(typeof value==='string'){try{parsed=JSON.parse(value);}catch(ignored){parsed=null;}}
          if(parsed&&parsed.success&&['adjustInventoryStock','changeInventoryItem','convertYourFindsDeliveryItem','saveProductMaster',
            'setInventoryAdministrativeStatus','deleteUnusedInventoryItem','saveYourFindsItemDetails','executeCheckoutBackend',
            'voidAndRefundTransactionBackend','completeCustomerExchange','acceptYourStyleDelivery','distributeBulkBundle','splitPhysicalBundle',
            'completeBulkHolder','saveSupplierReturn','acceptYourFindsDelivery','processReservationPayment'].includes(operation)){
            if(typeof handleInventoryMutationResult==='function')handleInventoryMutationResult(parsed);
            else {pageReadCache.delete('inventory');if(typeof invalidateLocalInventoryReads==='function')invalidateLocalInventoryReads();}
          }
          if(handlers.success)handlers.success(value,handlers.userObject);
        };
        const run = ()=>google.script.run.withSuccessHandler(succeed).withFailureHandler(fail);
        if (POS_LOGIN_OPERATIONS.has(operation)) {run()[operation](...args);return;}
        if (!sessionToken) {fail(new Error('Please sign in again.'));return;}
        // Copy before prompting so later form edits cannot change an approved action.
        const request = {operation:operation,args:JSON.parse(JSON.stringify(args)),sessionToken:sessionToken,
          shiftReportId:currentSessionIsCashier ? currentShiftReportId : '',
          inventoryVersion:typeof inventoryDatasetReady==='function'&&inventoryDatasetReady()?inventoryDataset.version:''};
        const send = ()=>{
          if (!currentEmployee || currentEmployee.dashboardToken !== sessionToken) {fail(new Error('Account changed. Please sign in again.'));return;}
          run().callPosApi(request);
        };
        const permission = operation === 'saveCashierShiftExit' && request.args[0].action === 'END' ? 'shift.end' : owner.operationPermissions && owner.operationPermissions[operation];
        const mode = owner.permissions && owner.permissions[permission];
        const needsPreview = mode === 'approval' || operation === 'saveYourFindsItemDetails' && !canAuthorizeManagerActions(owner);
        if (!needsPreview) {send();return;}
        if(posApprovalRequest){fail(new Error('Finish the current manager approval first.'));return;}
        approvalRequest={sessionToken:sessionToken};posApprovalRequest=approvalRequest;
        google.script.run.withSuccessHandler(preview=>{
          if (!currentEmployee || currentEmployee.dashboardToken !== sessionToken) return fail(new Error('Account changed. Please sign in again.'));
          request.approvalRequestId=preview.requestId;
          if (!preview.approvalRequired) {send();return;}
          const credential=posActionCredential(operation,request.args);
          const approve=value=>{
            if (!value) {fail(new Error('Approval cancelled.'));return;}
            request.credential=typeof value === 'string' ? {managerPin:value} : value;
            send();
          };
          if (credential.managerPin || credential.managerToken) {
            approve(credential);
          } else requestManagerPin(preview.description,approve,true);
        }).withFailureHandler(fail).previewPosAction(request);
      };
    }});
  }
  const secureScriptRun = posScriptRunner();

  let currentCashier = "";
  let currentSessionIsCashier = false;

  let currentShiftPettyCash = 0;
  let currentShiftReportId = '';
  let currentShiftExpectedCash = 0;
  let currentManagerExpectedCash = 0;

  let calculatedBaseTotalDue = 0;
  let finalActiveGrandTotal = 0;

  let manualSearchHighlightIndex = -1;

  const PETTY_DENOMS = [1000, 500, 200, 100, 50, 20, 10, 5, 1];


  /* ==========================================================
     SESSION
  ========================================================== */

  var accountSessionWatch = null;

  function stopAccountSessionMonitor() {
    if (!accountSessionWatch) return;
    clearInterval(accountSessionWatch.interval);
    clearTimeout(accountSessionWatch.timeout);
    accountSessionWatch = null;
  }

  function logoutEndedAccount(token) {
    if (!currentEmployee || String(currentEmployee.dashboardToken || '') !== token) return;
    stopAccountSessionMonitor();
    completeCleanLogout();
    showNotificationToast('Your session has ended. Please sign in again.', true);
  }

  function armAccountSessionExpiry(watch) {
    clearTimeout(watch.timeout);
    if (!watch.expiresAt) return;
    watch.timeout = setTimeout(() => logoutEndedAccount(watch.token), Math.max(0, watch.expiresAt - Date.now()));
  }

  function checkAccountSession() {
    const watch = accountSessionWatch;
    if (!watch || !currentEmployee || currentEmployee.dashboardToken !== watch.token) return;
    if (watch.expiresAt && Date.now() >= watch.expiresAt) { logoutEndedAccount(watch.token); return; }
    if (watch.busy) return;
    watch.busy = true;
    secureScriptRun.withSuccessHandler(result => {
      if (accountSessionWatch !== watch || !currentEmployee || currentEmployee.dashboardToken !== watch.token) return;
      watch.busy = false;
      if (!result || !result.success) return;
      if (result.active === false) { logoutEndedAccount(watch.token); return; }
      if(typeof observeInventoryVersion==='function')observeInventoryVersion(result.inventoryVersion);
      if (Number(result.expiresAt) > 0) {
        watch.expiresAt = Number(result.expiresAt);
        armAccountSessionExpiry(watch);
      }
    }).withFailureHandler(() => {
      // A temporary connection failure does not mean the account session ended.
      if (accountSessionWatch === watch) watch.busy = false;
    }).getAccountSessionStatus(watch.token);
  }

  function startAccountSessionMonitor(verifyNow) {
    if (!currentEmployee) return false;
    const token = String(currentEmployee.dashboardToken || '');
    const expiresAt = Number(currentEmployee.sessionExpiresAt) || 0;
    if (!token || (expiresAt && Date.now() >= expiresAt)) { logoutEndedAccount(token); return false; }
    if (!accountSessionWatch || accountSessionWatch.token !== token) {
      stopAccountSessionMonitor();
      const watch = {token: token, expiresAt: expiresAt, busy: false};
      accountSessionWatch = watch;
      watch.interval = setInterval(checkAccountSession, 60000);
      armAccountSessionExpiry(watch);
      if (verifyNow || !expiresAt) checkAccountSession();
    } else if (verifyNow) checkAccountSession();
    return true;
  }

  function saveSession() {
    if (!startAccountSessionMonitor()) return;
    const session = {
      currentEmployee,
      currentCashier,
      isCashierSession: currentSessionIsCashier,
      currentShiftPettyCash,
      currentShiftReportId,
      cart,
      activePage: localStorage.getItem("ys_pos_active_page") || "posPage",
      globalDiscountType: document.getElementById("globalDiscountType").value,
      globalDiscountValue: document.getElementById("globalDiscountValue").value
    };

    localStorage.setItem("ys_pos_session", JSON.stringify(session));

    if (session.activePage) {
      localStorage.setItem("ys_pos_active_page", session.activePage);
    }
  }


  function restoreSession() {
    const raw = localStorage.getItem("ys_pos_session");

    if (!raw) return;

    const session = JSON.parse(raw);

    currentEmployee = session.currentEmployee;
    currentSessionIsCashier = session.isCashierSession !== false;
    if (!startAccountSessionMonitor(true)) return;

    updateSidebarProfile(currentEmployee);

    document.getElementById("appSidebar").style.display = "flex";

    currentCashier = session.currentCashier;
    currentShiftPettyCash = session.currentShiftPettyCash;
    currentShiftReportId = session.currentShiftReportId || '';
    updatePettyCashDisplay();
    cart = session.cart || [];

    document.getElementById("cashierSelect").value = currentCashier;

    document.getElementById("globalDiscountType").value =
      session.globalDiscountType || "percentage";

    document.getElementById("globalDiscountValue").value =
      session.globalDiscountValue || "";

    document.getElementById("sidebarEmployeeName").textContent = currentCashier;

    document.getElementById("cashierManagerReportBtn").style.display =
      hasManagerViewAccess() ? "block" : "none";
    updateCashierNavigationAvailability();

    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("terminalWorkspace").style.display = "block";
    document.getElementById("appSidebar").style.display = "block";

    restoreActivePage();

    if (currentSessionIsCashier && document.getElementById('posPage').style.display !== 'none') refreshInventory(function () {
      renderCart();
    });
    else renderCart();

    restoreForm("shiftReportModal");
    restoreForm("managerDailyModal");
  }


  function clearSession() {
    resetWorkspacePreload();
    posApprovalRequest=null;
    stopAccountSessionMonitor();
    clearDashboardState();
    if (currentEmployee && currentEmployee.dashboardToken) {
      secureScriptRun.withFailureHandler(function() {}).revokeDashboardSession(currentEmployee.dashboardToken);
      delete currentEmployee.dashboardToken;
    }
    if (currentEmployee && currentEmployee.inventoryManagerToken) {
      secureScriptRun.withFailureHandler(function() {}).revokeInventoryManagerSession(currentEmployee.inventoryManagerToken);
      delete currentEmployee.inventoryManagerToken;
    }
    localStorage.removeItem("ys_pos_session");
  }


  /* ==========================================================
     FORM PERSISTENCE
  ========================================================== */

  function saveForm(formId) {
    const form = document.getElementById(formId);

    if (!form) return;

    const data = {};

    form.querySelectorAll("input, select, textarea").forEach((el) => {
      data[el.id] = el.type === "checkbox" ? el.checked : el.value;
    });

    localStorage.setItem(formId, JSON.stringify(data));
  }


  function restoreForm(formId) {
    const form = document.getElementById(formId);

    if (!form) return;

    const raw = localStorage.getItem(formId);

    if (!raw) return;

    const data = JSON.parse(raw);

    Object.keys(data).forEach((id) => {
      const el = document.getElementById(id);

      if (!el) return;

      if (el.type === "checkbox") {
        el.checked = data[id];
      } else {
        el.value = data[id];
      }
    });
  }


  /* ==========================================================
     NOTIFICATION TOAST
  ========================================================== */

  function showNotificationToast(msg, isError = false) {
    const toastEl = document.getElementById("liveSystemToast");
    const msgEl = document.getElementById("toastMessageContent");

    if (!toastEl || !msgEl) {
      console.log(msg);
      return;
    }

    msgEl.textContent = msg;

    toastEl.className =
      "toast align-items-center shadow-lg border-0 " +
      (isError ? "toast-error-custom" : "toast-success-custom");

    const bsToast = new bootstrap.Toast(toastEl);

    bsToast.show();
  }


  /* ==========================================================
     WINDOW LOAD
  ========================================================== */

  window.onload = function () {

    window.addEventListener('focus', checkAccountSession);
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) checkAccountSession();
    });
    window.addEventListener('storage', function(event) {
      if (event.key === 'ys_pos_session' && event.newValue === null && !localStorage.getItem('ys_pos_session') && currentEmployee) {
        logoutEndedAccount(String(currentEmployee.dashboardToken || ''));
      }
    });

    initializeLogin();

    const hasSession = localStorage.getItem("ys_pos_session");

    if (hasSession) {
      restoreSession();
    } else {
      document.getElementById("loginOverlay").style.display = "flex";
    }


    /* ========================================================
       BARCODE AUTOFOCUS

       Do not steal focus while:
       - a modal is open
       - user is typing in an input/select/textarea
       - user is using a contenteditable element
    ======================================================== */

    setInterval(() => {

      const loginOverlay = document.getElementById("loginOverlay");
      const checkoutModal = document.getElementById("checkoutModal");
      const voidModal = document.getElementById("voidVerificationModal");
      const shiftModal = document.getElementById("shiftReportModal");
      const managerDailyModal = document.getElementById("managerDailyModal");

      const acceptDeliveryModal = document.getElementById("acceptDeliveryModal");
      const acceptDeliveryTypeModal = document.getElementById("acceptDeliveryTypeModal");

      const yourFindsReprintModal = document.getElementById("yourFindsReprintModal");

      const yourFindsDeliveryDetailsModal =
        document.getElementById("yourFindsDeliveryDetailsModal");


      const overlaysActive =
        !!document.querySelector('dialog[open]') ||
        document.getElementById('customerExchangeModal')?.style.display === 'flex' ||
        (loginOverlay && loginOverlay.style.display !== "none") ||
        (checkoutModal && checkoutModal.style.display === "flex") ||
        (voidModal && voidModal.style.display === "flex") ||
        (shiftModal && shiftModal.style.display === "flex") ||
        (managerDailyModal && managerDailyModal.style.display === "flex") ||
        (acceptDeliveryModal && acceptDeliveryModal.style.display === "flex") ||
        (acceptDeliveryTypeModal && acceptDeliveryTypeModal.style.display === "flex") ||
        (yourFindsReprintModal && yourFindsReprintModal.style.display === "flex") ||
        (
          yourFindsDeliveryDetailsModal &&
          yourFindsDeliveryDetailsModal.style.display === "flex"
        );


      const activeElement = document.activeElement;


      const focusOnTypingField =
        activeElement &&
        (
          activeElement.tagName === "INPUT" ||
          activeElement.tagName === "SELECT" ||
          activeElement.tagName === "TEXTAREA" ||
          activeElement.isContentEditable
        );


      if (!overlaysActive && !focusOnTypingField) {

        const terminalWorkspace =
          document.getElementById("terminalWorkspace");

        const codeInput =
          document.getElementById("codeInput");


        if (
          currentEmployee && currentSessionIsCashier && terminalWorkspace &&
          terminalWorkspace.style.display === "block" &&
          codeInput
        ) {
          codeInput.focus();
        }

      }

    }, 300);

  };


  /* ==========================================================
     FORM AUTO-SAVE
  ========================================================== */

  document.addEventListener("input", function (e) {

    if (e.target.closest("#shiftReportModal")) {
      saveForm("shiftReportModal");
    }

    if (e.target.closest("#managerDailyModal")) {
      saveForm("managerDailyModal");
    }

  });

</script>
