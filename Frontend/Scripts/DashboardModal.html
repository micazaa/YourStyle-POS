<style>
  dialog.dashboard-modal {

    border: 1px solid var(--border-color);

    background: var(--card-bg);
    color: var(--text-dark);
    overflow: hidden;
  }

  .dashboard-modal-heading p:empty { display: none; }

  .dashboard-modal-close::before { content: ''; width: 15px; height: 15px; background: currentColor; clip-path: polygon(9% 0,50% 41%,91% 0,100% 9%,59% 50%,100% 91%,91% 100%,50% 59%,9% 100%,0 91%,41% 50%,0 9%); }
  .dashboard-modal-body { min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-color) transparent; }
  .dashboard-modal-body .dashboard-delivery-scroll { overflow: visible; }

  .dashboard-modal-body > [role="status"]:empty { display: none; }

  .dashboard-modal .dashboard-calendar-shortcuts { margin-top: var(--space-3); padding-top: var(--space-3); border-color: var(--border-color); }

  .dashboard-calendar-grid .range-end { border-top-left-radius: 0; border-bottom-left-radius: 0; }

  .dashboard-calendar-grid button:disabled { color: var(--text-gray); opacity: .38; cursor: not-allowed; }
  .dashboard-calendar-shortcuts { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 6px; border-top: 1px solid var(--border-color); margin-top: 10px; padding-top: 10px; }
  .dashboard-modal .dashboard-calendar-shortcuts .btn { min-height: 34px; padding: 6px 8px; font-size: .75rem; font-weight: 400; border-radius: 8px; }
  @keyframes dashboard-modal-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 575px) {
    dialog.dashboard-modal { width: calc(100% - 24px); max-height: calc(var(--ys-viewport-height, 100dvh) - 24px); padding: var(--space-4); }
    .dashboard-modal-heading h2 { font-size: 1.25rem; }
    .dashboard-modal :is(.form-control,.form-select) { font-size: 16px; }
    .dashboard-modal .dashboard-modal-total :is(th,td) { padding: 10px 4px; font-size: .8125rem; }
  }
  @media (max-width: 380px) { .dashboard-calendar-shortcuts { grid-template-columns: repeat(3,minmax(0,1fr)); } }
  @media (pointer: coarse) { .dashboard-modal .dashboard-calendar-grid button { min-height: var(--control-height); } }
  @media (pointer: coarse) { .dashboard-modal .dashboard-calendar-shortcuts .btn { min-height: 44px; } }
  @media (prefers-reduced-motion: reduce) {
    dialog.dashboard-modal[open], .dashboard-modal .dashboard-return-icon[aria-busy="true"]::after { animation: none; }
  }
</style>
<script>
// One native-dialog shell; each instance supplies its existing heading, content and actions.
(function () {
  'use strict';
  const states = new WeakMap();
  const focusSelector = 'button:not(:disabled),a[href],input:not(:disabled):not([type="hidden"]),select:not(:disabled),textarea:not(:disabled),summary,[tabindex]:not([tabindex="-1"])';
  const visible = element => !element.closest('[hidden],[inert]') && element.getClientRects().length && getComputedStyle(element).visibility !== 'hidden';
  function isBusy(dialog) { return !!dialog.querySelector('[aria-busy="true"]'); }
  function requestClose(dialog) {
    const state = states.get(dialog);
    if (!state || !dialog.open || isBusy(dialog) || state.closing) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !dialog.animate) { dialog.close(); return; }
    const animation = dialog.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(4px)'}],{duration:110,easing:'ease-in',fill:'forwards'});
    state.closing = animation;
    animation.finished.then(() => {
      if (state.closing === animation && dialog.open && !isBusy(dialog)) dialog.close();
      animation.cancel(); state.closing = null;
    }).catch(() => {});
  }
  function syncBusy(dialog) {
    const state = states.get(dialog), busy = isBusy(dialog);
    if (dialog.getAttribute('aria-busy') !== String(busy)) dialog.setAttribute('aria-busy',String(busy));
    dialog.querySelectorAll('[data-dashboard-modal-close],.dashboard-modal-footer .btn-light').forEach(button => {

      else if (!busy && state.disabled.has(button)) {button.disabled = state.disabled.get(button);state.disabled.delete(button);}
    });
  }
  function mount(dialog) {
    if (states.has(dialog)) return;
    const heading = dialog.querySelector('[data-dashboard-modal-heading]');
    const footer = dialog.querySelector('[data-dashboard-modal-footer]');
    if (!heading || !footer) throw new Error('Dashboard modal slots are missing: ' + dialog.id);
    const state = {disabled:new Map(),closing:null}; states.set(dialog,state);
    const header = document.createElement('header'); header.className = 'dashboard-modal-header';
    heading.className = 'dashboard-modal-heading';
    const close = document.createElement('button'); close.type = 'button'; close.className = 'btn btn-light dashboard-modal-close';
    close.dataset.dashboardModalClose = ''; close.autofocus = true;
    close.setAttribute('aria-label','Close ' + heading.querySelector('h2').textContent.toLowerCase());
    header.append(heading,close);
    const body = document.createElement('div'); body.className = 'dashboard-modal-body';
    Array.from(dialog.childNodes).filter(node => node !== footer).forEach(node => body.append(node));
    footer.className = 'dashboard-modal-footer';

  else mountAll();
})();
</script>
