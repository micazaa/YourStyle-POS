<script>
// Reusable display data for this UAT device. Authentication stays session-scoped.
const deviceInventoryFields = ['code','name','size','category','inventoryType','status','stock','price','imageUrl','lowStockAt','productStatus','salePrices','deliveryId','dateDelivered','searchText'];
const deviceCashierFields = [...deviceInventoryFields,'origPrice','regularPrice','priceSource','variantKey','saleReferenceId','saleEnd','salePrice','saleQuantity','saleRemaining','physicalBundle','bundleKind','estimatedPieces'];
function deviceCacheEnabled() {
  return document.body.dataset.deviceCacheEnabled === 'true';
}
function deviceCacheDay() {
  return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function readDeviceCache(kind) {
  if (!deviceCacheEnabled() || !currentEmployee?.dashboardToken) return null;
  try {
    const entry = JSON.parse(localStorage.getItem('ys_uat_daily_v1_' + kind));
    if (entry?.day === deviceCacheDay() && Array.isArray(entry.items)) return entry;
    localStorage.removeItem('ys_uat_daily_v1_' + kind);
  } catch (error) { /* Browser storage can be unavailable or full. */ }
  return null;
}
function writeDeviceCache(kind, items, version) {
  if (!deviceCacheEnabled() || !currentEmployee?.dashboardToken) return;
  const fields = kind === 'cashier' ? deviceCashierFields : deviceInventoryFields;
  const safeItems = items.map(item => Object.fromEntries(fields.filter(field => item[field] !== undefined).map(field => [field,item[field]])));
  try {
    localStorage.setItem('ys_uat_daily_v1_' + kind, JSON.stringify({day:deviceCacheDay(),version,items:safeItems}));
  } catch (error) { /* Live loading remains available when storage is full. */ }
}
function clearDeviceInventoryCache() {
  if (!deviceCacheEnabled()) return;
  try {
    ['inventory','cashier'].forEach(kind => localStorage.removeItem('ys_uat_daily_v1_' + kind));
  } catch (error) { /* Storage may be disabled. */ }
}
function restoreDeviceInventory() {
  if (inventoryDatasetReady() || inventoryDownload) return;
  const saved = readDeviceCache('inventory');
  if (!saved?.version) return;
  inventoryDataset = {owner:currentEmployee.dashboardToken,version:saved.version,items:saved.items,
    complete:true,stale:false,detailsReady:false,deliveryReady:true};
  inventoryListVersion = saved.version;
  refreshInventoryChanges();
}
function deviceOverviewAccount() {
  const employee = currentEmployee;
  if (!deviceCacheEnabled() || !employee?.dashboardToken || !employee.employeeId) return '';
  return JSON.stringify([employee.employeeId,employee.fullName,employee.role,employee.accessLevel,employee.permissions]);
}
function readDeviceOverview(range) {
  const account = deviceOverviewAccount();
  if (!account) return null;
  try {
    const saved = JSON.parse(localStorage.getItem('ys_uat_daily_overview_v1_' + account));
    if (saved?.day !== deviceCacheDay()) return null;
    return saved.ranges?.[range.start + ':' + range.end] ||
      (saved.start === range.start && saved.end === range.end ? saved.overview : null);
  } catch (error) { /* Use the authenticated live read when storage is unavailable. */ }
  return null;
}
function writeDeviceOverview(range, overview) {
  const account = deviceOverviewAccount();
  if (!account) return;
  try {
    const key = 'ys_uat_daily_overview_v1_' + account;
    const previous = JSON.parse(localStorage.getItem(key));
    const ranges = previous?.day === deviceCacheDay() ? {...previous.ranges} : {};
    const rangeKey = range.start + ':' + range.end;
    delete ranges[rangeKey];
    ranges[rangeKey] = overview;
    while (Object.keys(ranges).length > 12) delete ranges[Object.keys(ranges)[0]];
    localStorage.setItem(key, JSON.stringify({day:deviceCacheDay(),ranges}));
  } catch (error) { /* A full device cache must not interrupt live totals. */ }
}
</script>
