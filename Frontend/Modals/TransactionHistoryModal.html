<div
  id="transactionHistoryModal"
  class="generic-overlay-blur"
  style="display:none;"
>

  <div
    class="custom-popup-card"
    style="
      max-width:1100px;
      width:95%;
      max-height:90vh;
    "
  >

    <!-- HEADER -->

    <div
      class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom"
    >

      <div>

        <h5 class="fw-bold mb-1">
          Transaction History
        </h5>

      </div>


      <button
        type="button"
        class="btn-close"
        onclick="closeTransactionHistoryModal()"
      ></button>

    </div>


    <!-- FILTER BAR -->

    <!-- SUMMARY - MANAGER ONLY -->

    <div
      id="transactionHistorySummary"
      class="row g-2 mb-3"
    >

      <!-- DATE - MANAGER ONLY -->

      <div
        id="transactionDateFilterBox"
        class="col-md-2"
        style="display:none;"
      >

        <label class="form-label small">
          From
        </label>

        <input
          type="date"
          id="transactionHistoryFromDate"
          class="form-control"
          onchange="loadTransactionHistory()"
        >

      </div>

      <div
        id="transactionToDateFilterBox"
        class="col-md-2"
        style="display:none;"
      >

        <label class="form-label small">
          To
        </label>

        <input
          type="date"
          id="transactionHistoryToDate"
          class="form-control"
          onchange="loadTransactionHistory()"
        >

      </div>


      <!-- SEARCH -->

      <div class="col">

        <label class="form-label small">
          Search
        </label>

        <input
          type="text"
          id="transactionHistorySearch"
          class="form-control"
          placeholder="Receipt, cashier, item..."
          oninput="filterTransactionHistoryTable()"
        >

      </div>

      <!-- PAYMENT METHOD -->

      <div class="col-md-3">

        <label class="form-label small">
          Payment Method
        </label>

        <select
          id="transactionHistoryPaymentFilter"
          class="form-select"
          onchange="filterTransactionHistoryTable()"
        >

          <option value="">
            All Payment Methods
          </option>

        </select>

      </div>

    </div>


    <!-- ================= MANAGER SUMMARY ONLY ================= -->

<div
  id="managerTransactionSummary"
  class="row g-2 mb-3"
  style="display:none;"
>

  <div class="col-md-4">

    <div class="border rounded p-2">

      <div class="small text-muted">
        Transactions
      </div>

      <div
        id="transactionHistoryCount"
        class="fw-bold"
      >
        0
      </div>

    </div>

  </div>


  <div class="col-md-4">

    <div class="border rounded p-2">

      <div class="small text-muted">
        Items Sold
      </div>

      <div
        id="transactionHistoryItems"
        class="fw-bold"
      >
        0
      </div>

    </div>

  </div>


  <div class="col-md-4">

    <div class="border rounded p-2">

      <div class="small text-muted">
        Net Sales
      </div>

      <div
        id="transactionHistorySales"
        class="fw-bold"
      >
        ₱0.00
      </div>

    </div>

  </div>

</div>


    <!-- TABLE -->

    <div
      class="table-responsive border rounded"
      style="height:340px; overflow-y:auto;"
    >

      <table
        class="table table-hover align-middle mb-0"
      >

        <thead
          class="table-light"
          style="
            position:sticky;
            top:0;
            z-index:1;
          "
        >

          <tr>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('time')">
                Time <span id="transactionSortTime" aria-hidden="true">↕</span>
              </button>
            </th>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('receiptId')">
                Receipt <span id="transactionSortReceiptId" aria-hidden="true">↕</span>
              </button>
            </th>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('cashier')">
                Cashier <span id="transactionSortCashier" aria-hidden="true">↕</span>
              </button>
            </th>

            <th class="text-center">
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('items')">
                Items <span id="transactionSortItems" aria-hidden="true">↕</span>
              </button>
            </th>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('paymentMethod')">
                Payment <span id="transactionSortPaymentMethod" aria-hidden="true">↕</span>
              </button>
            </th>

            <th class="text-end">
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('total')">
                Total <span id="transactionSortTotal" aria-hidden="true">↕</span>
              </button>
            </th>

            <th class="text-center">
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('status')">
                Status <span id="transactionSortStatus" aria-hidden="true">↕</span>
              </button>
            </th>

          </tr>

        </thead>


        <tbody id="transactionHistoryRows">

          <tr>

            <td
              colspan="7"
              class="text-center text-muted py-5"
              role="status"
              aria-label="Loading transactions"
            >
              <div class="spinner-border spinner-border-sm text-secondary" aria-hidden="true"></div>
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

var transactionHistoryData = [];
var transactionHistorySort = {
  key: "time",
  direction: "desc"
};


/* ==========================================================
   OPEN
========================================================== */

function openTransactionHistoryModal() {

  if (!currentEmployee) {

    showNotificationToast(
      "Employee session not found.",
      true
    );

    return;
  }


  /* ================= TODAY ================= */

  const now =
    new Date();

  const today =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() * 60000
    )
      .toISOString()
      .split("T")[0];


  const fromDateInput =
    document.getElementById(
      "transactionHistoryFromDate"
    );

  const toDateInput =
    document.getElementById(
      "transactionHistoryToDate"
    );


  fromDateInput.value = today;
  toDateInput.value = today;

  fromDateInput.max = today;
  toDateInput.max = today;


  document.getElementById(
    "transactionHistorySearch"
  ).value = "";

  const paymentFilter =
  document.getElementById(
    "transactionHistoryPaymentFilter"
  );


if (paymentFilter) {

  paymentFilter.innerHTML = `
    <option value="">
      All Payment Methods
    </option>
  `;

}


  /* ================= ROLE ================= */

  const isManager =
    Number(
      currentEmployee.accessLevel
    ) <= 1;


  /* ================= DATE PICKER ================= */

  document.getElementById(
    "transactionDateFilterBox"
  ).style.display =
    isManager
      ? "block"
      : "none";

  document.getElementById(
    "transactionToDateFilterBox"
  ).style.display =
    isManager
      ? "block"
      : "none";


  /* ================= SUMMARY ================= */

const managerSummary =
  document.getElementById(
    "managerTransactionSummary"
  );

if (managerSummary) {

  managerSummary.style.display =
    isManager
      ? "flex"
      : "none";

}

  /* ================= SHOW ================= */

  document.getElementById(
    "transactionHistoryModal"
  ).style.display =
    "flex";


  /* ================= LOAD ================= */

  loadTransactionHistory();

}


/* ==========================================================
   CLOSE
========================================================== */

function closeTransactionHistoryModal() {

  document.getElementById(
    "transactionHistoryModal"
  ).style.display =
    "none";

}


/* ==========================================================
   LOAD
========================================================== */

function loadTransactionHistory() {

  const tbody =
    document.getElementById(
      "transactionHistoryRows"
    );

  if (!tbody) {

    console.error(
      "transactionHistoryRows not found"
    );

    return;
  }


  tbody.innerHTML = `
    <tr>
      <td
        colspan="7"
        class="text-center text-muted py-5"
        role="status"
        aria-label="Loading transactions"
      >
        <div class="spinner-border spinner-border-sm text-secondary" aria-hidden="true"></div>
      </td>
    </tr>
  `;


  const fromDate =
    document.getElementById(
      "transactionHistoryFromDate"
    ).value;

  const toDate =
    document.getElementById(
      "transactionHistoryToDate"
    ).value;


  const isManager =
    Number(
      currentEmployee.accessLevel
    ) <= 1;


  console.log(
    "TRANSACTION HISTORY REQUEST:",
    {
      cashier: currentCashier,
      fromDate: fromDate,
      toDate: toDate,
      isManager: isManager
    }
  );


  google.script.run

    .withSuccessHandler(function(result) {

      console.log(
        "TRANSACTION HISTORY RESPONSE:",
        result
      );


      if (
        !result ||
        result.success !== true
      ) {

        const message =
          result && result.message
            ? result.message
            : "Unknown backend response";


        console.error(
          "Transaction history failed:",
          message
        );


        tbody.innerHTML = `
          <tr>
            <td
              colspan="7"
              class="text-center text-danger py-5"
            >
              ${escapeTransactionHtml(message)}
            </td>
          </tr>
        `;

        return;
      }


      transactionHistoryData =
        Array.isArray(
          result.transactions
        )
          ? result.transactions
          : [];

      populateTransactionPaymentFilter(
        transactionHistoryData
      );


      console.log(
        "TRANSACTIONS RECEIVED:",
        transactionHistoryData.length,
        transactionHistoryData
      );


      filterTransactionHistoryTable();

    })


    .withFailureHandler(function(err) {

      console.error(
        "TRANSACTION HISTORY SERVER ERROR:",
        err
      );


      tbody.innerHTML = `
        <tr>

          <td
            colspan="7"
            class="text-center text-danger py-5"
          >

            ${
              escapeTransactionHtml(
                err && err.message
                  ? err.message
                  : "Server error"
              )
            }

          </td>

        </tr>
      `;

    })


    .getTransactionHistory(
      currentCashier,
      fromDate,
      toDate,
      isManager
    );

}

/* ==========================================================
   PAYMENT METHOD FILTER OPTIONS
========================================================== */

function populateTransactionPaymentFilter(
  transactions
) {

  const select =
    document.getElementById(
      "transactionHistoryPaymentFilter"
    );


  if (!select) {

    return;

  }


  const previousValue =
    select.value;


  const paymentMethods =
    Array.from(
      new Set(
        transactions
          .map(
            function(tx) {

              return String(
                tx.paymentMethod || ""
              ).trim();

            }
          )
          .filter(Boolean)
      )
    )
      .sort(
        function(a, b) {

          return a.localeCompare(b);

        }
      );


  select.innerHTML = `
    <option value="">
      All Payment Methods
    </option>
  `;


  paymentMethods.forEach(
    function(method) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        method;


      option.textContent =
        method;


      select.appendChild(
        option
      );

    }
  );


  if (
    paymentMethods.includes(
      previousValue
    )
  ) {

    select.value =
      previousValue;

  }

}
/* ==========================================================
   SORT
========================================================== */

function sortTransactionHistory(key) {
  if (transactionHistorySort.key === key) {
    transactionHistorySort.direction = transactionHistorySort.direction === "asc"
      ? "desc"
      : "asc";
  } else {
    transactionHistorySort.key = key;
    transactionHistorySort.direction = key === "time" || key === "total" || key === "items"
      ? "desc"
      : "asc";
  }

  filterTransactionHistoryTable();
}

function updateTransactionHistorySortIndicators() {
  const keys = ["time", "receiptId", "cashier", "items", "paymentMethod", "total", "status"];

  keys.forEach(function(key) {
    const indicator = document.getElementById("transactionSort" + key.charAt(0).toUpperCase() + key.slice(1));
    if (indicator) {
      indicator.textContent = transactionHistorySort.key === key
        ? (transactionHistorySort.direction === "asc" ? "↑" : "↓")
        : "↕";
    }
  });
}

function getSortedTransactionHistory(items) {
  const sorted = items.slice();
  const key = transactionHistorySort.key;
  const direction = transactionHistorySort.direction === "asc" ? 1 : -1;

  sorted.sort(function(a, b) {
    let first = a[key];
    let second = b[key];

    if (key === "time") {
      first = Date.parse("1970/01/01 " + String(first || ""));
      second = Date.parse("1970/01/01 " + String(second || ""));
    } else if (key === "items" || key === "total") {
      first = Number(first) || 0;
      second = Number(second) || 0;
    } else {
      first = String(first || "").toLowerCase();
      second = String(second || "").toLowerCase();
    }

    if (first < second) return -1 * direction;
    if (first > second) return 1 * direction;
    return 0;
  });

  return sorted;
}

/* ==========================================================
   RENDER
========================================================== */

function renderTransactionHistory(items) {

  console.log(
  "RENDER TRANSACTION HISTORY:",
  items
);

  const tbody =
    document.getElementById(
      "transactionHistoryRows"
    );


  tbody.innerHTML = "";
  updateTransactionHistorySortIndicators();


  if (
    !Array.isArray(items) ||
    items.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="text-center text-muted py-5"
        >
          No transactions found.
        </td>
      </tr>
    `;


    updateTransactionHistorySummary(
      []
    );

    return;

  }


  items.forEach(function(tx) {

    const row =
      document.createElement("tr");

        row.style.cursor = "pointer";

    row.onclick = function() {

      openTransactionDetails(
        tx.receiptId
      );

    };

    row.innerHTML = `

      <td>
        ${escapeTransactionHtml(tx.time)}
      </td>

      <td>
        <span class="font-monospace small">
          ${escapeTransactionHtml(tx.receiptId)}
        </span>
      </td>

      <td>
        ${escapeTransactionHtml(tx.cashier)}
      </td>

      <td class="text-center">
        ${Number(tx.items) || 0}
      </td>

      <td>
        ${escapeTransactionHtml(tx.paymentMethod)}
      </td>

      <td class="text-end fw-bold">
        ₱${Number(tx.total || 0).toFixed(2)}
      </td>

      <td class="text-center">
        ${buildTransactionStatusBadge(tx.status)}
      </td>

    `;


    tbody.appendChild(row);

  });


  updateTransactionHistorySummary(items);

}


/* ==========================================================
   SUMMARY
========================================================== */

function updateTransactionHistorySummary(items) {

  let completedTransactions = 0;
  let itemCount = 0;
  let netSales = 0;


  items.forEach(function(tx) {

    const status =
      String(tx.status || "")
        .trim()
        .toUpperCase();


    /*
      Only COMPLETED transactions count
      toward sales statistics.
    */

    if (status === "VOIDED") {
      return;
    }


    completedTransactions++;


    itemCount +=
      Number(tx.items) || 0;


    netSales +=
      Number(tx.total) || 0;

  });

  document.getElementById(
    "transactionHistoryCount"
  ).textContent =
    items.length;

  document.getElementById(
    "transactionHistoryItems"
  ).textContent =
    itemCount;


  /*
    Net Sales:
    COMPLETED only
  */

  document.getElementById(
    "transactionHistorySales"
  ).textContent =
    "₱" +
    netSales.toFixed(2);

}

/* ==========================================================
   STATUS
========================================================== */

function buildTransactionStatusBadge(status) {

  const value =
    String(status || "")
      .trim()
      .toUpperCase();


  if (value === "VOIDED") {

    return `
      <span class="badge bg-danger">
        Voided
      </span>
    `;

  }

  if (value === "PARTIALLY VOIDED") {
    return `
      <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">
        Amended
      </span>
    `;
  }


  return `
    <span class="badge bg-success">
      Completed
    </span>
  `;

}


/* ==========================================================
   SEARCH
========================================================== */

/* ==========================================================
   FILTER TRANSACTION HISTORY

   Search + Payment Method
========================================================== */

function filterTransactionHistoryTable() {

  const query =
    document.getElementById(
      "transactionHistorySearch"
    )
      .value
      .trim()
      .toLowerCase();


  const paymentMethod =
    document.getElementById(
      "transactionHistoryPaymentFilter"
    )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    transactionHistoryData.filter(
      function(tx) {

        /* ================= SEARCH ================= */

        const searchable =
          [

            tx.receiptId,
            tx.cashier,
            tx.paymentMethod,
            tx.status,
            tx.itemNames

          ]
            .map(
              function(value) {

                return String(
                  value || ""
                );

              }
            )
            .join(" ")
            .toLowerCase();


        const matchesSearch =
          !query ||
          searchable.includes(
            query
          );


        /* ================= PAYMENT ================= */

        const transactionPayment =
          String(
            tx.paymentMethod || ""
          )
            .trim()
            .toLowerCase();


        const matchesPayment =
          !paymentMethod ||
          transactionPayment ===
            paymentMethod;


        return (
          matchesSearch &&
          matchesPayment
        );

      }
    );


  renderTransactionHistory(
    getSortedTransactionHistory(filtered)
  );

}

/* ==========================================================
   SAFE TRANSACTION HTML
========================================================== */

function escapeTransactionHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>
