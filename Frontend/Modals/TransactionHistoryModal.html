<div
  id="transactionHistoryModal"
  class="generic-overlay-blur"
  style="display:none;"
>

  <div
    class="custom-popup-card"
    style="
      max-width:1100px;
      width:95%;
      max-height:90vh;
    "
  >

    <!-- HEADER -->

    <div
      class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom"
    >

      <div>

        <h5 class="fw-bold mb-1">
          Transaction History
        </h5>

      </div>

      <button
        type="button"
        class="btn-close"
        onclick="closeTransactionHistoryModal()"
       aria-label="Close Transaction History"></button>

    </div>

    <div
      id="transactionHistoryLoading"
      class="text-center text-muted py-5"
      role="status"
      aria-live="polite"
      style="display:none;"
    >
      <div class="spinner-border spinner-border-sm text-secondary me-2" aria-hidden="true"></div>
      Loading transaction history…
    </div>

    <div id="transactionHistoryContent">

    <!-- FILTER BAR -->

    <!-- SUMMARY - MANAGER ONLY -->

    <div
      id="transactionHistorySummary"
      class="row g-2 mb-3"
    >

      <!-- DATE RANGE -->

      <div
        id="transactionDateFilterBox"
        class="col-lg-4"
        style="display:none;"
      >

        <label for="transactionHistoryDateRangeButton" class="form-label small">
          From – To
        </label>

        <input
          type="hidden"
          id="transactionHistoryFromDate"
        >
        <input
          type="hidden"
          id="transactionHistoryToDate"
        >

        <button
          type="button"
          id="transactionHistoryDateRangeButton"
          class="btn btn-light border w-100 d-flex align-items-center justify-content-between text-start"
          aria-haspopup="dialog"
          aria-controls="transactionHistoryCalendar"
          onclick="openTransactionHistoryCalendar()"
        >
          <span id="transactionHistoryDateRangeLabel">Select a date range</span>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3v3m12-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg>
        </button>

      </div>

      <!-- SEARCH -->

      <div class="col-lg-5">

        <label class="form-label small">
          Search
        </label>

        <input
          type="text"
          id="transactionHistorySearch"
          class="form-control"
          placeholder="Barcode, receipt, cashier, item..."
          aria-label="Search barcode, receipt, cashier, or item"
          oninput="scheduleTransactionHistoryFilter()"
        >

      </div>

      <!-- PAYMENT METHOD -->

      <div class="col-lg-3">

        <label class="form-label small">
          Payment Method
        </label>

        <select
          id="transactionHistoryPaymentFilter"
          class="form-select"
          onchange="filterTransactionHistoryTable()"
        >

          <option value="">
            All Payment Methods
          </option>

        </select>

      </div>

    </div>


    <!-- ================= MANAGER SUMMARY ONLY ================= -->

<div
  id="managerTransactionSummary"
  class="row g-2 mb-3"
  style="display:none;"
>

  <div class="col-md-4">

    <div class="border rounded p-2">

      <div class="small text-muted">
        Transactions
      </div>

      <div
        id="transactionHistoryCount"
        class="fw-bold"
      >
        0
      </div>

    </div>

  </div>


  <div class="col-md-4">

    <div class="border rounded p-2">

      <div class="small text-muted">
        Items Sold
      </div>

      <div
        id="transactionHistoryItems"
        class="fw-bold"
      >
        0
      </div>

    </div>

  </div>


  <div class="col-md-4">

    <div class="border rounded p-2">

      <div class="small text-muted">
        Net Sales
      </div>

      <div
        id="transactionHistorySales"
        class="fw-bold"
      >
        ₱0.00
      </div>

    </div>

  </div>


</div>


    <!-- TABLE -->


    <div
      class="table-responsive border rounded"
      style="height:340px; overflow-y:auto;"
    >

      <table
        class="table table-hover align-middle mb-0"
      >

        <thead
          class="table-light"
          style="
            position:sticky;
            top:0;
            z-index:1;
          "
        >

          <tr>

            <th id="transactionHistoryDateHeader" style="display:none;">
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('date')">
                Date <span id="transactionSortDate" aria-hidden="true">↕</span>
              </button>
            </th>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('time')">
                Time <span id="transactionSortTime" aria-hidden="true">↕</span>
              </button>
            </th>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('receiptId')">
                Receipt <span id="transactionSortReceiptId" aria-hidden="true">↕</span>
              </button>
            </th>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('cashier')">
                Cashier <span id="transactionSortCashier" aria-hidden="true">↕</span>
              </button>
            </th>

            <th class="text-center">
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('items')">
                Items <span id="transactionSortItems" aria-hidden="true">↕</span>
              </button>
            </th>

            <th>
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('paymentMethod')">
                Payment <span id="transactionSortPaymentMethod" aria-hidden="true">↕</span>
              </button>
            </th>

            <th class="text-end">
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('total')">
                Total <span id="transactionSortTotal" aria-hidden="true">↕</span>
              </button>
            </th>

            <th class="text-center">
              <button type="button" class="btn btn-link p-0 text-reset text-decoration-none" onclick="sortTransactionHistory('status')">
                Status <span id="transactionSortStatus" aria-hidden="true">↕</span>
              </button>
            </th>

          </tr>

        </thead>


        <tbody id="transactionHistoryRows">

          <tr>

            <td
              colspan="7"
              class="text-center text-muted py-5"
              role="status"
              aria-label="Loading transactions"
            >
              <div class="spinner-border spinner-border-sm text-secondary" aria-hidden="true"></div>
            </td>

          </tr>

        </tbody>

      </table>

    </div>

    </div>
  </div>

</div>

<dialog class="dashboard-modal dashboard-modal-compact" id="transactionHistoryCalendar" aria-labelledby="transactionHistoryCalendarHeading" aria-describedby="transactionHistoryCalendarDescription">
  <div data-dashboard-modal-heading>
    <h2 id="transactionHistoryCalendarHeading">Date range</h2>
    <p id="transactionHistoryCalendarDescription">Select a day or drag to choose a range.</p>
  </div>
  <div class="dashboard-calendar-top">
    <button type="button" class="btn btn-light" aria-label="Previous month" onclick="moveTransactionHistoryMonth(-1)">‹</button>
    <strong id="transactionHistoryCalendarMonth" aria-live="polite"></strong>
    <button type="button" class="btn btn-light" aria-label="Next month" onclick="moveTransactionHistoryMonth(1)">›</button>
  </div>
  <div class="dashboard-calendar-grid text-muted" aria-hidden="true">
    <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
  </div>
  <div id="transactionHistoryCalendarDays" class="dashboard-calendar-grid dashboard-calendar-days" aria-label="Days"
    onpointerdown="startTransactionHistoryDrag(event)" onpointermove="moveTransactionHistoryDrag(event)"
    onpointerup="finishTransactionHistoryDrag(event)" onlostpointercapture="cancelTransactionHistoryDrag(event)"
    onclick="if (event.detail === 0) selectTransactionHistoryDay(event)"></div>
  <div id="transactionHistoryCalendarShortcuts" class="dashboard-calendar-shortcuts" onclick="selectTransactionHistoryShortcut(event)">
    <button type="button" class="btn btn-light" data-preset="today">Today</button>
    <button type="button" class="btn btn-light" data-preset="yesterday">Yesterday</button>
    <button type="button" class="btn btn-light" data-preset="week">This week</button>
    <button type="button" class="btn btn-light" data-preset="month">This month</button>
    <button type="button" class="btn btn-light" data-preset="year">This year</button>
    <button type="button" class="btn btn-light" data-preset="last-week">Last week</button>
    <button type="button" class="btn btn-light" data-preset="last-month">Last month</button>
  </div>
  <p id="transactionHistoryCalendarSelection" class="visually-hidden" aria-live="polite"></p>
  <footer data-dashboard-modal-footer>
    <button type="button" class="btn btn-light" data-dashboard-modal-close>Cancel</button>
    <button type="button" class="btn btn-pink" onclick="applyTransactionHistoryCalendar()">Apply</button>
  </footer>
</dialog>


<script>

var transactionHistoryData = [];
var transactionHistoryFilterTimer = null;
var transactionHistoryWarmTimer = null;
var transactionHistoryLoadedAt = 0;
var transactionHistoryWarmCache = null;
var transactionHistoryCalendarMonth = null;
var transactionHistoryCalendarDraft = [];
var transactionHistoryCalendarDrag = null;
var transactionHistoryCalendarMin = null;
var transactionHistoryCalendarMax = null;
var transactionHistoryCalendarToday = null;
var transactionHistoryDateFormat = new Intl.DateTimeFormat("en-US", {timeZone: "UTC", month: "long", day: "numeric", year: "numeric"});
var transactionHistoryMonthFormat = new Intl.DateTimeFormat("en-US", {timeZone: "UTC", month: "long", year: "numeric"});
var transactionHistoryWarmWaitMs = 1500;
var transactionHistorySort = {
  key: "time",
  direction: "desc"
};


/* ==========================================================
   OPEN
========================================================== */

function openTransactionHistoryModal(period) {

  if (!currentEmployee) {

    showNotificationToast(
      "Employee session not found.",
      true
    );

    return;
  }


  /* ================= TODAY ================= */

  const now =
    new Date();

  const today =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() * 60000
    )
      .toISOString()
      .split("T")[0];

  const accessibleStart = new Date(now);
  accessibleStart.setDate(accessibleStart.getDate() - 7);
  const accessibleStartDate = new Date(
    accessibleStart.getTime() -
    accessibleStart.getTimezoneOffset() * 60000
  )
    .toISOString()
    .split("T")[0];


  const fromDateInput =
    document.getElementById(
      "transactionHistoryFromDate"
    );

  const toDateInput =
    document.getElementById(
      "transactionHistoryToDate"
    );


  fromDateInput.value = period?.start || today;
  toDateInput.value = period?.end || today;

  fromDateInput.min = accessibleStartDate;
  toDateInput.min = accessibleStartDate;
  fromDateInput.max = today;
  toDateInput.max = today;


  document.getElementById(
    "transactionHistorySearch"
  ).value = "";

  const paymentFilter =
  document.getElementById(
    "transactionHistoryPaymentFilter"
  );


if (paymentFilter) {

  paymentFilter.innerHTML = `
    <option value="">
      All Payment Methods
    </option>
  `;

}


  /* ================= ROLE ================= */

  const isManager = hasManagerViewAccess();

  if (toDateInput.value > today) toDateInput.value = today;
  if (!isManager && fromDateInput.value < accessibleStartDate) fromDateInput.value = accessibleStartDate;
  if (!isManager && toDateInput.value < accessibleStartDate) toDateInput.value = accessibleStartDate;
  if (fromDateInput.value > toDateInput.value) fromDateInput.value = toDateInput.value;


  /* ================= DATE PICKER ================= */

  document.getElementById(
    "transactionDateFilterBox"
  ).style.display =
    "block";

  if (isManager) {
    fromDateInput.removeAttribute("min");
    toDateInput.removeAttribute("min");
  } else {
    fromDateInput.min = accessibleStartDate;
    toDateInput.min = accessibleStartDate;
  }
  renderTransactionHistoryDateRangeLabel();

  /* ================= SUMMARY ================= */

const managerSummary =
  document.getElementById(
    "managerTransactionSummary"
  );

if (managerSummary) {

  managerSummary.style.display =
    isManager
      ? "flex"
      : "none";

}

  /* ================= SHOW ================= */

  document.getElementById(
    "transactionHistoryModal"
  ).style.display =
    "flex";


  /* ================= LOAD ================= */

  loadTransactionHistory();

}

function transactionHistoryUtcDate(year, month, day) {
  return new Date(Date.UTC(year, month, day));
}

function parseTransactionHistoryDate(value) {
  const parts = String(value || "").split("-").map(Number);
  return parts.length === 3 && parts.every(Number.isFinite)
    ? transactionHistoryUtcDate(parts[0], parts[1] - 1, parts[2])
    : null;
}

function formatTransactionHistoryDate(date) {
  return [
    date.getUTCFullYear(),
    String(date.getUTCMonth() + 1).padStart(2, "0"),
    String(date.getUTCDate()).padStart(2, "0")
  ].join("-");
}

function describeTransactionHistoryRange(range) {
  const start = range[0];
  const end = range[1] || start;
  if (+start === +end) return transactionHistoryDateFormat.format(start);
  return typeof transactionHistoryDateFormat.formatRange === "function"
    ? transactionHistoryDateFormat.formatRange(start, end)
    : transactionHistoryDateFormat.format(start) + " – " + transactionHistoryDateFormat.format(end);
}

function renderTransactionHistoryDateRangeLabel() {
  const start = parseTransactionHistoryDate(document.getElementById("transactionHistoryFromDate").value);
  const end = parseTransactionHistoryDate(document.getElementById("transactionHistoryToDate").value);
  document.getElementById("transactionHistoryDateRangeLabel").textContent = start && end
    ? describeTransactionHistoryRange([start, end])
    : "Select a date range";
}

function clampTransactionHistoryDate(date) {
  if (transactionHistoryCalendarMin && date < transactionHistoryCalendarMin) return transactionHistoryCalendarMin;
  if (transactionHistoryCalendarMax && date > transactionHistoryCalendarMax) return transactionHistoryCalendarMax;
  return date;
}

function normalizeTransactionHistoryRange(range) {
  const normalized = range.map(clampTransactionHistoryDate).sort(function(a, b) { return a - b; });
  return +normalized[0] === +normalized[normalized.length - 1]
    ? [normalized[0]]
    : [normalized[0], normalized[normalized.length - 1]];
}

function openTransactionHistoryCalendar() {
  const from = document.getElementById("transactionHistoryFromDate");
  const to = document.getElementById("transactionHistoryToDate");
  transactionHistoryCalendarToday = parseTransactionHistoryDate(getTransactionHistoryToday());
  transactionHistoryCalendarMin = parseTransactionHistoryDate(from.min);
  transactionHistoryCalendarMax = parseTransactionHistoryDate(to.max) || transactionHistoryCalendarToday;
  const start = parseTransactionHistoryDate(from.value) || transactionHistoryCalendarToday;
  const end = parseTransactionHistoryDate(to.value) || start;
  transactionHistoryCalendarDraft = normalizeTransactionHistoryRange([start, end]);
  transactionHistoryCalendarMonth = transactionHistoryUtcDate(start.getUTCFullYear(), start.getUTCMonth(), 1);
  const shortcuts = document.getElementById("transactionHistoryCalendarShortcuts");
  shortcuts.hidden = !hasManagerViewAccess();
  shortcuts.style.display = shortcuts.hidden ? "none" : "";
  renderTransactionHistoryCalendar();
  document.getElementById("transactionHistoryCalendar").showModal();
}

function moveTransactionHistoryMonth(offset) {
  transactionHistoryCalendarMonth = transactionHistoryUtcDate(
    transactionHistoryCalendarMonth.getUTCFullYear(),
    transactionHistoryCalendarMonth.getUTCMonth() + offset,
    1
  );
  renderTransactionHistoryCalendar();
}

function renderTransactionHistoryCalendar() {
  const year = transactionHistoryCalendarMonth.getUTCFullYear();
  const month = transactionHistoryCalendarMonth.getUTCMonth();
  const count = transactionHistoryUtcDate(year, month + 1, 0).getUTCDate();
  const start = transactionHistoryCalendarDraft[0];
  const end = transactionHistoryCalendarDraft[1] || start;
  document.getElementById("transactionHistoryCalendarMonth").textContent = transactionHistoryMonthFormat.format(transactionHistoryCalendarMonth);
  const days = document.getElementById("transactionHistoryCalendarDays");
  const focusedDay = days.contains(document.activeElement) ? document.activeElement.dataset.day : "";
  let markup = "<span></span>".repeat(transactionHistoryCalendarMonth.getUTCDay());
  for (let day = 1; day <= count; day++) {
    const date = transactionHistoryUtcDate(year, month, day);
    const disabled = transactionHistoryCalendarMin && date < transactionHistoryCalendarMin || transactionHistoryCalendarMax && date > transactionHistoryCalendarMax;
    const inRange = date >= start && date <= end;
    const edge = +date === +start || +date === +end;
    let selectionClass = edge ? "range-edge" : inRange ? "in-range" : "";
    if (+date === +start && start < end && date.getUTCDay() !== 6 && day < count) selectionClass += " range-start";
    if (+date === +end && start < end && date.getUTCDay() !== 0 && day > 1) selectionClass += " range-end";
    const current = +date === +transactionHistoryCalendarToday ? ' aria-current="date"' : "";
    markup += '<button type="button" data-day="' + day + '" aria-label="' + transactionHistoryDateFormat.format(date) +
      '" aria-pressed="' + inRange + '" class="' + selectionClass + '"' + current + (disabled ? " disabled" : "") + ">" + day + "</button>";
  }
  days.innerHTML = markup;
  if (focusedDay) days.querySelector('[data-day="' + focusedDay + '"]:not(:disabled)')?.focus();
  document.getElementById("transactionHistoryCalendarSelection").textContent = transactionHistoryCalendarDraft.length === 1
    ? "Start: " + transactionHistoryDateFormat.format(start) + " · Choose an end date"
    : describeTransactionHistoryRange(transactionHistoryCalendarDraft);
}

function selectTransactionHistoryDay(event) {
  const day = Number(event.target.dataset.day);
  if (!day || event.target.disabled) return;
  const date = transactionHistoryUtcDate(
    transactionHistoryCalendarMonth.getUTCFullYear(),
    transactionHistoryCalendarMonth.getUTCMonth(),
    day
  );
  transactionHistoryCalendarDraft = transactionHistoryCalendarDraft.length === 1
    ? normalizeTransactionHistoryRange(transactionHistoryCalendarDraft.concat(date))
    : [date];
  renderTransactionHistoryCalendar();
}

function startTransactionHistoryDrag(event) {
  const day = Number(event.target.dataset.day);
  if (!day || event.target.disabled || event.button !== 0 || transactionHistoryCalendarDrag) return;
  event.currentTarget.setPointerCapture(event.pointerId);
  transactionHistoryCalendarDrag = {
    pointerId: event.pointerId,
    startDay: day,
    lastDay: day,
    previousDraft: transactionHistoryCalendarDraft,
    moved: false
  };
}

function moveTransactionHistoryDrag(event) {
  if (transactionHistoryCalendarDrag?.pointerId !== event.pointerId) return;
  const target = document.elementFromPoint(event.clientX, event.clientY);
  if (!target || !event.currentTarget.contains(target) || target.disabled) return;
  const day = Number(target.dataset.day);
  if (!day || day === transactionHistoryCalendarDrag.lastDay) return;
  transactionHistoryCalendarDrag.lastDay = day;
  transactionHistoryCalendarDrag.moved = true;
  const year = transactionHistoryCalendarMonth.getUTCFullYear();
  const month = transactionHistoryCalendarMonth.getUTCMonth();
  transactionHistoryCalendarDraft = normalizeTransactionHistoryRange([
    transactionHistoryUtcDate(year, month, transactionHistoryCalendarDrag.startDay),
    transactionHistoryUtcDate(year, month, day)
  ]);
  renderTransactionHistoryCalendar();
}

function finishTransactionHistoryDrag(event) {
  if (transactionHistoryCalendarDrag?.pointerId !== event.pointerId) return;
  moveTransactionHistoryDrag(event);
  const startDay = transactionHistoryCalendarDrag.startDay;
  const moved = transactionHistoryCalendarDrag.moved;
  transactionHistoryCalendarDrag = null;
  if (!moved) selectTransactionHistoryDay({target: {dataset: {day: startDay}, disabled: false}});
}

function cancelTransactionHistoryDrag(event) {
  if (transactionHistoryCalendarDrag?.pointerId !== event.pointerId) return;
  transactionHistoryCalendarDraft = transactionHistoryCalendarDrag.previousDraft;
  transactionHistoryCalendarDrag = null;
  renderTransactionHistoryCalendar();
}

function transactionHistoryPresetRange(preset) {
  const today = transactionHistoryCalendarToday;
  const year = today.getUTCFullYear();
  const month = today.getUTCMonth();
  const day = today.getUTCDate();
  const offset = preset.startsWith("last-") ? -1 : 0;
  switch (preset.replace("last-", "")) {
    case "week": {
      const monday = day - (today.getUTCDay() + 6) % 7 + offset * 7;
      return [transactionHistoryUtcDate(year, month, monday), transactionHistoryUtcDate(year, month, monday + 6)];
    }
    case "month":
      return [transactionHistoryUtcDate(year, month + offset, 1), transactionHistoryUtcDate(year, month + offset + 1, 0)];
    case "year":
      return [transactionHistoryUtcDate(year + offset, 0, 1), transactionHistoryUtcDate(year + offset, 11, 31)];
    default: {
      const date = preset === "yesterday" ? transactionHistoryUtcDate(year, month, day - 1) : today;
      return [date, date];
    }
  }
}

function selectTransactionHistoryShortcut(event) {
  const preset = event.target.dataset.preset;
  if (!preset) return;
  transactionHistoryCalendarDraft = normalizeTransactionHistoryRange(transactionHistoryPresetRange(preset));
  const visibleDate = transactionHistoryCalendarDraft[1] || transactionHistoryCalendarDraft[0];
  transactionHistoryCalendarMonth = transactionHistoryUtcDate(visibleDate.getUTCFullYear(), visibleDate.getUTCMonth(), 1);
  renderTransactionHistoryCalendar();
}

function applyTransactionHistoryCalendar() {
  const start = transactionHistoryCalendarDraft[0];
  const end = transactionHistoryCalendarDraft[1] || start;
  document.getElementById("transactionHistoryFromDate").value = formatTransactionHistoryDate(start);
  document.getElementById("transactionHistoryToDate").value = formatTransactionHistoryDate(end);
  renderTransactionHistoryDateRangeLabel();
  document.getElementById("transactionHistoryCalendar").close();
  loadTransactionHistory();
}


/* ==========================================================
   CLOSE
========================================================== */

function closeTransactionHistoryModal() {

  const calendar = document.getElementById("transactionHistoryCalendar");
  if (calendar && calendar.open) calendar.close();

  document.getElementById(
    "transactionHistoryModal"
  ).style.display =
    "none";

}

function scheduleTransactionHistoryFilter() {
  window.clearTimeout(transactionHistoryFilterTimer);
  transactionHistoryFilterTimer = window.setTimeout(function() {
    filterTransactionHistoryTable();
  }, 300);
}

function setTransactionHistoryLoading(isLoading) {
  const loader = document.getElementById("transactionHistoryLoading");
  const content = document.getElementById("transactionHistoryContent");

  if (loader) loader.style.display = isLoading ? "block" : "none";
  if (content) content.style.display = isLoading ? "none" : "block";
}

function shouldShowTransactionHistoryDate() {
  const from = document.getElementById("transactionHistoryFromDate");
  const to = document.getElementById("transactionHistoryToDate");
  return Boolean(from && to && from.value && to.value && from.value !== to.value);
}

function updateTransactionHistoryDateColumn() {
  const header = document.getElementById("transactionHistoryDateHeader");
  if (header) header.style.display = shouldShowTransactionHistoryDate() ? "" : "none";
}

function getTransactionHistoryColumnCount() {
  return shouldShowTransactionHistoryDate() ? 8 : 7;
}

function getTransactionHistoryToday() {
  const now = new Date();
  return new Date(now.getTime() - now.getTimezoneOffset() * 60000)
    .toISOString()
    .split("T")[0];
}

function getTransactionHistoryCacheKey(fromDate, toDate, isManager) {
  return JSON.stringify([currentCashier, fromDate, toDate, Boolean(isManager)]);
}

function prepareTransactionHistoryData(transactions) {
  return (Array.isArray(transactions) ? transactions : []).map(function(tx) {
    tx.searchText = [tx.receiptId, tx.cashier, tx.paymentMethod, tx.status, tx.itemNames]
      .concat(tx.sizes || [], tx.barcodes || []).join(" ").toLowerCase();
    return tx;
  });
}

function warmTransactionHistory() {
  if (!currentEmployee || !currentCashier) return;

  const owner = currentEmployee.dashboardToken;
  const cashier = currentCashier;
  const today = getTransactionHistoryToday();
  const isManager = hasManagerViewAccess();
  const key = getTransactionHistoryCacheKey(today, today, isManager);
  const existing = pageReadCache.get('transactions');
  if (existing && existing.owner === JSON.stringify([currentEmployee, cashier]) && existing.key === JSON.stringify([today, today, isManager]) &&
      (existing.pending || existing.data !== undefined && Date.now() - transactionHistoryLoadedAt <= 60000)) return;
  const cached = transactionHistoryWarmCache;
  if (cached && cached.owner === owner && cached.key === key && (cached.pending || cached.data !== null && Date.now() - cached.loadedAt <= 60000)) return;

  const read = {owner: owner, key: key, pending: true, data: null, loadedAt: 0, startedAt: Date.now(), fallbackTimer: null};
  transactionHistoryWarmCache = read;
  const current = () => transactionHistoryWarmCache === read && currentEmployee && currentEmployee.dashboardToken === owner && currentCashier === cashier;
  read.promise = new Promise(resolve => secureScriptRun
    .withSuccessHandler(function(result) {
      window.clearTimeout(read.fallbackTimer);
      if (current()) {
        if (result && result.success === true) {
          read.data = prepareTransactionHistoryData(result.transactions);
          read.pending = false;
          read.loadedAt = Date.now();
        } else transactionHistoryWarmCache = null;
      }
      resolve();
    })
    .withFailureHandler(function() {
      window.clearTimeout(read.fallbackTimer);
      if (current()) transactionHistoryWarmCache = null;
      resolve();
    })
    .getTransactionHistory(cashier, today, today, isManager));
}

function scheduleTransactionHistoryWarmup(delay) {
  window.clearTimeout(transactionHistoryWarmTimer);
  if (!currentEmployee || !currentCashier) return;
  const owner = currentEmployee.dashboardToken;
  transactionHistoryWarmTimer = window.setTimeout(function() {
    if (typeof secureScriptRun !== "undefined" && currentEmployee && currentEmployee.dashboardToken === owner) warmTransactionHistory();
  }, Number.isFinite(delay) ? delay : 750);
}

function clearTransactionHistoryCache() {
  window.clearTimeout(transactionHistoryWarmTimer);
  if (transactionHistoryWarmCache) window.clearTimeout(transactionHistoryWarmCache.fallbackTimer);
  transactionHistoryWarmCache = null;
  transactionHistoryLoadedAt = 0;
  if (typeof pageReadCache !== "undefined") pageReadCache.delete("transactions");
}


/* ==========================================================
   LOAD
========================================================== */

function loadTransactionHistory(forceRefresh) {

  if (!currentEmployee) return;
  updateTransactionHistoryDateColumn();
  if (forceRefresh === true || (transactionHistoryLoadedAt && Date.now() - transactionHistoryLoadedAt > 60000)) {
    pageReadCache.delete('transactions');
    transactionHistoryLoadedAt = 0;
  }

  const tbody =
    document.getElementById(
      "transactionHistoryRows"
    );

  if (!tbody) {

    console.error(
      "transactionHistoryRows not found"
    );

    return;
  }


  const fromDate =
    document.getElementById(
      "transactionHistoryFromDate"
    ).value;

  const toDate =
    document.getElementById(
      "transactionHistoryToDate"
    ).value;


  const isManager = hasManagerViewAccess();

  const cacheKey = getTransactionHistoryCacheKey(fromDate, toDate, isManager);
  const warm = transactionHistoryWarmCache;
  const owner = currentEmployee.dashboardToken;
  if (forceRefresh !== true && warm && warm.owner === owner && warm.key === cacheKey && warm.pending) {
    const remainingWait = transactionHistoryWarmWaitMs - (Date.now() - warm.startedAt);
    if (remainingWait > 0) {
      setTransactionHistoryLoading(true);
      if (!warm.fallbackTimer) warm.fallbackTimer = window.setTimeout(function() {
        if (transactionHistoryWarmCache !== warm || !warm.pending) return;
        transactionHistoryWarmCache = null;
        if (currentEmployee && currentEmployee.dashboardToken === owner && document.getElementById('transactionHistoryModal').style.display !== 'none' &&
            document.getElementById('transactionHistoryFromDate').value === fromDate && document.getElementById('transactionHistoryToDate').value === toDate) loadTransactionHistory();
      }, remainingWait);
      warm.promise.then(() => {
        if (currentEmployee && currentEmployee.dashboardToken === owner && document.getElementById('transactionHistoryModal').style.display !== 'none' &&
            document.getElementById('transactionHistoryFromDate').value === fromDate && document.getElementById('transactionHistoryToDate').value === toDate) loadTransactionHistory();
      });
      return;
    }
    window.clearTimeout(warm.fallbackTimer);
    transactionHistoryWarmCache = null;
  }
  if (
    forceRefresh !== true &&
    warm &&
    warm.owner === owner &&
    warm.key === cacheKey &&
    warm.data !== null &&
    Date.now() - warm.loadedAt <= 60000
  ) {
    setTransactionHistoryLoading(false);
    transactionHistoryData = warm.data;
    transactionHistoryLoadedAt = warm.loadedAt;
    populateTransactionPaymentFilter(transactionHistoryData);
    filterTransactionHistoryTable();
    return;
  }


  const refresh = beginPageRead('transactions', JSON.stringify([fromDate, toDate, isManager]), true);
  if (refresh.cached !== undefined) {
    setTransactionHistoryLoading(false);
    transactionHistoryData = refresh.cached;
    populateTransactionPaymentFilter(transactionHistoryData);
    filterTransactionHistoryTable();
  } else {
  setTransactionHistoryLoading(true);
  tbody.innerHTML = `
    <tr>
      <td
        colspan="${getTransactionHistoryColumnCount()}"
        class="text-center text-muted py-5"
        role="status"
        aria-label="Loading transactions"
      >
        <div class="spinner-border spinner-border-sm text-secondary" aria-hidden="true"></div>
      </td>
    </tr>
  `;


  }
  if (!refresh.shouldFetch) return;
  secureScriptRun

    .withSuccessHandler(function(result) {
      if (!refresh.current()) return;

      if (
        !result ||
        result.success !== true
      ) {
        refresh.fail();

        const message =
          result && result.message
            ? result.message
            : "Unknown backend response";


        console.error(
          "Transaction history failed:",
          message
        );


        if (refresh.cached !== undefined) { setTransactionHistoryLoading(false); showNotificationToast('Transaction refresh failed. Showing previously loaded data.', true); return; }


        setTransactionHistoryLoading(false);
        tbody.innerHTML = `
          <tr>
            <td
              colspan="${getTransactionHistoryColumnCount()}"
              class="text-center text-danger py-5"
            >
              ${escapeTransactionHtml(message)}
            </td>
          </tr>
        `;

        return;
      }


      transactionHistoryData =
        Array.isArray(
          result.transactions
        )
          ? result.transactions
          : [];

      transactionHistoryData = prepareTransactionHistoryData(transactionHistoryData);
      transactionHistoryLoadedAt = Date.now();
      refresh.save(transactionHistoryData);
      setTransactionHistoryLoading(false);
      populateTransactionPaymentFilter(
        transactionHistoryData
      );


      filterTransactionHistoryTable();

    })


    .withFailureHandler(function(err) {
      if (!refresh.current()) return;
      refresh.fail();

      console.error(
        "TRANSACTION HISTORY SERVER ERROR:",
        err
      );


      if (refresh.cached !== undefined) { setTransactionHistoryLoading(false); showNotificationToast('Transaction refresh failed. Showing previously loaded data.', true); return; }


      setTransactionHistoryLoading(false);
      tbody.innerHTML = `
        <tr>

          <td
            colspan="${getTransactionHistoryColumnCount()}"
            class="text-center text-danger py-5"
          >

            ${
              escapeTransactionHtml(
                err && err.message
                  ? err.message
                  : "Server error"
              )
            }

          </td>

        </tr>
      `;

    })


    .getTransactionHistory(
      currentCashier,
      fromDate,
      toDate,
      isManager
    );

}

/* ==========================================================
   PAYMENT METHOD FILTER OPTIONS
========================================================== */

function populateTransactionPaymentFilter(
  transactions
) {

  const select =
    document.getElementById(
      "transactionHistoryPaymentFilter"
    );


  if (!select) {

    return;

  }


  const previousValue =
    select.value;


  const paymentMethods =
    Array.from(
      new Set(
        transactions
          .map(
            function(tx) {

              return String(
                tx.paymentMethod || ""
              ).trim();

            }
          )
          .filter(Boolean)
      )
    )
      .sort(
        function(a, b) {

          return a.localeCompare(b);

        }
      );


  select.innerHTML = `
    <option value="">
      All Payment Methods
    </option>
  `;


  paymentMethods.forEach(
    function(method) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        method;


      option.textContent =
        method;


      select.appendChild(
        option
      );

    }
  );


  if (
    paymentMethods.includes(
      previousValue
    )
  ) {

    select.value =
      previousValue;

  }

}
/* ==========================================================
   SORT
========================================================== */

function sortTransactionHistory(key) {
  if (transactionHistorySort.key === key) {
    transactionHistorySort.direction = transactionHistorySort.direction === "asc"
      ? "desc"
      : "asc";
  } else {
    transactionHistorySort.key = key;
    transactionHistorySort.direction = key === "date" || key === "time" || key === "total" || key === "items"
      ? "desc"
      : "asc";
  }

  filterTransactionHistoryTable();
}

function updateTransactionHistorySortIndicators() {
  const keys = ["date", "time", "receiptId", "cashier", "items", "paymentMethod", "total", "status"];

  keys.forEach(function(key) {
    const indicator = document.getElementById("transactionSort" + key.charAt(0).toUpperCase() + key.slice(1));
    if (indicator) {
      indicator.textContent = transactionHistorySort.key === key
        ? (transactionHistorySort.direction === "asc" ? "↑" : "↓")
        : "↕";
    }
  });
}

function getSortedTransactionHistory(items) {
  const sorted = items.slice();
  const key = transactionHistorySort.key;
  const direction = transactionHistorySort.direction === "asc" ? 1 : -1;

  sorted.sort(function(a, b) {
    let first = a[key];
    let second = b[key];

    if (key === "date" || key === "time") {
      first = a.sortTimestamp ?? Date.parse("1970/01/01 " + String(first || ""));
      second = b.sortTimestamp ?? Date.parse("1970/01/01 " + String(second || ""));
    } else if (key === "items" || key === "total") {
      first = Number(first) || 0;
      second = Number(second) || 0;
    } else {
      first = String(first || "").toLowerCase();
      second = String(second || "").toLowerCase();
    }

    if (first < second) return -1 * direction;
    if (first > second) return 1 * direction;
    return 0;
  });

  return sorted;
}

/* ==========================================================
   RENDER
========================================================== */

function renderTransactionHistory(items) {

  const tbody =
    document.getElementById(
      "transactionHistoryRows"
    );


  tbody.innerHTML = "";
  updateTransactionHistoryDateColumn();
  const showDate = shouldShowTransactionHistoryDate();
  const columnCount = getTransactionHistoryColumnCount();
  updateTransactionHistorySortIndicators();


  if (
    !Array.isArray(items) ||
    items.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="${columnCount}"
          class="text-center text-muted py-5"
        >
          No transactions found.
        </td>
      </tr>
    `;


    updateTransactionHistorySummary([]);

    return;

  }


  items.forEach(function(tx) {

    const row =
      document.createElement("tr");

        row.style.cursor = "pointer";

    row.onclick = function() {

      openTransactionDetails(
        tx.receiptId
      );

    };

    row.innerHTML = `

      ${showDate ? `<td>${escapeTransactionHtml(tx.date || "")}</td>` : ""}

      <td>
        ${escapeTransactionHtml(tx.time)}
      </td>

      <td>
        <span class="font-monospace small">
          ${escapeTransactionHtml(tx.receiptId)}
        </span>
      </td>

      <td>
        ${escapeTransactionHtml(tx.cashier)}
      </td>

      <td class="text-center">
        ${Number(tx.items) || 0}
      </td>

      <td>
        ${escapeTransactionHtml(tx.paymentMethod)}
      </td>

      <td class="text-end fw-bold">
        ₱${Number(tx.total || 0).toFixed(2)}
      </td>

      <td class="text-center">
        ${buildTransactionStatusBadge(tx.status)}
      </td>

    `;


    tbody.appendChild(row);

  });


  updateTransactionHistorySummary(items);

}


/* ==========================================================
   SUMMARY
========================================================== */

function updateTransactionHistorySummary(items) {

  let completedTransactions = 0;
  let itemCount = 0;
  let netSales = 0;


  items.forEach(function(tx) {

    const status =
      String(tx.status || "")
        .trim()
        .toUpperCase();


    /*
      Only COMPLETED transactions count
      toward sales statistics.
    */

    if (status === "VOIDED") {
      return;
    }


    completedTransactions++;


    itemCount +=
      Number(tx.items) || 0;


    netSales +=
      Number(tx.total) || 0;

  });

  document.getElementById(
    "transactionHistoryCount"
  ).textContent =
    items.length;

  document.getElementById(
    "transactionHistoryItems"
  ).textContent =
    itemCount;


  /*
    Net Sales:
    COMPLETED only
  */

  document.getElementById(
    "transactionHistorySales"
  ).textContent =
    "₱" +
    netSales.toFixed(2);

}

/* ==========================================================
   STATUS
========================================================== */

function buildTransactionStatusBadge(status) {

  const value =
    String(status || "")
      .trim()
      .toUpperCase();


  if (value === "RESERVED") return '<span class="badge bg-warning text-dark">Reserved</span>';
  if (value === "EXCHANGED") return '<span class="badge bg-secondary">Exchanged</span>';
  if (value === "VOIDED") {

    return `
      <span class="badge bg-danger">
        Voided
      </span>
    `;

  }

  if (value === "PARTIALLY VOIDED") {
    return `
      <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">
        Amended
      </span>
    `;
  }


  return `
    <span class="badge bg-success">
      Completed
    </span>
  `;

}


/* ==========================================================
   SEARCH
========================================================== */

/* ==========================================================
   FILTER TRANSACTION HISTORY

   Search + Payment Method
========================================================== */

function filterTransactionHistoryTable() {

  const query =
    document.getElementById(
      "transactionHistorySearch"
    )
      .value
      .trim()
      .toLowerCase();


  const paymentMethod =
    document.getElementById(
      "transactionHistoryPaymentFilter"
    )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    transactionHistoryData.filter(
      function(tx) {

        /* ================= SEARCH ================= */

        const searchable = tx.searchText ||
          [

            tx.receiptId,
            tx.cashier,
            tx.paymentMethod,
            tx.status,
            tx.itemNames,
            (tx.sizes || []).join(' '),
            (tx.barcodes || []).join(' ')

          ]
            .map(
              function(value) {

                return String(
                  value || ""
                );

              }
            )
            .join(" ")
            .toLowerCase();


        const matchesSearch =
          !query ||
          searchable.includes(
            query
          );


        /* ================= PAYMENT ================= */

        const transactionPayment =
          String(
            tx.paymentMethod || ""
          )
            .trim()
            .toLowerCase();


        const matchesPayment =
          !paymentMethod ||
          transactionPayment ===
            paymentMethod;


        return (
          matchesSearch &&
          matchesPayment
        );

      }
    );


  renderTransactionHistory(
    getSortedTransactionHistory(filtered)
  );

}

/* ==========================================================
   SAFE TRANSACTION HTML
========================================================== */

function escapeTransactionHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

</script>
