<div id="standardDeliveryDetails" class="generic-overlay-blur" style="display:none">
 <div class="custom-popup-card delivery-modal-card" style="max-width:760px">
  <div class="d-flex justify-content-between border-bottom pb-3 mb-4"><div><h5 class="fw-bold">Delivery Details</h5><strong id="standardDeliveryId"></strong></div><button type="button" class="btn-close" aria-label="Close" onclick="closeStandardDeliveryDetails()"></button></div>
  <div id="standardDeliveryContent"></div>
  <div class="d-flex gap-2 mt-4"><button type="button" class="btn btn-outline-secondary flex-fill" onclick="closeStandardDeliveryDetails()">Close</button><button type="button" class="btn btn-pink flex-fill" onclick="printDeliveryReport(selectedDeliveryReportId,this)">Print Report</button></div>
 </div>
</div>
<script>
let selectedDeliveryReportId = '', deliveryViewRequest = 0, deliveryViewData = null;
let deliveryViewFilters = {size:'',status:'',group:''};
function closeStandardDeliveryDetails(){++deliveryViewRequest;document.getElementById('standardDeliveryDetails').style.display='none';}
function deliveryDetailsCache_(){
 const ownerKey=JSON.stringify(currentEmployee);
 let cache=pageReadCache.get('standardDeliveryDetails');
 if(!cache||cache.owner!==ownerKey){cache={owner:ownerKey,entries:new Map()};pageReadCache.set('standardDeliveryDetails',cache);}
 return cache;
}
function requestDeliveryDetails_(deliveryId){
 const id=String(deliveryId||'').trim(),cache=deliveryDetailsCache_();
 let entry=cache.entries.get(id);
 if(entry)return {cache:cache,entry:entry};
 entry={};cache.entries.set(id,entry);
 entry.promise=new Promise((resolve,reject)=>{
  secureScriptRun.withSuccessHandler(data=>{
   if(!currentEmployee||cache.owner!==JSON.stringify(currentEmployee)||pageReadCache.get('standardDeliveryDetails')!==cache)return reject(new Error('Delivery data changed. Reopen the delivery.'));
   if(!data||data.id!==id){cache.entries.delete(id);return reject(new Error('Unable to load delivery details.'));}
   entry.data=data;resolve(data);
  }).withFailureHandler(error=>{cache.entries.delete(id);reject(error);}).getDeliveryDetails(id);
 });
 return {cache:cache,entry:entry};
}
function prefetchDeliveryDetails(deliveryId){const entry=requestDeliveryDetails_(deliveryId).entry;if(entry.promise)entry.promise.catch(()=>{});}
function preloadDeliveryDetails(deliveries) {
 if(!currentEmployee||!Array.isArray(deliveries)||!deliveries.length)return;
 const cache=deliveryDetailsCache_();
 const queue=cache.preload||(cache.preload={ids:[],attempted:new Set(),active:0,timer:null});
 const ids=[...new Set(deliveries.map(delivery=>String(delivery.deliveryId||'').trim()).filter(Boolean))];
 ids.forEach(id=>{if(!queue.attempted.has(id)&&!cache.entries.has(id)){queue.attempted.add(id);queue.ids.push(id);}});
 const preferred=new Set(ids);
 queue.ids=queue.ids.filter(id=>preferred.has(id)).concat(queue.ids.filter(id=>!preferred.has(id)));
 scheduleDeliveryDetailsPreload_(cache);
}
function scheduleDeliveryDetailsPreload_(cache) {
 const queue=cache.preload;
 if(!currentEmployee||pageReadCache.get('standardDeliveryDetails')!==cache||cache.owner!==JSON.stringify(currentEmployee)){
  clearTimeout(queue.timer);queue.ids=[];return;
 }
 if(queue.timer||!queue.ids.length||queue.active>=2)return;
 queue.timer=setTimeout(function pump(){
  queue.timer=null;
  if(!currentEmployee||pageReadCache.get('standardDeliveryDetails')!==cache||cache.owner!==JSON.stringify(currentEmployee))return;
  if(workspaceForegroundLoading()){queue.timer=setTimeout(pump,100);return;}
  while(queue.active<2&&queue.ids.length){
   const id=queue.ids.shift();
   if(cache.entries.has(id))continue;
   queue.active++;
   const entry=requestDeliveryDetails_(id).entry;
   entry.promise.catch(()=>{}).finally(()=>{queue.active--;scheduleDeliveryDetailsPreload_(cache);});
  }
 },100);
}
function viewDeliveryDetails(deliveryId) {
 selectedDeliveryReportId=String(deliveryId||'');
 deliveryViewFilters={size:'',status:'',group:''};
 const request=++deliveryViewRequest,owner=currentEmployee;
 document.getElementById('standardDeliveryId').textContent=selectedDeliveryReportId;
 document.getElementById('standardDeliveryContent').innerHTML=loadingIndicator('Loading delivery…');
 document.getElementById('standardDeliveryDetails').style.display='flex';
 const requested=requestDeliveryDetails_(selectedDeliveryReportId),cache=requested.cache,entry=requested.entry;
 if(entry&&entry.data){deliveryViewData=entry.data;renderStandardDeliveryDetails();return;}
 entry.promise.then(data=>{if(request!==deliveryViewRequest||currentEmployee!==owner||!currentEmployee||pageReadCache.get('standardDeliveryDetails')!==cache)return;deliveryViewData=data;renderStandardDeliveryDetails();}).catch(error=>{if(request!==deliveryViewRequest||currentEmployee!==owner)return;document.getElementById('standardDeliveryContent').textContent=error.message||String(error);});

}
function deliveryDetailSizeKey_(value) {
 const size=String(value||'').trim().replace(/\s+/g,' ').toUpperCase();
 return ({S:'SNE',M:'MNE',L:'LNE',XL:'XLNE',BULKY:'BNE','NO SIZE':'NS'})[size]||size||'UNSPECIFIED SIZE';
}
function deliveryDetailSizeOrder_(a,b) {
 const order=['SE','ME','LE','XLE','SNE','MNE','LNE','XLNE','BNE','NS'];
 const x=deliveryDetailSizeKey_(a),y=deliveryDetailSizeKey_(b);
 const rank=size=>order.includes(size)?order.indexOf(size):order.length;
 return rank(x)-rank(y)||x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'});
}
function toggleDeliveryDetailFilter_(kind,value) {
 deliveryViewFilters[kind]=deliveryViewFilters[kind]===value?'':value;
 renderStandardDeliveryDetails();
}
function deliveryDetailFilterCard_(label,quantity,kind,value) {
 const button=document.createElement('button');button.type='button';
 button.className='btn delivery-count-filter px-3 py-2';
 button.setAttribute('aria-pressed',String(deliveryViewFilters[kind]===value));
 button.setAttribute('aria-label','Filter '+label+' · '+quantity+' pcs');
 const title=document.createElement('span');title.className='small d-block';title.textContent=label;
 const count=document.createElement('strong');count.className='fs-4 d-block';count.textContent=quantity;
 button.append(title,count);button.onclick=()=>toggleDeliveryDetailFilter_(kind,value);
 return button;
}
function renderStandardDeliveryDetails(){
 const data=deliveryViewData,body=document.getElementById('standardDeliveryContent');body.replaceChildren();
 const group=data.groups.find(item=>item.id===deliveryViewFilters.group)||data.groups[0];
 deliveryViewFilters.group=group?group.id:'';
 const meta=document.createElement('div');meta.className='row g-3 mb-4';
 [['Delivery Date',data.date],['Status',data.status],['Driver',data.driver],['Plate No.',data.plate],['Accepted By',data.acceptedBy],['Category',data.category]].forEach(([label,value])=>{const field=document.createElement('div');field.className='col-6';const name=document.createElement('div');name.className='text-muted small';name.textContent=label;const text=document.createElement('div');text.className='fw-semibold';text.textContent=value||'—';if(label==='Status'){text.innerHTML=buildDeliveryStatusBadge(value);}field.append(name,text);meta.append(field);});body.append(meta);
 const summary=document.createElement('div');summary.className='bg-light rounded p-3 mb-4';
 const heading=document.createElement('div');heading.className='d-flex justify-content-between mb-3 fw-semibold';heading.innerHTML='<span>Quantity Received</span><span></span>';heading.lastElementChild.textContent=data.bundleCount?data.bundleCount+' bundles':'Total: '+data.actual+' pcs';summary.append(heading);
 const counts=document.createElement('div');counts.className='d-flex gap-3 flex-wrap';
 let entries=data.bundleCount?[['Estimated Pieces',data.estimated],['Actual Distributed',data.bulkActual],[data.status==='COMPLETED'?'Final Variance':'Current Variance',data.bulkActual-data.estimated]]:Object.entries(data.counts);
 if(data.yourFinds){
  const sizes=new Map();entries.forEach(([label,quantity])=>{const key=deliveryDetailSizeKey_(label);sizes.set(key,(sizes.get(key)||0)+(Number(quantity)||0));});
  entries=Array.from(sizes).sort(([a],[b])=>deliveryDetailSizeOrder_(a,b));
 }
 entries.forEach(([label,quantity])=>{
  if(data.yourFinds){counts.append(deliveryDetailFilterCard_(label,quantity,'size',deliveryDetailSizeKey_(label)));return;}
  const box=document.createElement('div');box.className='border rounded bg-white px-3 py-2';const title=document.createElement('div');title.className='small text-muted';title.textContent=label;const count=document.createElement('strong');count.className='fs-4';count.textContent=quantity;box.append(title,count);counts.append(box);
 });summary.append(counts);body.append(summary);
 if(data.yourFinds){
  const statuses=document.createElement('div');statuses.className='d-flex gap-2 flex-wrap mb-4';statuses.setAttribute('aria-label','Item status quantities');
  const items=(group?group.items:[]).filter(item=>!deliveryViewFilters.size||deliveryDetailSizeKey_(item.size)===deliveryViewFilters.size);
  [['SOLD','Sold'],['INCOMPLETE','Incomplete'],['IN STOCK','In Stock']].forEach(([status,label])=>{
   const quantity=items.filter(item=>getDeliveryItemDisplayStatus(item)===status).reduce((sum,item)=>sum+Math.max(0,Number(item.quantity)||0),0);
   const card=deliveryDetailFilterCard_(label,quantity,'status',status);card.classList.add('flex-fill');statuses.append(card);
  });body.append(statuses);
 }
 const itemsToolbar=document.createElement('div');itemsToolbar.className='d-flex align-items-center justify-content-between gap-2 mb-2';
 const headingItems=document.createElement('h6');headingItems.className='fw-bold mb-0';headingItems.textContent=data.bundleCount?'Distributed Items':'Delivered Items';itemsToolbar.append(headingItems);
 if(deliveryViewFilters.size||deliveryViewFilters.status){const clear=document.createElement('button');clear.type='button';clear.className='btn btn-sm btn-outline-secondary';clear.textContent='Clear filters';clear.onclick=()=>{deliveryViewFilters.size='';deliveryViewFilters.status='';renderStandardDeliveryDetails();};itemsToolbar.append(clear);}
 body.append(itemsToolbar);
 const tabs=document.createElement('div');tabs.className='delivery-mode-toggle btn-group flex-wrap mb-3';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Delivery item groups');
 const items=document.createElement('div');
 data.groups.forEach(itemGroup=>{const button=document.createElement('button');button.type='button';button.className='btn btn-sm btn-outline-pink';button.textContent=itemGroup.id==='direct'?'Direct':(new Set(data.groups.filter(g=>g.type).map(g=>g.type)).size>1?itemGroup.type+' · ':'')+itemGroup.label;button.onclick=()=>{deliveryViewFilters.group=itemGroup.id;renderStandardDeliveryDetails();};tabs.append(button);button.setAttribute('aria-pressed',String(itemGroup.id===deliveryViewFilters.group));});
 if(data.bundleCount)body.append(tabs);body.append(items);
 if(group)renderStandardDeliveryItems(group,items);
}
function renderStandardDeliveryItems(group,container){
 container.replaceChildren();
 if(group.id!=='direct'){const summary=document.createElement('div');summary.className='small text-muted mb-2';summary.textContent=(group.code?'Bundle code: '+group.code+' · ':'')+'Actual: '+group.items.reduce((sum,item)=>sum+item.quantity,0)+' pcs';container.append(summary);}
 const filtered=group.items.filter(item=>!deliveryViewData.yourFinds||
  ((!deliveryViewFilters.size||deliveryDetailSizeKey_(item.size)===deliveryViewFilters.size)&&(!deliveryViewFilters.status||getDeliveryItemDisplayStatus(item)===deliveryViewFilters.status)));
 if(deliveryViewData.yourFinds)filtered.sort((a,b)=>deliveryDetailSizeOrder_(a.size,b.size)||String(a.name).localeCompare(String(b.name),undefined,{numeric:true,sensitivity:'base'}));
 if(!filtered.length){const empty=document.createElement('div');empty.className='text-muted text-center py-4';empty.textContent=deliveryViewFilters.size||deliveryViewFilters.status?'No items match these filters.':'No products distributed from this bundle yet.';container.append(empty);return;}
 const list=document.createElement('div');list.className='delivery-detail-item-list';container.append(list);
 filtered.forEach(item=>{
  const row=document.createElement('div');row.className='d-flex align-items-center gap-3 border rounded p-2 mb-2';
  if(item.imageUrl&&/^https?:\/\//i.test(item.imageUrl)){const photo=document.createElement('button');photo.type='button';photo.className='btn p-0';photo.setAttribute('aria-label','View '+item.name+' image');const image=document.createElement('img');image.loading='lazy';image.decoding='async';image.src=item.imageUrl;image.alt=item.name;image.style.cssText='width:56px;height:56px;object-fit:cover;border-radius:6px';photo.append(image);photo.onclick=()=>openInventoryImageViewer(item);row.append(photo);}else{const placeholder=document.createElement('span');placeholder.className='small text-muted bg-light rounded p-2';placeholder.style.cssText='width:56px;flex-shrink:0';placeholder.textContent='No Image';row.append(placeholder);}
  const info=document.createElement('div');info.className='flex-grow-1';info.style.minWidth='0';const name=document.createElement('strong');name.textContent=item.name;const code=document.createElement('div');code.className='small text-muted';code.textContent=item.code;info.append(name,code);
  if(deliveryViewData.yourFinds){const size=document.createElement('div');size.className='small text-muted';size.textContent=item.status==='INCOMPLETE'?'Details not completed':item.size;info.append(size);}row.append(info);
  const qty=document.createElement('div');qty.className='text-end';qty.textContent=item.quantity+' pcs';
  if(deliveryViewData.yourFinds){const badge=document.createElement('div');const status=getDeliveryItemDisplayStatus(item);badge.innerHTML=status==='SOLD'?'<span class="badge bg-danger">Sold</span>':buildInventoryStatusBadge(status);qty.append(badge);}row.append(qty);list.append(row);
  if(deliveryViewData.yourFinds&&String(item.status||'').toUpperCase()==='INCOMPLETE'&&Number(item.stock)===1){const convert=document.createElement('button');convert.type='button';convert.className='btn btn-sm btn-outline-secondary';convert.title='Convert item';convert.setAttribute('aria-label','Convert '+item.code);convert.textContent='⇄';convert.onclick=()=>{currentDeliveryDetailsId=selectedDeliveryReportId;openYourFindsConversionModal(item,'STANDARD');};row.append(convert);}
 });
 if(list.children.length>5){
  list.style.maxHeight=Math.ceil(list.children[5].getBoundingClientRect().top-list.children[0].getBoundingClientRect().top)+'px';
  list.tabIndex=0;
  list.setAttribute('role','region');
  list.setAttribute('aria-label','Delivered items');
 }
}
function getDeliveryItemDisplayStatus(item) {
 const status=String(item.status||'ACTIVE').trim().toUpperCase();
 if(status==='INCOMPLETE'||status==='CONVERTED'||status==='RETURNED')return status;
 if(item.stock!==undefined&&item.stock!==null&&item.stock!==''&&Number.isFinite(Number(item.stock)))return Number(item.stock)<=0?'SOLD':'IN STOCK';
 return status;
}
function blankA4PdfBytes() {
  // PDF dimensions are points: 210 × 297 mm. The content stream is intentionally empty.
  const objects = ['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.2756 841.8898] /Resources << >> /Contents 4 0 R >>','<< /Length 0 >>\nstream\nendstream'];
  let pdf='%PDF-1.4\n';const offsets=[0];
  objects.forEach((object,index)=>{offsets.push(pdf.length);pdf+=(index+1)+' 0 obj\n'+object+'\nendobj\n';});
  const xref=pdf.length;
  pdf+='xref\n0 5\n0000000000 65535 f \n'+offsets.slice(1).map(offset=>String(offset).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  return pdf;
}
function generateBlankA4Report(type, reference) {
  const blob = new Blob([blankA4PdfBytes()],{type:'application/pdf'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=(type+' Report '+String(reference||'')).replace(/[^a-zA-Z0-9 _-]/g,'')+'.pdf';
  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function printDeliveryReport(deliveryId,button) {
  const id=String(deliveryId||'').trim();
  if(!id)return showNotificationToast('Delivery ID is required.',true);
  if(button&&button.disabled)return;
  const originalButtonHtml=button?button.innerHTML:'';
  if(button){button.disabled=true;button.setAttribute('aria-busy','true');button.innerHTML=loadingIndicator('Generating report…');}
  const finish=()=>{if(button){button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=originalButtonHtml;}};
  const fail=error=>{finish();showNotificationToast(error&&error.message||String(error),true);};
  secureScriptRun.withSuccessHandler(result=>{
    if(!result||!result.success)return fail(result&&result.message||'Delivery report failed.');
    try {
      const binary=atob(result.base64),bytes=new Uint8Array(binary.length);
      for(let index=0;index<binary.length;index++)bytes[index]=binary.charCodeAt(index);
      const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      const link=document.createElement('a');
      link.href=url;link.download=result.fileName;document.body.appendChild(link);link.click();link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      finish();
    } catch(error) {fail(error);}
  }).withFailureHandler(fail).createDeliveryReceiptPdf(id);
}
</script>
