<!-- PHASE 8: BULK REPRINT OF YOURFINDS LABELS -->
<div id="yourFindsReprintModal" class="generic-overlay-blur" style="display:none;">
  <div class="custom-popup-card p-0 d-flex flex-column" style="max-width:1050px;width:97%;height:92vh;max-height:760px;overflow:hidden;">
    <div class="d-flex justify-content-between align-items-center border-bottom px-4 py-3 flex-shrink-0">
      <h5 class="fw-bold mb-0">Reprint YourFinds Labels</h5>
      <button class="btn-close" onclick="closeYourFindsReprintModal()"></button>
    </div>

    <div class="border-bottom bg-light px-4 py-3 flex-shrink-0">
      <div class="row g-2 align-items-center">
        <div class="col-md-5">
          <input
            id="yourFindsReprintSearch"
            class="form-control"
            placeholder="Search code, description, or size..."
            oninput="renderYourFindsReprintItems()"
          >
        </div>
        <div class="col-md-3">
          <select id="yourFindsReprintType" class="form-select" onchange="changeYourFindsReprintType()">
            <option value="COMPLETED">Completed · 40 × 30 mm</option>
            <option value="INCOMPLETE">Incomplete · 30 × 20 mm</option>
          </select>
        </div>
        <div class="col-md-4 d-flex gap-2 justify-content-md-end">
          <button class="btn btn-sm btn-outline-secondary" onclick="selectVisibleYourFindsReprintItems()">Select Visible</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="clearYourFindsReprintSelection()">Clear</button>
        </div>
      </div>
    </div>

    <div class="table-responsive flex-grow-1" style="min-height:0;overflow:auto;">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light" style="position:sticky;top:0;z-index:2;">
          <tr>
            <th class="ps-4" style="width:52px;"></th>
            <th>Item</th>
            <th>Code</th>
            <th class="text-center">Size</th>
            <th class="text-end">Selling Price</th>
            <th class="text-center pe-4">Status</th>
          </tr>
        </thead>
        <tbody id="yourFindsReprintBody">
          <tr><td colspan="6" class="text-center text-muted py-5">Loading YourFinds items...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="border-top px-4 py-3 flex-shrink-0">
      <div id="yourFindsReprintResult" class="alert alert-success py-2 mb-3" style="display:none;">
        PDF ready. <a id="yourFindsReprintResultLink" href="#" target="_blank" rel="noopener" class="alert-link">Open generated labels</a>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <div><strong id="yourFindsReprintSelectedCount">0</strong> label(s) selected</div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" onclick="closeYourFindsReprintModal()">Cancel</button>
          <button id="yourFindsBulkPrintBtn" class="btn btn-pink" onclick="printSelectedYourFindsLabels()" disabled>
            Generate 40 × 30 Labels
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var yourFindsReprintItems = [];
var yourFindsReprintSelection = {};

function escapeYourFindsReprintHtml(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function openYourFindsReprintModal() {
  yourFindsReprintSelection = {};
  document.getElementById('yourFindsReprintSearch').value = '';
  document.getElementById('yourFindsReprintType').value = 'COMPLETED';
  document.getElementById('yourFindsReprintResult').style.display = 'none';
  document.getElementById('yourFindsReprintModal').style.display = 'flex';
  document.getElementById('yourFindsReprintBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">Loading YourFinds items...</td></tr>';
  updateYourFindsReprintSelection();

  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || !result.success) {
        showNotificationToast(result && result.message ? result.message : 'Unable to load YourFinds items.', true);
        yourFindsReprintItems = [];
      } else {
        yourFindsReprintItems = Array.isArray(result.items) ? result.items : [];
      }
      renderYourFindsReprintItems();
    })
    .withFailureHandler(function(error) {
      yourFindsReprintItems = [];
      renderYourFindsReprintItems();
      showNotificationToast(error && error.message ? error.message : String(error), true);
    })
    .getYourFindsItemsForLabelReprint();
}

function closeYourFindsReprintModal() {
  document.getElementById('yourFindsReprintModal').style.display = 'none';
}

function getVisibleYourFindsReprintItems() {
  const search = String(document.getElementById('yourFindsReprintSearch').value || '').trim().toLowerCase();
  const labelType = document.getElementById('yourFindsReprintType').value;
  return yourFindsReprintItems.filter(function(item) {
    if (item.labelType !== labelType) return false;
    if (!search) return true;
    return [item.code, item.description, item.size]
      .join(' ')
      .toLowerCase()
      .includes(search);
  });
}

function renderYourFindsReprintItems() {
  const items = getVisibleYourFindsReprintItems();
  const body = document.getElementById('yourFindsReprintBody');
  if (!items.length) {
    const type = document.getElementById('yourFindsReprintType').value.toLowerCase();
    body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">No ' + type + ' YourFinds labels found.</td></tr>';
    updateYourFindsReprintSelection();
    return;
  }

  body.innerHTML = items.map(function(item) {
    const code = String(item.code || '');
    const checked = yourFindsReprintSelection[code] ? ' checked' : '';
    const statusClass = item.labelType === 'INCOMPLETE'
      ? 'bg-warning text-dark'
      : (String(item.status).toUpperCase() === 'ACTIVE' ? 'bg-success' : 'bg-secondary');
    const image = item.imageUrl
      ? '<img src="' + escapeYourFindsReprintHtml(item.imageUrl) + '" alt="" style="width:46px;height:46px;object-fit:cover;border-radius:7px;">'
      : '<div class="bg-light border rounded" style="width:46px;height:46px;"></div>';
    return '<tr>' +
      '<td class="ps-4"><input class="form-check-input" type="checkbox" value="' + escapeYourFindsReprintHtml(code) + '" onchange="toggleYourFindsReprintItem(this)"' + checked + '></td>' +
      '<td><div class="d-flex align-items-center gap-2">' + image + '<div class="fw-semibold">' + escapeYourFindsReprintHtml(item.description || '—') + '</div></div></td>' +
      '<td class="font-monospace small">' + escapeYourFindsReprintHtml(code) + '</td>' +
      '<td class="text-center fw-semibold">' + escapeYourFindsReprintHtml(item.size) + '</td>' +
      '<td class="text-end fw-semibold">' + (item.labelType === 'COMPLETED' ? '₱' + (Number(item.sellingPrice) || 0).toFixed(2) : '—') + '</td>' +
      '<td class="text-center pe-4"><span class="badge ' + statusClass + '">' + escapeYourFindsReprintHtml(item.status) + '</span></td>' +
      '</tr>';
  }).join('');
  updateYourFindsReprintSelection();
}

function changeYourFindsReprintType() {
  yourFindsReprintSelection = {};
  document.getElementById('yourFindsReprintResult').style.display = 'none';
  renderYourFindsReprintItems();
}

function toggleYourFindsReprintItem(checkbox) {
  const code = String(checkbox.value || '').trim();
  if (!code) return;
  if (checkbox.checked) yourFindsReprintSelection[code] = true;
  else delete yourFindsReprintSelection[code];
  updateYourFindsReprintSelection();
}

function selectVisibleYourFindsReprintItems() {
  getVisibleYourFindsReprintItems().forEach(function(item) {
    yourFindsReprintSelection[String(item.code)] = true;
  });
  renderYourFindsReprintItems();
}

function clearYourFindsReprintSelection() {
  yourFindsReprintSelection = {};
  renderYourFindsReprintItems();
}

function updateYourFindsReprintSelection() {
  const count = Object.keys(yourFindsReprintSelection).length;
  const labelType = document.getElementById('yourFindsReprintType').value;
  document.getElementById('yourFindsReprintSelectedCount').textContent = String(count);
  const button = document.getElementById('yourFindsBulkPrintBtn');
  button.disabled = count === 0;
  button.textContent = labelType === 'INCOMPLETE' ? 'Generate 30 × 20 Labels' : 'Generate 40 × 30 Labels';
}

function printSelectedYourFindsLabels() {
  const codes = Object.keys(yourFindsReprintSelection);
  const labelType = document.getElementById('yourFindsReprintType').value;
  if (!codes.length) return showNotificationToast('Select at least one label.', true);

  const button = document.getElementById('yourFindsBulkPrintBtn');
  const resultBox = document.getElementById('yourFindsReprintResult');
  resultBox.style.display = 'none';
  button.disabled = true;
  button.textContent = 'Generating...';
  google.script.run
    .withSuccessHandler(function(result) {
      updateYourFindsReprintSelection();
      if (!result || !result.success) {
        showNotificationToast(result && result.message ? result.message : 'Unable to generate labels.', true);
        return;
      }
      const labelUrl = result.downloadUrl || result.fileUrl;
      document.getElementById('yourFindsReprintResultLink').href = labelUrl;
      resultBox.style.display = 'block';
      showNotificationToast(result.labelCount + ' completed label(s) generated.');
      const opened = window.open(labelUrl, '_blank');
      if (!opened) showNotificationToast('PDF is ready. Click Open generated labels in the Reprint window.');
    })
    .withFailureHandler(function(error) {
      updateYourFindsReprintSelection();
      showNotificationToast(error && error.message ? error.message : String(error), true);
    })
    .createYourFindsReprintPDFByCodes(codes, labelType);
}
</script>
