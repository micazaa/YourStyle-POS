<!-- Bulk YourFinds labels: one PDF per physical label size. -->
<div id="yourFindsReprintModal" class="generic-overlay-blur" style="display:none;">
 <div class="custom-popup-card p-0 d-flex flex-column" style="max-width:1100px;width:97%;height:90vh;max-height:850px;overflow:hidden;">
  <div class="d-flex justify-content-between align-items-center border-bottom px-4 py-3 flex-shrink-0">
   <h5 class="fw-bold mb-0">Reprint YourFinds Labels</h5>
   <button type="button" class="btn-close" aria-label="Close labels" onclick="closeYourFindsReprintModal()"></button>
  </div>
  <fieldset id="yourFindsReprintControls" class="border-0 p-0 m-0" style="min-height:0;display:flex;flex:1;flex-direction:column;overflow:hidden;">
   <div class="px-4 py-3 border-bottom flex-shrink-0">
    <div class="row g-2">
     <div class="col-md-6"><input id="yourFindsReprintSearch" type="search" class="form-control" aria-label="Search labels" placeholder="Search code, item, size, or delivery..." oninput="renderYourFindsReprintItems()"></div>
     <div class="col-md-3"><select id="yourFindsReprintType" class="form-select" aria-label="Label type" onchange="changeYourFindsReprintType()"><option value="ALL">All Labels</option><option value="COMPLETED">Ready · 40 × 30 mm</option><option value="INCOMPLETE">Drafted · 30 × 20 mm</option></select></div>
     <div class="col-md-3"><select id="yourFindsReprintDeliveryFilter" class="form-select" aria-label="Delivery" onchange="renderYourFindsReprintItems()"><option value="">All Deliveries</option></select></div>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-3 gap-2"><span id="yourFindsReprintVisibleCount" class="small text-muted">0 labels</span><button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearYourFindsReprintSelection()">Clear Selection</button></div>
   </div>
   <div class="table-responsive flex-grow-1" style="min-height:0;overflow:auto;">
    <table class="table table-striped table-hover align-middle mb-0">
     <thead class="table-light" style="position:sticky;top:0;z-index:2;"><tr>
      <th class="ps-4"><input id="yourFindsReprintSelectAll" type="checkbox" class="form-check-input" aria-label="Select all visible labels" onchange="selectVisibleYourFindsReprintItems(this.checked)"></th>
      <th data-reprint-sort="description"><button class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" onclick="sortYourFindsReprint('description')">Item <span aria-hidden="true">↕</span></button></th>
      <th data-reprint-sort="code"><button class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" onclick="sortYourFindsReprint('code')">Code <span aria-hidden="true">↕</span></button></th>
      <th data-reprint-sort="size"><button class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" onclick="sortYourFindsReprint('size')">Size <span aria-hidden="true">↕</span></button></th>
      <th data-reprint-sort="deliveryId"><button class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" onclick="sortYourFindsReprint('deliveryId')">Delivery <span aria-hidden="true">↕</span></button></th>
      <th data-reprint-sort="labelType"><button class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" onclick="sortYourFindsReprint('labelType')">Label <span aria-hidden="true">↕</span></button></th>
      <th class="text-end pe-4" data-reprint-sort="sellingPrice"><button class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" onclick="sortYourFindsReprint('sellingPrice')">Price <span aria-hidden="true">↕</span></button></th>
     </tr></thead><tbody id="yourFindsReprintBody"></tbody>
    </table>
   </div>
  </fieldset>
  <div class="border-top px-4 py-3 flex-shrink-0" style="max-height:35vh;overflow:auto;">
   <div id="yourFindsReprintResult" class="alert alert-success py-2 mb-3" style="display:none;"></div>
   <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span id="yourFindsReprintSelectedCount" class="small">0 selected</span>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary" onclick="closeYourFindsReprintModal()">Close</button><button id="yourFindsBulkPrintBtn" class="btn btn-pink" onclick="printSelectedYourFindsReprintLabels()" disabled>Generate Labels</button></div>
   </div>
  </div>
 </div>
</div>
<script>
var yourFindsReprintItems = [];
var yourFindsReprintSelection = {};
var yourFindsReprintBusy = false;
var yourFindsReprintRequest = 0;
var yourFindsReprintSort = {key:'deliveryId',direction:-1};
function escapeYourFindsReprintHtml(value) { return escapeInventoryHtml(value); }
function openYourFindsReprintModal() {
 document.getElementById('yourFindsReprintModal').style.display='flex';
 if(yourFindsReprintBusy)return;
 const request=++yourFindsReprintRequest;
 yourFindsReprintItems=[];yourFindsReprintSelection={};
 document.getElementById('yourFindsReprintSearch').value='';
 document.getElementById('yourFindsReprintType').value='ALL';
 document.getElementById('yourFindsReprintDeliveryFilter').innerHTML='<option value="">All Deliveries</option>';
 document.getElementById('yourFindsReprintResult').style.display='none';
 setYourFindsReprintBusy(true,'Loading...');
 document.getElementById('yourFindsReprintBody').innerHTML='<tr><td colspan="7" class="text-center text-muted py-5">Loading labels...</td></tr>';
 google.script.run.withSuccessHandler(function(result){
   if(request!==yourFindsReprintRequest)return;
   yourFindsReprintItems=result&&result.success&&Array.isArray(result.items)?result.items:[];
   setYourFindsReprintBusy(false);populateYourFindsReprintFilters();renderYourFindsReprintItems();
   if(!result||!result.success)showNotificationToast(result&&result.message||'Unable to load labels.',true);
 }).withFailureHandler(function(error){
   if(request!==yourFindsReprintRequest)return;
   setYourFindsReprintBusy(false);renderYourFindsReprintItems();showNotificationToast(error.message||String(error),true);
 }).getYourFindsItemsForLabelReprint();
}
function closeYourFindsReprintModal(){
 if(yourFindsReprintBusy){showNotificationToast('Please wait for the label request to finish.');return;}
 ++yourFindsReprintRequest;document.getElementById('yourFindsReprintModal').style.display='none';
}
function setYourFindsReprintBusy(busy,label){
 yourFindsReprintBusy=busy;document.getElementById('yourFindsReprintControls').disabled=busy;
 updateYourFindsReprintSelection();
 if(busy)document.getElementById('yourFindsBulkPrintBtn').textContent=label||'Generating...';
}
function getVisibleYourFindsReprintItems(){
 const search=document.getElementById('yourFindsReprintSearch').value.trim().toLowerCase();
 const type=document.getElementById('yourFindsReprintType').value;
 const delivery=document.getElementById('yourFindsReprintDeliveryFilter').value;
 return yourFindsReprintItems.filter(function(item){return (type==='ALL'||item.labelType===type)&&(!delivery||String(item.deliveryId||'').trim()===delivery)&&[item.code,item.description,item.size,item.deliveryId].join(' ').toLowerCase().includes(search);});
}
function populateYourFindsReprintFilters(){
 const deliveries=Array.from(new Set(yourFindsReprintItems.map(item=>String(item.deliveryId||'').trim()).filter(Boolean))).sort().reverse();
 document.getElementById('yourFindsReprintDeliveryFilter').innerHTML='<option value="">All Deliveries</option>'+deliveries.map(value=>'<option value="'+escapeYourFindsReprintHtml(value)+'">'+escapeYourFindsReprintHtml(value)+'</option>').join('');
}
function sortYourFindsReprint(key){
 yourFindsReprintSort.direction=yourFindsReprintSort.key===key?-yourFindsReprintSort.direction:1;yourFindsReprintSort.key=key;renderYourFindsReprintItems();
}
function renderYourFindsReprintItems(){
 const items=getVisibleYourFindsReprintItems().sort(function(a,b){
   const key=yourFindsReprintSort.key;
   const diff=key==='sellingPrice'?(Number(a[key])||0)-(Number(b[key])||0):String(a[key]||'').localeCompare(String(b[key]||''),undefined,{numeric:true,sensitivity:'base'});
   return diff*yourFindsReprintSort.direction||String(a.code).localeCompare(String(b.code),undefined,{numeric:true});
 });
 document.querySelectorAll('[data-reprint-sort]').forEach(function(th){const selected=th.dataset.reprintSort===yourFindsReprintSort.key;th.setAttribute('aria-sort',selected?(yourFindsReprintSort.direction===1?'ascending':'descending'):'none');th.querySelector('span').textContent=selected?(yourFindsReprintSort.direction===1?'↑':'↓'):'↕';});
 const e=escapeYourFindsReprintHtml;
 const body=document.getElementById('yourFindsReprintBody');
 body.innerHTML=items.length?items.map(function(item){
   const selling=item.labelType==='COMPLETED';
   return `<tr><td class="ps-4"><input type="checkbox" class="form-check-input" aria-label="Select ${e(item.code)}" value="${e(item.code)}" ${yourFindsReprintSelection[item.code]?'checked':''}></td><td><div class="d-flex align-items-center gap-2">${item.imageUrl?`<img loading="lazy" src="${e(item.imageUrl)}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:8px;">`:''}<span class="fw-semibold">${e(item.description||'Selling details not added')}</span></div></td><td class="font-monospace small">${e(item.code)}</td><td>${e(item.size)}</td><td class="small">${e(item.deliveryId||'—')}</td><td><span class="badge ${selling?'bg-success':'bg-warning text-dark'}">${selling?'Selling':'Initial'}</span><div class="small text-muted text-nowrap">${selling?'40 × 30':'30 × 20'} mm</div></td><td class="text-end pe-4">${selling?'₱'+(Number(item.sellingPrice)||0).toFixed(2):'—'}</td></tr>`;
 }).join(''):'<tr><td colspan="7" class="text-center text-muted py-5">No matching labels.</td></tr>';
 body.onchange=function(event){if(event.target.type==='checkbox')toggleYourFindsReprintItem(event.target);};
 updateYourFindsReprintSelection();
}
function changeYourFindsReprintType(){renderYourFindsReprintItems();}
function toggleYourFindsReprintItem(input){if(yourFindsReprintBusy)return;const code=String(input.value);if(input.checked)yourFindsReprintSelection[code]=true;else delete yourFindsReprintSelection[code];updateYourFindsReprintSelection();}
function selectVisibleYourFindsReprintItems(checked=true){
 if(yourFindsReprintBusy)return;
 getVisibleYourFindsReprintItems().forEach(function(item){if(checked)yourFindsReprintSelection[item.code]=true;else delete yourFindsReprintSelection[item.code];});renderYourFindsReprintItems();
}
function clearYourFindsReprintSelection(){if(yourFindsReprintBusy)return;yourFindsReprintSelection={};renderYourFindsReprintItems();}
function updateYourFindsReprintSelection(){
 const visible=getVisibleYourFindsReprintItems();
 const selected=yourFindsReprintItems.filter(item=>yourFindsReprintSelection[item.code]);
 const visibleSelected=visible.filter(item=>yourFindsReprintSelection[item.code]).length;
 const hidden=selected.length-visibleSelected;
 document.getElementById('yourFindsReprintVisibleCount').textContent=visible.length+' labels shown';
 document.getElementById('yourFindsReprintSelectedCount').textContent=selected.length+' selected'+(hidden?' · '+hidden+' hidden by filters':'');
 const all=document.getElementById('yourFindsReprintSelectAll');all.checked=visible.length>0&&visibleSelected===visible.length;all.indeterminate=visibleSelected>0&&visibleSelected<visible.length;all.disabled=yourFindsReprintBusy||!visible.length;
 const button=document.getElementById('yourFindsBulkPrintBtn');button.disabled=yourFindsReprintBusy||!selected.length;button.textContent=yourFindsReprintBusy?'Generating...':'Generate '+selected.length+' Label'+(selected.length===1?'':'s');
}
function printSelectedYourFindsReprintLabels(){
 if(yourFindsReprintBusy)return;
 const groups={COMPLETED:[],INCOMPLETE:[]};
 yourFindsReprintItems.forEach(function(item){if(yourFindsReprintSelection[item.code]&&groups[item.labelType])groups[item.labelType].push(String(item.code));});
 if(!groups.COMPLETED.length&&!groups.INCOMPLETE.length)return showNotificationToast('Select at least one label.',true);
 const box=document.getElementById('yourFindsReprintResult');box.style.display='none';setYourFindsReprintBusy(true);
 google.script.run.withSuccessHandler(function(result){
   setYourFindsReprintBusy(false);
   if(!result||!result.success)return showNotificationToast(result&&result.message||'Unable to generate labels.',true);
   box.innerHTML='';
   (result.files||[]).forEach(function(file){
     const link=document.createElement('a');link.href=file.downloadUrl||file.fileUrl;link.target='_blank';link.rel='noopener';link.className='d-block alert-link py-1';
     link.textContent='Click here to print — '+(file.labelType==='INCOMPLETE'?'Initial labels · 30 × 20 mm':'Selling labels · 40 × 30 mm')+' ('+file.labelCount+')';box.appendChild(link);
   });
   box.style.display='block';showNotificationToast(result.labelCount+' labels ready. Open the PDFs below.');
 }).withFailureHandler(function(error){setYourFindsReprintBusy(false);showNotificationToast(error.message||String(error),true);}).createYourFindsReprintPDFByGroups(groups.COMPLETED,groups.INCOMPLETE);
}
</script>
