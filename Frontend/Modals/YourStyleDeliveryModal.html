<!-- =========================================================
     ACCEPT YOURSTYLE DELIVERY — PHASE 7.9G
     DIRECT + BULK HOLDER RECEIVING
========================================================== -->

<div id="yourStyleDeliveryModal" class="generic-overlay-blur" style="display:none;">
  <div class="custom-popup-card delivery-modal-card">

    <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom">
      <div>
        <h5 class="fw-bold mb-1">Accept YourStyle Delivery</h5>
        <div class="small text-muted">Receive exact products directly or create pending bulk holders.</div>
      </div>
      <button type="button" class="btn-close" onclick="closeYourStyleDeliveryModal()"></button>
    </div>

    <div class="fw-semibold mb-3">Delivery Information</div>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label">Date Delivered <span class="text-danger">*</span></label>
        <input type="date" id="yourStyleDeliveryDate" class="form-control" onchange="loadNextYourStyleDeliveryNumber()">
      </div>
      <div class="col-md-6">
        <label class="form-label">Delivery ID</label>
        <input type="text" id="yourStyleDeliveryNo" class="form-control" value="—" readonly>
      </div>
      <div class="col-md-6">
        <label class="form-label">Driver Name <span class="text-danger">*</span></label>
        <input type="text" id="yourStyleDriverName" class="form-control" placeholder="Enter driver name" autocomplete="off">
      </div>
      <div class="col-md-6">
        <label class="form-label">Plate No. <span class="text-danger">*</span></label>
        <input type="text" id="yourStylePlateNo" class="form-control" placeholder="Enter plate number" autocomplete="off">
      </div>
    </div>

    <div class="delivery-items-toolbar mb-3">
      <div class="fw-semibold">Items Received</div>
      <div class="delivery-mode-toggle btn-group" role="group" aria-label="Delivery mode">
        <button type="button" id="yourStyleDirectModeBtn" class="btn btn-sm btn-outline-pink active" aria-pressed="true" onclick="setYourStyleDeliveryMode('DIRECT')">Direct</button>
        <button type="button" id="yourStyleBundleModeBtn" class="btn btn-sm btn-outline-pink" aria-pressed="false" onclick="setYourStyleDeliveryMode('BULK')">Bundle</button>
      </div>
      <button type="button" class="btn btn-sm btn-outline-dark delivery-add-item" onclick="addYourStyleDeliveryLine()">+ Add Item</button>
    </div>

    <div id="yourStyleProductsLoading" class="border rounded text-center text-muted py-4 mb-3" style="display:none;"><span class="app-loading" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Loading Product Master...</span></div>
    <div id="yourStyleProductsError" class="alert alert-danger" style="display:none;"></div>
    <div class="delivery-line-scroll mb-3"><div id="yourStyleDeliveryHead"></div><div id="yourStyleDeliveryLines"></div></div>
    <div id="yourStyleDeliverySummary" class="delivery-summary mb-4" aria-live="polite"></div>

    <div class="mb-3">
      <label class="form-label">Accepted By</label>
      <input type="text" id="yourStyleAcceptedBy" class="form-control" readonly>
    </div>

    <div class="mb-4">
      <label class="form-label">Remarks</label>
      <textarea id="yourStyleRemarks" class="form-control" rows="3" placeholder="Optional notes about this delivery"></textarea>
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary flex-fill" onclick="closeYourStyleDeliveryModal()">Cancel</button>
      <button type="button" id="acceptYourStyleDeliveryBtn" class="btn btn-pink flex-fill fw-bold" onclick="submitYourStyleDelivery()">Accept Delivery</button>
    </div>
  </div>
</div>

<script>
var yourStyleDeliveryProducts = [];
var yourStyleDeliveryLineCounter = 0;
var yourStyleDeliveryMode = "DIRECT";

function openYourStyleDeliveryModal() {
  const modal = document.getElementById("yourStyleDeliveryModal");
  if (!modal) return console.error("yourStyleDeliveryModal not found.");
  resetYourStyleDeliveryModal();
  modal.style.display = "flex";
  loadYourStyleDeliveryProducts();
  loadNextYourStyleDeliveryNumber();
}

function closeYourStyleDeliveryModal() {
  const modal = document.getElementById("yourStyleDeliveryModal");
  if (modal) modal.style.display = "none";
}

function resetYourStyleDeliveryModal() {
  yourStyleDeliveryProducts = [];
  yourStyleDeliveryLineCounter = 0;
  yourStyleDeliveryMode = "DIRECT";
  const now = new Date();
  const localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  document.getElementById("yourStyleDeliveryDate").value = localDate.toISOString().split("T")[0];
  document.getElementById("yourStyleDeliveryNo").value = "—";
  document.getElementById("yourStyleDriverName").value = "";
  document.getElementById("yourStylePlateNo").value = "";
  document.getElementById("yourStyleRemarks").value = "";
  document.getElementById("yourStyleAcceptedBy").value = currentEmployee && currentEmployee.name ? currentEmployee.name : currentCashier || "";
  document.getElementById("yourStyleDeliveryLines").innerHTML = "";
  document.getElementById("yourStyleProductsError").style.display = "none";
  renderYourStyleDeliveryMode();
  updateYourStyleDeliverySummary();
}

function loadYourStyleDeliveryProducts() {
  const loading = document.getElementById("yourStyleProductsLoading");
  const error = document.getElementById("yourStyleProductsError");
  const refresh=beginPageRead('deliveryProducts');
  loading.style.display = refresh.cached===undefined?'block':'none';
  if(refresh.cached!==undefined){yourStyleDeliveryProducts=refresh.cached;if(yourStyleDeliveryProducts.length)addYourStyleDeliveryLine();}
  error.style.display = "none";
  google.script.run.withSuccessHandler(function(result) {
    if(!refresh.current())return;
    loading.style.display = "none";
    if (!result || !result.success) {
      error.style.display = "block";
      error.textContent = result && result.message ? result.message : "Unable to load Product Master.";
      return;
    }
    yourStyleDeliveryProducts = Array.isArray(result.products) ? result.products : [];
    refresh.save(yourStyleDeliveryProducts);
    if (!yourStyleDeliveryProducts.length) {
      error.style.display = "block";
      error.textContent = "No active YourStyle STOCK products found.";
      return;
    }
    if(!document.getElementById('yourStyleDeliveryLines').children.length)addYourStyleDeliveryLine();
  }).withFailureHandler(function(err) {
    if(!refresh.current())return;
    loading.style.display = "none";
    error.style.display = "block";
    error.textContent = err && err.message ? err.message : "Unable to load Product Master.";
  }).getYourStyleDeliveryProducts();
}

function loadNextYourStyleDeliveryNumber() {
  const date = document.getElementById("yourStyleDeliveryDate").value;
  const field = document.getElementById("yourStyleDeliveryNo");
  if (!date) { field.value = "—"; return; }
  field.value = "";
  setControlLoading(field, true, "Loading delivery number…");
  google.script.run.withSuccessHandler(function(result) {
    setControlLoading(field, false);
    field.value = result && result.deliveryId ? result.deliveryId : "—";
  }).withFailureHandler(function() { setControlLoading(field, false); field.value = "—"; }).generateDeliveryIdentifiers("YOURSTYLE", date);
}

function addYourStyleDeliveryLine() {
  if (yourStyleDeliveryMode === "DIRECT" && !yourStyleDeliveryProducts.length) return showNotificationToast("Product Master is still loading.", true);
  yourStyleDeliveryLineCounter++;
  const lineId = yourStyleDeliveryLineCounter;
  const line = document.createElement("div");
  line.className = "yourstyle-delivery-line delivery-line " + (yourStyleDeliveryMode === "DIRECT" ? "direct" : "bundle");
  const referenceField = yourStyleDeliveryMode === "DIRECT"
    ? '<select class="form-select form-select-sm yourstyle-line-product" aria-label="Product"></select>'
    : '<input type="text" class="form-control form-control-sm yourstyle-line-bulk-description" maxlength="100" placeholder="Enter bundle code" aria-label="Bundle code">';
  const quantityFields = yourStyleDeliveryMode === "DIRECT"
    ? '<input type="number" class="form-control form-control-sm yourstyle-line-qty" min="1" max="99999" step="1" value="1" aria-label="Actual quantity" oninput="updateYourStyleDeliverySummary()">'
    : '<input type="number" class="form-control form-control-sm yourstyle-line-estimated-per-bundle" min="1" step="1" value="80" aria-label="Estimated units per bundle" oninput="updateYourStyleDeliverySummary()"><input type="number" class="form-control form-control-sm yourstyle-line-bundle-qty" min="1" step="1" value="1" aria-label="Bundle quantity" oninput="updateYourStyleDeliverySummary()"><div class="delivery-line-total yourstyle-line-total"></div>';
  line.innerHTML = '<div class="delivery-line-number yourstyle-line-title">' + lineId + '</div>' +
    '<select class="form-select form-select-sm yourstyle-line-type" aria-label="Type" onchange="handleYourStyleLineTypeChange(this)"><option value="PINS">PINS</option><option value="OTHERS">OTHERS</option></select>' +
    referenceField + quantityFields +
    '<button type="button" class="btn btn-sm btn-outline-danger" title="Remove item" aria-label="Remove item" onclick="removeYourStyleDeliveryLine(this)">×</button>';
  document.getElementById("yourStyleDeliveryLines").appendChild(line);
  if (yourStyleDeliveryMode === "DIRECT") populateYourStyleLineProducts(line, "PINS");
  renumberYourStyleDeliveryLines();
  updateYourStyleDeliverySummary();
}

function setYourStyleDeliveryMode(mode) {
  mode = String(mode || "").toUpperCase() === "BULK" ? "BULK" : "DIRECT";
  if (yourStyleDeliveryMode === mode) return;
  yourStyleDeliveryMode = mode;
  yourStyleDeliveryLineCounter = 0;
  document.getElementById("yourStyleDeliveryLines").innerHTML = "";
  renderYourStyleDeliveryMode();
  addYourStyleDeliveryLine();
}

function renderYourStyleDeliveryMode() {
  const direct = yourStyleDeliveryMode === "DIRECT";
  const directButton = document.getElementById("yourStyleDirectModeBtn");
  const bundleButton = document.getElementById("yourStyleBundleModeBtn");
  directButton.classList.toggle("active", direct);
  bundleButton.classList.toggle("active", !direct);
  directButton.setAttribute("aria-pressed", String(direct));
  bundleButton.setAttribute("aria-pressed", String(!direct));
  document.getElementById("yourStyleDeliveryHead").innerHTML = direct
    ? '<div class="delivery-line-head direct"><span>#</span><span>Type</span><span>Product</span><span>Actual Qty</span><span></span></div>'
    : '<div class="delivery-line-head bundle"><span>#</span><span>Type</span><span>Bundle Code</span><span>Est. / Bundle</span><span>Bundles</span><span>Est. Actual Units</span><span></span></div>';
}

function removeYourStyleDeliveryLine(button) {
  const line = button.closest(".yourstyle-delivery-line");
  if (line) line.remove();
  renumberYourStyleDeliveryLines();
  updateYourStyleDeliverySummary();
}

function renumberYourStyleDeliveryLines() {
  document.querySelectorAll("#yourStyleDeliveryLines .yourstyle-delivery-line").forEach(function(row, index) {
    const title = row.querySelector(".yourstyle-line-title");
    if (title) title.textContent = String(index + 1);
  });
}

function handleYourStyleLineTypeChange(field) {
  const line = field.closest(".yourstyle-delivery-line");
  if (!line) return;
  const type = line.querySelector(".yourstyle-line-type").value;
  if (yourStyleDeliveryMode === "DIRECT") populateYourStyleLineProducts(line, type);
  updateYourStyleDeliverySummary();
}

function populateYourStyleLineProducts(line, type) {
  type = String(type || "").trim().toUpperCase();
  const select = line.querySelector(".yourstyle-line-product");
  if (!select) return;
  select.innerHTML = '<option value="">Select product</option>';
  yourStyleDeliveryProducts.filter(function(product) { return String(product.category || "").trim().toUpperCase() === type; }).forEach(function(product) {
    const option = document.createElement("option");
    option.value = product.productCode;
    option.textContent = product.productCode + " — " + product.description + " — ₱" + formatYourStylePrice(product.defaultPrice);
    select.appendChild(option);
  });
}

function formatYourStylePrice(value) {
  return (Number(value) || 0).toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function getYourStyleDeliveryLinesFromForm() {
  return Array.from(document.querySelectorAll("#yourStyleDeliveryLines .yourstyle-delivery-line")).map(function(row) {
    const type = String(row.querySelector(".yourstyle-line-type").value || "").trim().toUpperCase();
    const receiveMode = yourStyleDeliveryMode;
    if (receiveMode === "DIRECT") {
      return { type: type, receiveMode: receiveMode, productCode: String(row.querySelector(".yourstyle-line-product").value || "").trim(), quantity: Number(row.querySelector(".yourstyle-line-qty").value) || 0 };
    }
    const bundleQty = Number(row.querySelector(".yourstyle-line-bundle-qty").value) || 0;
    const estimatedPerBundle = Number(row.querySelector(".yourstyle-line-estimated-per-bundle").value) || 0;
    return { type: type, receiveMode: receiveMode, description: String(row.querySelector(".yourstyle-line-bulk-description").value || "").trim(), bundleQty: bundleQty, estimatedPerBundle: estimatedPerBundle, estimatedQuantity: bundleQty * estimatedPerBundle };
  });
}

function updateYourStyleDeliverySummary() {
  const lines = getYourStyleDeliveryLinesFromForm();
  const summary = document.getElementById("yourStyleDeliverySummary");
  if (yourStyleDeliveryMode === "DIRECT") {
    const actual = lines.reduce(function(total, line) { return total + (Number(line.quantity) || 0); }, 0);
    summary.innerHTML = '<span>Actual Units <strong>' + actual + '</strong></span>';
    return;
  }
  const bundles = lines.reduce(function(total, line) { return total + (Number(line.bundleQty) || 0); }, 0);
  const estimated = lines.reduce(function(total, line) { return total + (Number(line.estimatedQuantity) || 0); }, 0);
  summary.innerHTML = '<span>Bundles <strong>' + bundles + '</strong></span><span>Est. Actual Units <strong>' + estimated + '</strong></span>';
  document.querySelectorAll("#yourStyleDeliveryLines .yourstyle-delivery-line").forEach(function(row) {
    const bundleQty = Number(row.querySelector(".yourstyle-line-bundle-qty").value) || 0;
    const estimatedPerBundle = Number(row.querySelector(".yourstyle-line-estimated-per-bundle").value) || 0;
    row.querySelector(".yourstyle-line-total").innerHTML = '<strong>' + (bundleQty * estimatedPerBundle) + ' units</strong>' + bundleQty + ' × ' + estimatedPerBundle;
  });
}

function submitYourStyleDelivery() {
  const deliveryDate = document.getElementById("yourStyleDeliveryDate").value;
  const driverName = document.getElementById("yourStyleDriverName").value.trim();
  const plateNo = document.getElementById("yourStylePlateNo").value.trim().toUpperCase();
  const acceptedBy = document.getElementById("yourStyleAcceptedBy").value.trim();
  const remarks = document.getElementById("yourStyleRemarks").value.trim();
  const lines = getYourStyleDeliveryLinesFromForm();
  if (!deliveryDate) return showNotificationToast("Please select the delivery date.", true);
  if (!driverName) return showNotificationToast("Please enter the driver name.", true);
  if (!plateNo) return showNotificationToast("Please enter the plate number.", true);
  if (!acceptedBy) return showNotificationToast("Unable to identify the employee.", true);
  if (!lines.length) return showNotificationToast("Add at least one delivery item.", true);

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.receiveMode === "DIRECT" && (!line.productCode || !Number.isInteger(line.quantity) || line.quantity < 1)) return showNotificationToast("Complete the DIRECT fields for Item " + (i + 1) + ".", true);
    if (line.receiveMode === "BULK" && (!line.description || !Number.isInteger(line.estimatedPerBundle) || line.estimatedPerBundle < 1 || !Number.isInteger(line.bundleQty) || line.bundleQty < 1 || !Number.isInteger(line.estimatedQuantity) || line.estimatedQuantity < 1)) return showNotificationToast("Complete the BUNDLE fields for Item " + (i + 1) + ".", true);
  }

  const button = document.getElementById("acceptYourStyleDeliveryBtn");
  button.disabled = true;
  button.innerHTML = loadingIndicator("Accepting Delivery...");
  google.script.run.withSuccessHandler(function(result) {
    button.disabled = false;
    button.textContent = "Accept Delivery";
    if (!result || !result.success) return showNotificationToast(result && result.message ? result.message : "Unable to accept YourStyle delivery.", true);
    closeYourStyleDeliveryModal();
    showNotificationToast(result.deliveryId + " accepted — " + result.directUnits + " direct unit(s), " + result.bulkBundles + " bundle(s).");
  }).withFailureHandler(function(err) {
    button.disabled = false;
    button.textContent = "Accept Delivery";
    showNotificationToast("YourStyle Delivery Error: " + (err && err.message ? err.message : String(err)), true);
  }).acceptYourStyleDelivery({ deliveryDate: deliveryDate, driverName: driverName, plateNo: plateNo, acceptedBy: acceptedBy, remarks: remarks, lines: lines });
}
</script>
