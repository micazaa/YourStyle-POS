<div id="customerExchangeModal" class="generic-overlay-blur" style="display:none;">
  <div class="custom-popup-card exchange-card">
    <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
      <div><h5 class="fw-bold mb-1">Customer Exchange</h5><div class="small text-muted">Same or higher replacement value only.</div></div>
      <button type="button" class="btn-close" aria-label="Close exchange" onclick="closeCustomerExchangeModal()"></button>
    </div>
    <div id="exchangeReceiptSearch" class="exchange-receipt-search mb-3">
      <label class="form-label" for="exchangeReceiptId">Original Receipt</label>
      <div class="input-group"><input id="exchangeReceiptId" class="form-control" placeholder="Enter original receipt ID" autocomplete="off" onkeydown="if(event.key==='Enter')searchExchangeReceipt()"><button id="exchangeReceiptSearchBtn" type="button" class="btn btn-dark" onclick="searchExchangeReceipt()">Search</button></div>
    </div>
    <div id="exchangeBuilder" style="display:none;">
      <div class="d-flex justify-content-between align-items-start gap-3 mb-3"><div><strong id="exchangeOriginalReceipt"></strong><div id="exchangeReceiptInfo" class="small text-muted mt-1"></div></div><button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearExchangeItems()">Clear All</button></div>
      <div class="d-flex align-items-end gap-2 mb-4"><div class="flex-grow-1"><label class="form-label" for="exchangeReturnItem">Original Purchased Item</label><select id="exchangeReturnItem" class="form-select"></select></div><button id="exchangeAddItemBtn" type="button" class="btn btn-outline-secondary" onclick="addExchangeItem()">+ Add Item</button></div>
      <div class="exchange-comparison">
        <section class="exchange-items"><h6 class="fw-bold mb-2">From</h6><table class="table align-middle exchange-item-table"><thead><tr><th>Image</th><th>Product</th><th class="text-center">Size</th><th class="text-center">Qty</th><th class="text-end">Price</th><th aria-label="Actions"></th></tr></thead><tbody id="exchangeReturnRows"></tbody></table></section>
        <div class="exchange-direction" aria-hidden="true">→</div>
        <section class="exchange-items"><h6 class="fw-bold mb-2">Exchange</h6><table class="table align-middle exchange-item-table"><thead><tr><th>Image</th><th>Product</th><th class="text-center">Size</th><th class="text-center">Qty</th><th class="text-end">Price</th></tr></thead><tbody id="exchangeReplacementRows"></tbody></table></section>
      </div>
      <div class="exchange-totals mt-4" aria-live="polite"><div><span>Return Value</span><strong id="exchangeReturnValue">₱0.00</strong></div><div><span>Replacement Value</span><strong id="exchangeReplacementValue">₱0.00</strong></div><div class="text-end"><span>Amount Due</span><strong id="exchangeAmountDue">₱0.00</strong></div></div>
      <div id="exchangeValidation" class="small text-danger mt-2" role="status"></div>
      <div class="exchange-footer mt-3"><div class="flex-grow-1"><label class="form-label" for="exchangeNotes">Reason / Notes</label><input id="exchangeNotes" class="form-control" placeholder="Optional exchange note"></div><button id="exchangeConfirmBtn" type="button" class="btn btn-pink" onclick="confirmCustomerExchange()">Proceed to Checkout</button></div>
    </div>
  </div>
</div>
<style>
 #customerExchangeModal{z-index:10010;padding:18px;}
 .exchange-card{max-width:1120px;width:97%;max-height:92vh;overflow:auto;}
 .exchange-comparison{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:14px;}
 .exchange-direction{display:flex;align-items:center;justify-content:center;color:#777;font-size:1.6rem;}
 .exchange-item-table{width:100%;font-size:.82rem;}
 .exchange-item-table th{background:var(--pink-light);font-size:.75rem;padding:10px 6px;white-space:nowrap;}
 .exchange-item-table td{height:88px;padding:10px 6px;border-bottom:1px solid var(--border-color);}
 .exchange-photo{display:flex;align-items:center;justify-content:center;width:38px;height:44px;object-fit:cover;border-radius:7px;background:#f8f9fa;color:#6c757d;font-size:.65rem;text-align:center;}
 .exchange-item-code{font-size:.72rem;color:#6c757d;}
 .exchange-quantity{width:56px;min-width:46px;padding:6px;text-align:center;}
 .exchange-product-cell{position:relative;min-width:120px;}
 .exchange-product-search{border:0;background:transparent;padding:3px 20px 3px 0;min-width:0;font-weight:700;box-shadow:none!important;font-size:.9rem;}
 .exchange-product-results{--exchange-option-height:64px;position:absolute;left:0;top:100%;width:max(100%,300px);max-width:380px;max-height:calc(3 * var(--exchange-option-height) + 2px);overflow-y:auto;overflow-x:hidden;z-index:30;background:#fff;border:1px solid var(--border-color);border-radius:8px;box-shadow:0 8px 18px rgba(51,51,61,.12);}
 .exchange-product-option{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;height:var(--exchange-option-height);min-height:var(--exchange-option-height);flex:0 0 var(--exchange-option-height);box-sizing:border-box;}
 .exchange-product-option + .exchange-product-option{margin-top:0;border-top-width:0;}
 .exchange-product-option>span:first-child{min-width:0;}
 .exchange-product-option strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
 .exchange-product-option.active,.exchange-product-option:hover{background:var(--pink-light);color:inherit;}
 .exchange-product-option small{display:block;color:#6c757d;font-size:.75rem;}
 .exchange-product-option-price{color:#b54f65;white-space:nowrap;font-weight:700;}
 .exchange-totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:16px;border-radius:10px;background:var(--pink-light);}
 .exchange-totals span{display:block;font-size:.8rem;color:#6c757d;}
 .exchange-totals strong{display:block;font-size:1.3rem;}
 .exchange-footer{display:flex;align-items:flex-end;gap:20px;}
 .exchange-footer .btn{min-height:40px;white-space:nowrap;}
 @media(max-width:800px){.exchange-comparison{grid-template-columns:1fr;}.exchange-direction{transform:rotate(90deg);}.exchange-item-table td{height:76px;}.exchange-product-results{width:100%;min-width:240px;max-width:calc(100vw - 100px);}.exchange-footer{align-items:stretch;flex-direction:column;}.exchange-totals{padding:12px;gap:8px;}.exchange-totals strong{font-size:1rem;}}
</style>
<script>
var exchangeReceipt = null;
var exchangeProducts = [];
var exchangeItems = [];
var exchangeLoadVersion = 0;
var exchangeOwner = null;
var exchangeHighlightedOption = -1;

function exchangeEmployee() {
  return String(currentCashier || (currentEmployee && (currentEmployee.fullName || currentEmployee.name)) || '').trim();
}
function exMoney(value) { return (Number(value) || 0).toFixed(2); }
function exEsc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function exchangeCurrent(version, owner) { return version === exchangeLoadVersion && currentEmployee === owner && !!owner; }
function openCustomerExchangeModal(receiptId) {
  if(!currentEmployee)return showNotificationToast('Employee session not found.',true);
  exchangeLoadVersion++;exchangeOwner=currentEmployee;exchangeReceipt=null;exchangeProducts=[];exchangeItems=[];
  document.getElementById('exchangeReceiptId').value=String(receiptId||'').trim();
  document.getElementById('exchangeReceiptSearch').style.display='block';
  document.getElementById('exchangeNotes').value='';
  document.getElementById('exchangeBuilder').style.display='none';
  document.getElementById('exchangeReceiptSearchBtn').disabled=false;
  document.getElementById('exchangeReceiptSearchBtn').textContent='Search';
  document.getElementById('customerExchangeModal').style.display='flex';
  if(receiptId)searchExchangeReceipt();else document.getElementById('exchangeReceiptId').focus();
}
function closeCustomerExchangeModal() {
  if(typeof checkoutSubmitting!=='undefined'&&checkoutSubmitting)return;
  exchangeLoadVersion++;
  document.getElementById('customerExchangeModal').style.display='none';
}
function searchExchangeReceipt() {
  const id=document.getElementById('exchangeReceiptId').value.trim();
  if(!id)return showNotificationToast('Enter the original receipt ID.',true);
  const button=document.getElementById('exchangeReceiptSearchBtn');
  if(button.disabled)return;
  const version=++exchangeLoadVersion,owner=currentEmployee;
  exchangeOwner=owner;exchangeReceipt=null;exchangeItems=[];
  document.getElementById('exchangeBuilder').style.display='none';
  const catalog=pageReadCache.get('exchangeProducts');
  const ownerKey=JSON.stringify([currentEmployee,currentCashier]);
  const cachedProducts=catalog&&catalog.owner===ownerKey&&catalog.data&&Date.now()-catalog.data.time<60000
    ? catalog.data.products : null;
  const catalogRead=cachedProducts===null?beginPageRead('exchangeProducts'):null;
  button.disabled=true;button.innerHTML=loadingIndicator('Searching…');
  function fail(error){if(!exchangeCurrent(version,owner))return;if(catalogRead&&catalogRead.current())catalogRead.fail();button.disabled=false;button.textContent='Search';showNotificationToast(error.message||String(error),true);}
  secureScriptRun.withSuccessHandler(result=>{
    if(!exchangeCurrent(version,owner))return;
    if(!result||!result.success)return fail(new Error(result&&result.message||'Receipt not found.'));
    if(!result.items||!result.items.length)return fail(new Error('No remaining exchangeable items on this receipt.'));
    exchangeReceipt=result;
    exchangeProducts=cachedProducts===null?(result.products||[]):cachedProducts;
    if(catalogRead&&catalogRead.current())catalogRead.save({products:exchangeProducts,time:Date.now()});
    button.disabled=false;button.textContent='Search';
    document.getElementById('exchangeOriginalReceipt').textContent=result.receipt.receiptId;
    document.getElementById('exchangeReceiptInfo').textContent='Cashier: '+(result.receipt.cashier||'—')+(result.receipt.reservationCredit?' · Non-refundable deposit credit':'');
    document.getElementById('exchangeReturnItem').innerHTML=result.items.map(item=>`<option value="${exEsc(item.code)}">${exEsc(item.code)} — ${exEsc(item.name)}</option>`).join('');
    document.getElementById('exchangeBuilder').style.display='block';
    document.getElementById('exchangeReceiptSearch').style.display='none';
    if (result.receipt.reservationCredit) addExchangeItem(); else renderExchangeItems();
  }).withFailureHandler(fail).getCustomerExchangeData(id,cachedProducts===null);
}
function exchangeUsesDepositCredit() { return !!(exchangeReceipt && exchangeReceipt.receipt.reservationCredit); }
function exchangeOriginal(code) { return exchangeReceipt&&exchangeReceipt.items.find(item=>String(item.code)===String(code)); }
function exchangeReplacement(code) { return exchangeProducts.find(item=>String(item.code)===String(code)); }
function exchangeQuantityLimit(index,side) {
  const row=exchangeItems[index],returning=side==='returnQty';
  const product=returning?exchangeOriginal(row.returnCode):exchangeReplacement(row.replacementCode);
  if(!product)return 0;
  const key=returning?'returnCode':'replacementCode';
  if (returning && exchangeUsesDepositCredit()) return 1;
  const used=exchangeItems.reduce((sum,item,i)=>sum+(i!==index&&item[key]===row[key]?item[side]:0),0);
  return Math.max(0,Number(returning?product.exchangeableQty:product.stock)-used);
}
function addExchangeItem() {
  const code=document.getElementById('exchangeReturnItem').value,product=exchangeOriginal(code);
  if(!product)return;
  const used=exchangeItems.filter(row=>row.returnCode===code).reduce((sum,row)=>sum+row.returnQty,0);
  if(!exchangeUsesDepositCredit()&&used>=product.exchangeableQty)return showNotificationToast('Only '+product.exchangeableQty+' purchased pcs of '+product.name+' can be exchanged.',true);
  exchangeItems.push({returnCode:code,returnQty:1,replacementCode:'',replacementQty:1});renderExchangeItems();
}
function clearExchangeItems() { exchangeItems=[];renderExchangeItems(); }
function removeExchangeItem(index) { exchangeItems.splice(index,1);renderExchangeItems(); }
function updateExchangeQuantity(index,side,input) {
  if(input.value===''){exchangeItems[index][side]=0;updateExchangeCalculation();return;}
  const limit=exchangeQuantityLimit(index,side),requested=Number(input.value);
  if(!Number.isInteger(requested)||requested<1){input.value=exchangeItems[index][side];return showNotificationToast('Enter a positive whole quantity.',true);}
  if(requested>limit){input.value=Math.max(1,limit);showNotificationToast('Quantity limit: '+limit+' pcs for this row.',true);}
  exchangeItems[index][side]=Math.max(1,Math.min(requested,limit));updateExchangeCalculation();
}
function exchangePhoto(item) {
  if(!item||!item.imageUrl)return '<span class="exchange-photo">No Img</span>';
  return `<img class="exchange-photo" src="${exEsc(item.imageUrl)}" alt="${exEsc(item.name)}" loading="lazy">`;
}
function renderExchangeItems() {
  const from=document.getElementById('exchangeReturnRows'),to=document.getElementById('exchangeReplacementRows');
  from.innerHTML=exchangeItems.length?exchangeItems.map((row,index)=>{
    if (exchangeUsesDepositCredit() && index > 0) return '<tr><td colspan="5" class="text-muted">Same deposit credit</td><td><button type="button" class="btn btn-sm btn-outline-danger" title="Remove item" aria-label="Remove item" onclick="removeExchangeItem('+index+')">×</button></td></tr>';
    const item=exchangeOriginal(row.returnCode),photo=exchangeReplacement(row.returnCode)||item;
    return `<tr><td>${exchangePhoto(photo)}</td><td class="fw-bold">${exEsc(item.name)}<div class="exchange-item-code fw-normal">${exEsc(item.code)}</div></td><td class="text-center">${exEsc(item.size||'—')}</td><td><input type="number" class="form-control form-control-sm exchange-quantity" min="1" max="${exchangeQuantityLimit(index,'returnQty')}" ${exchangeUsesDepositCredit()?'disabled':''} value="${row.returnQty}" aria-label="Return quantity for ${exEsc(item.name)}" data-exchange-index="${index}" data-exchange-side="returnQty" oninput="updateExchangeQuantity(${index},'returnQty',this)"></td><td class="text-end fw-bold text-nowrap">₱${exMoney(item.originalUnitExchangeValue)}</td><td><button type="button" class="btn btn-sm btn-outline-danger" title="Remove item" aria-label="Remove item" onclick="removeExchangeItem(${index})">×</button></td></tr>`;
  }).join(''):'<tr><td colspan="6" class="text-center text-muted py-4">Add an item to exchange.</td></tr>';
  to.innerHTML=exchangeItems.length?exchangeItems.map((row,index)=>{
    const item=exchangeReplacement(row.replacementCode);
    return `<tr><td>${exchangePhoto(item)}</td><td class="exchange-product-cell"><input id="exchangeProductSearch${index}" type="search" class="form-control exchange-product-search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="exchangeProductResults${index}" value="${exEsc(item&&item.name||'')}" placeholder="Search product" autocomplete="off" onfocus="this.select();renderExchangeProductOptions(${index},'')" oninput="searchExchangeProducts(${index},this.value)" onkeydown="exchangeProductKey(event,${index})" onblur="setTimeout(()=>hideExchangeProductOptions(${index}),150)"><div id="exchangeProductResults${index}" class="list-group exchange-product-results" role="listbox" style="display:none;"></div><div class="exchange-item-code">${exEsc(item&&item.code||'—')}</div></td><td class="text-center">${exEsc(item&&item.size||'—')}</td><td><input type="number" class="form-control form-control-sm exchange-quantity" min="1" max="${exchangeQuantityLimit(index,'replacementQty')}" value="${row.replacementQty}" aria-label="Replacement quantity for item ${index+1}" data-exchange-index="${index}" data-exchange-side="replacementQty" oninput="updateExchangeQuantity(${index},'replacementQty',this)"></td><td class="text-end fw-bold text-nowrap">₱${exMoney(item&&item.price)}</td></tr>`;
  }).join(''):'<tr><td colspan="5" class="text-center text-muted py-4">Select an original item first.</td></tr>';
  updateExchangeCalculation();
}
function matchingExchangeProducts(query) {
  const search=String(query||'').trim().toLowerCase();
  const order={PINS:0,OTHERS:1,YOURFINDS:2};
  const rank=item=>order[String(item.category||'').trim().toUpperCase()]??3;
  return exchangeProducts.filter(item=>!search||[item.name,item.code,item.category,item.size,item.price].join(' ').toLowerCase().includes(search))
    .sort((a,b)=>rank(a)-rank(b)||String(a.name||'').localeCompare(String(b.name||''))||String(a.code).localeCompare(String(b.code)))
    .slice(0,20);
}
function renderExchangeProductOptions(index,query) {
  const results=document.getElementById('exchangeProductResults'+index);if(!results)return;
  document.querySelectorAll('.exchange-product-results').forEach(other=>{if(other!==results)hideExchangeProductOptions(Number(other.id.replace('exchangeProductResults','')));});
  exchangeHighlightedOption=-1;
  const matches=matchingExchangeProducts(query);
  results.innerHTML=matches.length?matches.map(item=>`<button type="button" class="list-group-item list-group-item-action exchange-product-option" role="option" data-code="${exEsc(item.code)}" onmousedown="event.preventDefault()" onclick="selectExchangeProduct(${index},this.dataset.code)"><span><strong>${exEsc(item.name)}</strong><small>${exEsc(item.code)} · ${exEsc(item.category)}</small></span><span class="exchange-product-option-price">₱${exMoney(item.price)}</span></button>`).join(''):'<div class="list-group-item text-muted">No matching products.</div>';
  results.style.display='block';document.getElementById('exchangeProductSearch'+index).setAttribute('aria-expanded','true');
}
function hideExchangeProductOptions(index) {
  const results=document.getElementById('exchangeProductResults'+index),input=document.getElementById('exchangeProductSearch'+index);
  if(results)results.style.display='none';if(input)input.setAttribute('aria-expanded','false');exchangeHighlightedOption=-1;
}
function searchExchangeProducts(index,query) { exchangeItems[index].replacementCode='';renderExchangeProductOptions(index,query);updateExchangeCalculation(); }
function selectExchangeProduct(index,code) {
  const item=exchangeReplacement(code);if(!item)return;
  exchangeItems[index].replacementCode=item.code;
  const limit=exchangeQuantityLimit(index,'replacementQty');
  if(limit<1){exchangeItems[index].replacementCode='';showNotificationToast('No remaining replacement stock for '+item.name+'.',true);}
  else if(exchangeItems[index].replacementQty>limit){exchangeItems[index].replacementQty=limit;showNotificationToast('Quantity limit: '+limit+' pcs for this row.',true);}
  renderExchangeItems();
}
function exchangeProductKey(event,index) {
  if(event.key==='Escape'){hideExchangeProductOptions(index);return;}
  if(!['ArrowDown','ArrowUp','Enter'].includes(event.key))return;
  event.preventDefault();
  const results=document.getElementById('exchangeProductResults'+index);
  if(results.style.display==='none')renderExchangeProductOptions(index,event.currentTarget.value);
  const options=Array.from(results.querySelectorAll('.exchange-product-option'));if(!options.length)return;
  if(event.key==='Enter'){if(exchangeHighlightedOption>=0)options[exchangeHighlightedOption].click();return;}
  exchangeHighlightedOption=event.key==='ArrowDown'?Math.min(exchangeHighlightedOption+1,options.length-1):Math.max(0,exchangeHighlightedOption-1);
  options.forEach((option,i)=>{option.classList.toggle('active',i===exchangeHighlightedOption);option.setAttribute('aria-selected',String(i===exchangeHighlightedOption));});
  options[exchangeHighlightedOption].scrollIntoView({block:'nearest'});
}
function exchangeTotals() {
  let returned=0,replacement=0;
  exchangeItems.forEach(row=>{const a=exchangeOriginal(row.returnCode),b=exchangeReplacement(row.replacementCode);returned+=Number(a&&a.originalUnitExchangeValue||0)*row.returnQty;replacement+=Number(b&&b.price||0)*row.replacementQty;});
  if (exchangeUsesDepositCredit()) returned = Number(exchangeReceipt.items[0].originalUnitExchangeValue);
  return {returned:Math.round(returned*100)/100,replacement:Math.round(replacement*100)/100,due:Math.round((replacement-returned)*100)/100};
}
function exchangeValidation() {
  if(!exchangeItems.length)return 'Add an item to exchange.';
  for(let i=0;i<exchangeItems.length;i++){
    const row=exchangeItems[i];
    if(!Number.isInteger(row.returnQty)||row.returnQty<1||!Number.isInteger(row.replacementQty)||row.replacementQty<1)return 'Enter a positive whole quantity for every item.';
    if(!exchangeReplacement(row.replacementCode))return 'Select a replacement for each item.';
    if(row.returnQty>exchangeQuantityLimit(i,'returnQty')||row.replacementQty>exchangeQuantityLimit(i,'replacementQty'))return 'Quantity exceeds the available amount.';
  }
  if(exchangeTotals().due<0)return exchangeUsesDepositCredit()?'Choose replacements worth at least the deposit credit.':'Choose replacements worth at least the return value.';
  return '';
}
function updateExchangeCalculation() {
  const totals=exchangeTotals();
  document.getElementById('exchangeReturnValue').previousElementSibling.textContent=exchangeUsesDepositCredit()?'Deposit Credit':'Return Value';
  document.getElementById('exchangeReturnValue').textContent='₱'+exMoney(totals.returned);
  document.getElementById('exchangeReplacementValue').textContent='₱'+exMoney(totals.replacement);
  document.getElementById('exchangeAmountDue').textContent='₱'+exMoney(Math.max(0,totals.due));
  const error=exchangeValidation();document.getElementById('exchangeValidation').textContent=error;
  document.getElementById('exchangeConfirmBtn').disabled=!!error;
  document.querySelectorAll('[data-exchange-index]').forEach(input=>{input.max=exchangeQuantityLimit(Number(input.dataset.exchangeIndex),input.dataset.exchangeSide);});
}
function confirmCustomerExchange() {
  const error=exchangeValidation();if(error)return showNotificationToast(error,true);
  triggerCheckoutConsoleModal({kind:'EXCHANGE',owner:currentEmployee,originalReceiptId:exchangeReceipt.receipt.receiptId,
    items:exchangeItems.map(row=>Object.assign({},row)),sessionToken:currentEmployee.dashboardToken,notes:document.getElementById('exchangeNotes').value,amountDue:exchangeTotals().due});
}
function submitCustomerExchangeCheckout(payment,context) {
  const owner=currentEmployee;
  if(context.owner!==owner||owner!==exchangeOwner){setCheckoutLoading(false);return showNotificationToast('Employee session changed. Reopen exchange.',true);}
  requestManagerPin('Authorize this customer exchange.',credential=>{
    if(currentEmployee!==owner)return;
    if(!credential){setCheckoutLoading(false);return;}
    const auth=typeof credential==='object'?credential:{managerPin:credential};
    secureScriptRun.withSuccessHandler(result=>{
      if(currentEmployee!==owner)return;
      setCheckoutLoading(false);
      if(!result||!result.success)return showNotificationToast(result&&result.message||'Exchange failed.',true);
      toggleCheckoutModal(false);closeCustomerExchangeModal();
      pageReadCache.delete('inventory');pageReadCache.delete('cashierInventory');
      invalidateDeliveryItemCaches();
      if(typeof clearTransactionHistoryCache==='function')clearTransactionHistoryCache();else pageReadCache.delete('transactions');
      if(typeof clearManagerExpectedCashCache==='function')clearManagerExpectedCashCache();
      if(typeof refreshInventory==='function')refreshInventory();
      showNotificationToast('Exchange '+result.exchangeId+' completed · Additional ₱'+exMoney(result.amountDue));
      const history=document.getElementById('transactionHistoryModal');
      if(history&&history.style.display==='flex')loadTransactionHistory(true);
    }).withFailureHandler(error=>{if(currentEmployee===owner){setCheckoutLoading(false);showNotificationToast(error.message||String(error),true);}})
      .completeCustomerExchange({originalReceiptId:context.originalReceiptId,items:context.items,notes:context.notes,employee:exchangeEmployee(),expectedAmountDue:context.amountDue,
        paymentMethod:payment.paymentMethod,paymentReference:payment.referenceNumber,cashReceived:payment.cashReceived,
        applyCardFee:payment.applyCardFee,paymentParts:payment.paymentParts,sessionToken:context.sessionToken,...auth});
  });
}
function resetCustomerExchangeSession() {
  exchangeLoadVersion++;exchangeOwner=null;exchangeReceipt=null;exchangeProducts=[];exchangeItems=[];
  if(typeof activeCheckoutContext!=='undefined')activeCheckoutContext=null;
  if(typeof checkoutSubmitting!=='undefined')checkoutSubmitting=false;
}
</script>
