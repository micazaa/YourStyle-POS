<div id="inventoryBundleDeliveryModal" class="generic-overlay-blur" style="display:none;">
  <div class="custom-popup-card" style="max-width:620px;width:95%;max-height:85vh;overflow:auto;">
    <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3"><div><h5 class="fw-bold mb-1">Choose Delivery</h5><div id="inventoryBundleDeliveryName" class="small text-muted"></div></div><button type="button" class="btn-close" aria-label="Close delivery picker" onclick="closeModal('inventoryBundleDeliveryModal')"></button></div>
    <div id="inventoryBundleDeliveryChoices" class="d-grid gap-2"></div>
    <button type="button" class="btn btn-outline-secondary w-100 mt-3" onclick="closeModal('inventoryBundleDeliveryModal')">Cancel</button>
  </div>
</div>
<div id="bulkDistributionModal" class="generic-overlay-blur" style="display:none;">
  <div class="custom-popup-card delivery-modal-card">
    <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom">
      <div><h5 class="fw-bold mb-1">Distribute Bundles</h5><div id="bulkDistributionSubtitle" class="small text-muted"></div></div>
      <button type="button" class="btn-close" aria-label="Close" onclick="closeBulkDistributionModal()"></button>
    </div>
    <div class="delivery-items-toolbar mb-3">
      <div class="fw-semibold">Items Received</div>
      <div id="bulkDistributionBundleTabs" class="delivery-mode-toggle btn-group flex-wrap" role="group" aria-label="Select bundle"></div>
      <button type="button" id="bulkDistributionAddItemBtn" class="btn btn-sm btn-outline-dark delivery-add-item" onclick="addBulkDistributionLine()">+ Add Item</button>
    </div>
    <div id="bulkDistributionProductsLoading" class="text-center text-muted py-3" style="display:none;"><span class="app-loading" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Loading Product Master...</span></div>
    <div id="bulkDistributionProductsError" class="alert alert-danger" style="display:none;" role="alert"></div>
    <datalist id="bulkDistributionProductList"></datalist>
    <div class="delivery-line-scroll mb-3">
      <div class="delivery-line-head direct"><span>#</span><span>Type</span><span>Product</span><span>Actual Qty</span><span></span></div>
      <div id="bulkDistributionLines"></div>
    </div>
    <div class="delivery-summary mb-4" aria-live="polite"><span id="bulkDistributionBundleSummary"></span><span id="bulkDistributionProductSummary"></span></div>
    <div class="fw-semibold mb-2">Delivery Summary</div>
    <div class="row g-2 text-center mb-4" aria-live="polite">
      <div class="col-4"><div class="bg-light rounded p-3"><div class="small text-muted">Delivery Estimate</div><div id="bulkDistributionEstimatedQty" class="fw-bold fs-4">0</div></div></div>
      <div class="col-4"><div class="bg-light rounded p-3"><div class="small text-muted">Actual Counted</div><div id="bulkDistributionActualQty" class="fw-bold fs-4">0</div></div></div>
      <div class="col-4"><div class="bg-light rounded p-3"><div class="small text-muted">Current Variance</div><div id="bulkDistributionCurrentVariance" class="fw-bold fs-4">0</div></div></div>
    </div>
    <div class="mb-3"><label for="bulkDistributionEmployee" class="form-label">Distributed By</label><input id="bulkDistributionEmployee" class="form-control" readonly></div>
    <div class="mb-4"><label for="bulkDistributionRemarks" class="form-label">Remarks</label><textarea id="bulkDistributionRemarks" class="form-control" rows="2" placeholder="Optional notes"></textarea></div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary flex-fill" onclick="closeBulkDistributionModal()">Cancel</button>
      <button type="button" id="confirmBulkDistributionBtn" class="btn btn-outline-secondary flex-fill fw-bold" onclick="submitBulkDistribution(false)">Save</button>
      <button type="button" id="completeBulkDistributionBtn" class="btn btn-pink flex-fill fw-bold" onclick="submitBulkDistribution(true)">Done Distribution</button>
    </div>
  </div>
</div>

<script>
let inventoryBundleSummaryFailed = false;
let inventoryBundlePickerItem = null;
let inventoryBundlePickerOwner = '';

function inventoryBundleActionState(item) {
  const data = deliverySummaryData();
  const ready = !!data && Array.isArray(data.bundleProducts);
  const linked = ready && data.bundleProducts.includes(String(item.code));
  const name = String(item.baseName || item.name || '');
  const candidate = linked || (String(item.category).toUpperCase() === 'WHOLESALE' && / · \([1-9]\d*\) pcs(?:\s*[·-]\s*SALE)?$/i.test(name));
  return {ready:ready, linked:linked, candidate:candidate,
    available:linked ? data.bundles.filter(bundle => bundle.productCode === String(item.code) && bundle.available) : []};
}
function inventoryCanDistribute() {
  return !!currentEmployee && ['allow','approval'].includes(currentEmployee.permissions && currentEmployee.permissions['deliveries.create']);
}
function updateInventoryBundleAction(button) {
  const item = button.inventoryItem, state = inventoryBundleActionState(item);
  const distribute = state.linked || !state.ready;
  button.hidden = distribute ? !inventoryCanDistribute() : !button.inventoryCanDelete;
  button.classList.toggle('btn-warning',distribute);button.classList.toggle('btn-outline-danger',!distribute);
  button.innerHTML = inventoryIcon(distribute ? 'openBundle' : 'delete');
  const failed = currentEmployee && inventoryBundleSummaryFailed === currentEmployee.dashboardToken;
  button.disabled = distribute && (state.ready ? !state.available.length || Number(item.stock) <= 0 : !failed);
  button.title = !distribute ? 'Delete item' : !state.ready ? failed ? 'Retry loading bundles' : 'Checking available bundles…' : button.disabled ? 'No unopened bundles available' : 'Distribute';
  button.setAttribute('aria-label',button.title + ' · ' + (item.name || item.code));
}
function refreshInventoryBundleActions() {
  document.querySelectorAll('.inventory-bundle-action').forEach(updateInventoryBundleAction);
  const picker = document.getElementById('inventoryBundleDeliveryModal');
  if (picker.style.display === 'flex' && inventoryBundlePickerItem && currentEmployee && inventoryBundlePickerOwner === currentEmployee.dashboardToken) renderInventoryBundleDeliveries(inventoryBundlePickerItem);
}
function prepareInventoryBundleActions() {
  if (!document.querySelector('.inventory-bundle-action') || !currentEmployee) return;
  const data = deliverySummaryData();
  if (data && Array.isArray(data.bundleProducts)) return;
  if (data) pageReadCache.delete('deliverySummary');
  if (inventoryBundleSummaryFailed === currentEmployee.dashboardToken || pageReadCache.get('deliveries')?.pending) return;
  loadDeliverySummaryData();
}
function handleInventoryBundleAction(button) {
  const item = button.inventoryItem, state = inventoryBundleActionState(item);
  if (!state.ready) { inventoryBundleSummaryFailed = false;loadDeliverySummaryData();refreshInventoryBundleActions();return; }
  if (!state.linked) { if(button.inventoryCanDelete)deleteInventoryRow(item);return; }
  if (!inventoryCanDistribute() || !state.available.length || Number(item.stock) <= 0) return;
  const choices = inventoryBundleDeliveries(item);
  if (choices.length === 1) { openInventoryBundleDelivery(item,choices[0]);return; }
  inventoryBundlePickerItem = item;
  const picker = document.getElementById('inventoryBundleDeliveryModal');
  inventoryBundlePickerOwner = currentEmployee.dashboardToken;picker.style.display = 'flex';
  document.getElementById('inventoryBundleDeliveryName').textContent = item.baseName || item.name;
  renderInventoryBundleDeliveries(item);
}
function inventoryBundleDeliveries(item) {
  const choices = new Map();
  inventoryBundleActionState(item).available.forEach(bundle => {
    const key = JSON.stringify([bundle.deliveryId,bundle.sheetRow]);
    if (!choices.has(key)) choices.set(key,{...bundle,count:0});
    choices.get(key).count++;
  });
  return Array.from(choices.values());
}
function renderInventoryBundleDeliveries(item) {
  const box = document.getElementById('inventoryBundleDeliveryChoices');box.replaceChildren();
  const choices = inventoryBundleDeliveries(item), owner = currentEmployee && currentEmployee.dashboardToken;
  choices.forEach(choice => {
    const button = document.createElement('button');button.type = 'button';
    button.className = 'btn btn-outline-pink text-start p-3';
    const title = document.createElement('strong');title.className = 'd-block';title.textContent = choice.deliveryId;
    const detail = document.createElement('span');detail.className = 'small';
    detail.textContent = choice.date + ' · ' + choice.category + ' · ' + choice.count + ' available bundle(s)';
    button.append(title,detail);
    button.onclick = () => {if(currentEmployee && currentEmployee.dashboardToken === owner)openInventoryBundleDelivery(item,choice);};
    box.appendChild(button);
  });
  if (!choices.length) box.textContent = 'No unopened bundles available.';
}
function openInventoryBundleDelivery(item, choice) {
  if (!inventoryCanDistribute()) return;
  const current = inventoryBundleDeliveries(item).find(bundle => bundle.deliveryId === choice.deliveryId && bundle.sheetRow === choice.sheetRow);
  if (!current) {refreshInventoryBundleActions();showNotificationToast('This delivery has no unopened bundles available.',true);return;}
  closeModal('inventoryBundleDeliveryModal');
  openBulkDistributionModal(current.deliveryId,current.sheetRow,getCurrentDeliveryEmployeeName(),current.bundleNo);
}

let bulkDistributionSaving = false;
let bulkDistributionRequest = 0;
let bulkDistributionHolder = null;
let bulkDistributionProducts = [];
let bulkDistributionLineCounter = 0;
let bulkDistributionEmployee = "";
let bulkDistributionSelectedBundleNo = 1;

function openBulkDistributionModal(deliveryId, sheetRow, employee, bundleNo) {
  if (bulkDistributionSaving) return;
  const request = ++bulkDistributionRequest;
  const catalog = cachedDeliveryCatalog();
  bulkDistributionHolder = null;
  bulkDistributionProducts = [];
  bulkDistributionLineCounter = 0;
  bulkDistributionEmployee = String(employee || "").trim();
  bulkDistributionSelectedBundleNo = 1;
  document.getElementById("bulkDistributionEmployee").value = bulkDistributionEmployee;
  document.getElementById("bulkDistributionBundleTabs").replaceChildren();
  document.getElementById("bulkDistributionLines").innerHTML = "";
  updateBulkDistributionSummary();
  document.getElementById("bulkDistributionRemarks").value = "";
  document.getElementById("bulkDistributionProductsError").style.display = "none";
  document.getElementById("bulkDistributionProductsLoading").innerHTML = loadingIndicator(catalog ? 'Loading bundle details…' : 'Loading products and bundle details…');
  document.getElementById("bulkDistributionProductsLoading").style.display = "block";
  document.getElementById("bulkDistributionModal").style.display = "flex";

  const holderRead = new Promise((resolve,reject) => secureScriptRun.withSuccessHandler(resolve).withFailureHandler(reject)
    .getBulkDistributionData(deliveryId,true,sheetRow));
  Promise.all([getDeliveryCatalog(),holderRead]).then(function([products,result]) {
    if (request !== bulkDistributionRequest) return;
    if (!result || !result.success || !result.holder) {
      showBulkDistributionError(result && result.message ? result.message : "Unable to load BUNDLE holder."); return;
    }
    bulkDistributionHolder = result.holder;
    document.getElementById("bulkDistributionRemarks").value = result.holder.remarks || "";
    const requested = (result.holder.bundles || []).find(b => b.bundleNo === Number(bundleNo) && !b.disabled);
    const firstAvailable = (result.holder.bundles || []).find(b => !b.disabled);
    bulkDistributionSelectedBundleNo = requested ? requested.bundleNo : firstAvailable ? firstAvailable.bundleNo : 1;
    bulkDistributionProducts = (products.products || []).filter(p => p.category === result.holder.type);
    populateBulkDistributionProductList();
    document.getElementById("bulkDistributionProductsLoading").style.display = "none";
    renderBulkDistributionHolder();
    restoreBulkDistributionLines();
  }).catch(function(err){if(request === bulkDistributionRequest)showBulkDistributionError(err && err.message ? err.message : String(err));});
}

function closeBulkDistributionModal() {
  if (bulkDistributionSaving) return;
  bulkDistributionRequest++;
  document.getElementById("bulkDistributionModal").style.display = "none";
  bulkDistributionHolder = null; bulkDistributionProducts = []; bulkDistributionEmployee = "";
}

function renderBulkDistributionHolder() {
  const h = bulkDistributionHolder;
  if (!h) return;
  document.getElementById("bulkDistributionSubtitle").textContent = h.deliveryId + " · " + h.type;
  renderBulkDistributionTabs();
  updateBulkDistributionSummary();
}

function renderBulkDistributionTabs() {
  const box = document.getElementById("bulkDistributionBundleTabs");
  box.replaceChildren();
  const bundles = bulkDistributionHolder.bundles || [];
  if (bundles.length > 3) {
    const select = document.createElement("select");
    select.className = "form-select form-select-sm";
    select.setAttribute("aria-label", "Select bundle");
    bundles.forEach(function(bundle) {
      const option = document.createElement("option");
      option.value = bundle.bundleNo;
      option.textContent = bundleDisplayName_(bulkDistributionHolder.deliveryId, bundle.bundleNo) + (bundle.disabled ? " — " + (bundle.shortStatus || "Unavailable") : "");
      option.disabled = !!bundle.disabled;
      option.selected = Number(bundle.bundleNo) === bulkDistributionSelectedBundleNo;
      option.title = bundle.tooltip || "";
      select.appendChild(option);
    });
    select.onchange = function() { selectBulkDistributionBundle(select.value); };
    box.appendChild(select);
    return;
  }
  bundles.forEach(function(bundle) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btn btn-sm btn-outline-pink";
    button.setAttribute("aria-pressed", String(Number(bundle.bundleNo) === bulkDistributionSelectedBundleNo));
    button.textContent = bundleDisplayName_(bulkDistributionHolder.deliveryId, bundle.bundleNo) + (bundle.disabled ? " · " + (bundle.shortStatus || "Unavailable") : "");
    button.disabled = !!bundle.disabled;
    button.title = bundle.tooltip || "";
    button.onclick = function() { selectBulkDistributionBundle(bundle.bundleNo); };
    box.appendChild(button);
  });
}

function selectBulkDistributionBundle(bundleNo) {
  if (bulkDistributionSaving) return;
  const requested = (bulkDistributionHolder && bulkDistributionHolder.bundles || []).find(b => Number(b.bundleNo) === Number(bundleNo));
  if (!requested || requested.disabled) return;
  bulkDistributionSelectedBundleNo = Number(bundleNo) || 1;
  renderBulkDistributionTabs();
  let index = 0;
  document.querySelectorAll("#bulkDistributionLines .bulk-distribution-line").forEach(function(row) {
    const selected = Number(row.dataset.bundleNo) === bulkDistributionSelectedBundleNo;
    row.style.display = selected ? "" : "none";
    if (selected) row.querySelector(".delivery-line-number").textContent = ++index;
  });
  const addButton = document.getElementById("bulkDistributionAddItemBtn");
  if (addButton) addButton.disabled = !!(getSelectedBulkBundle() || {}).disabled;
  updateBulkDistributionSummary();
}
function getSelectedBulkBundle(){return (bulkDistributionHolder&&bulkDistributionHolder.bundles||[]).find(function(b){return Number(b.bundleNo)===Number(bulkDistributionSelectedBundleNo);})||null;}

function restoreBulkDistributionLines() {
  (bulkDistributionHolder.bundles || []).forEach(function(bundle) {
    (bundle.lines || []).forEach(function(saved) {
      bulkDistributionSelectedBundleNo = Number(bundle.bundleNo);
      addBulkDistributionLine(saved);
    });
  });
  const firstAvailable = (bulkDistributionHolder.bundles || []).find(b => !b.disabled);
  if (firstAvailable) selectBulkDistributionBundle(firstAvailable.bundleNo);
  if (!document.getElementById("bulkDistributionLines").children.length && bulkDistributionProducts.length) addBulkDistributionLine();
}

function addBulkDistributionLine(saved) {
  if(bulkDistributionSaving)return;
  if((getSelectedBulkBundle()||{}).disabled){showNotificationToast("This bundle is unavailable.",true);return;}
  if(!saved && !bulkDistributionProducts.length){showNotificationToast("Product Master is still loading.",true);return;}
  bulkDistributionLineCounter++; const id=bulkDistributionLineCounter; const c=document.getElementById("bulkDistributionLines"); const line=document.createElement("div");
  line.className="bulk-distribution-line delivery-line direct";
  line.dataset.bundleNo = bulkDistributionSelectedBundleNo;
  line.innerHTML=`<span class="delivery-line-number"></span><input class="form-control form-control-sm bulk-distribution-type" aria-label="Type" readonly><div><input type="text" class="form-control form-control-sm bulk-distribution-product-search" aria-label="Product" placeholder="Search product name or code" autocomplete="off" list="bulkDistributionProductList" oninput="handleBulkDistributionProductSearch(this)"><input type="hidden" class="bulk-distribution-product-code"></div><input type="number" class="form-control form-control-sm bulk-distribution-qty" aria-label="Actual quantity" min="1" step="1" value="1" oninput="updateBulkDistributionSummary()"><button type="button" class="btn btn-sm btn-outline-danger" aria-label="Remove item" onclick="removeBulkDistributionLine(this)">×</button>`;
  line.querySelector(".bulk-distribution-type").value = bulkDistributionHolder.type;
  c.appendChild(line);
  if (saved) {
    line.dataset.saved = "true";
    line.querySelector(".bulk-distribution-product-search").value = saved.productCode + " — " + saved.description;
    line.querySelector(".bulk-distribution-product-code").value = saved.productCode;
    line.querySelector(".bulk-distribution-qty").value = saved.quantity;
    line.querySelectorAll("input").forEach(input => { input.readOnly = true; });
    const remove = line.querySelector("button");
    remove.disabled = true;
    remove.title = "Already saved to inventory";
  }
  selectBulkDistributionBundle(bulkDistributionSelectedBundleNo);
}
function populateBulkDistributionProductList(){const list=document.getElementById("bulkDistributionProductList");if(!list)return;const fragment=document.createDocumentFragment();bulkDistributionProducts.forEach(function(p){const o=document.createElement("option");o.value=p.productCode+" — "+p.description;fragment.appendChild(o);});list.replaceChildren(fragment);}
function handleBulkDistributionProductSearch(input){const line=input.closest(".bulk-distribution-line");const hidden=line.querySelector(".bulk-distribution-product-code");const entered=String(input.value||"").trim();const p=bulkDistributionProducts.find(function(x){return x.productCode+" — "+x.description===entered;});hidden.value=p?p.productCode:"";updateBulkDistributionSummary();}
function removeBulkDistributionLine(button){const line=button.closest(".bulk-distribution-line");if(line)line.remove();selectBulkDistributionBundle(bulkDistributionSelectedBundleNo);}
function getBulkDistributionLines(bundleNo, includeSaved){return Array.from(document.querySelectorAll("#bulkDistributionLines .bulk-distribution-line")).filter(row=>(includeSaved || row.dataset.saved !== "true") && (bundleNo===undefined || Number(row.dataset.bundleNo)===Number(bundleNo))).map(function(row){const code=String(row.querySelector(".bulk-distribution-product-code").value||"").trim();const qty=Number(row.querySelector(".bulk-distribution-qty").value)||0;return{productCode:code,quantity:qty,bundleNo:Number(row.dataset.bundleNo)};});}

function updateBulkDistributionSummary() {
  const h = bulkDistributionHolder;
  const total = lines => lines.reduce((sum, line) => sum + (line.productCode ? line.quantity : 0), 0);
  const selectedLines = getBulkDistributionLines(bulkDistributionSelectedBundleNo);
  const selected = getSelectedBulkBundle();
  const bundleActual = (Number(selected && selected.actualQuantity) || 0) + total(selectedLines);
  const estimate = Number(h && h.estimatedQuantity) || 0;
  const actual = (Number(h && h.actualQuantity) || 0) + total(getBulkDistributionLines());
  const bundleEstimate = h ? estimate / (Number(h.bundleQty) || 1) : 0;
  document.getElementById("bulkDistributionBundleSummary").textContent = "Bundle est. " + bundleEstimate + " pcs · Actual " + bundleActual + " pcs";
  const products = new Map();
  getBulkDistributionLines(bulkDistributionSelectedBundleNo, true).forEach(function(line) {
    const product = bulkDistributionProducts.find(p => String(p.productCode) === line.productCode);
    if (product) products.set(product.description, (products.get(product.description) || 0) + line.quantity);
  });
  document.getElementById("bulkDistributionProductSummary").textContent = Array.from(products, ([name, qty]) => name + " " + qty).join(" · ");
  document.getElementById("bulkDistributionEstimatedQty").textContent = estimate;
  document.getElementById("bulkDistributionActualQty").textContent = actual;
  document.getElementById("bulkDistributionCurrentVariance").textContent = (actual > estimate ? "+" : "") + (actual - estimate);
}

function setBulkDistributionSaving(saving) {
  bulkDistributionSaving = saving;
  document.querySelectorAll("#bulkDistributionModal button, #bulkDistributionModal input, #bulkDistributionModal textarea").forEach(control => { control.disabled = saving || (control.tagName === "BUTTON" && !!control.closest('[data-saved="true"]')); });
  document.getElementById("confirmBulkDistributionBtn").innerHTML = saving ? loadingIndicator("Saving...") : "Save";
}

function submitBulkDistribution(complete) {
  if (bulkDistributionSaving) return;
  if (!bulkDistributionHolder) return showNotificationToast("BUNDLE holder is not loaded.", true);
  const employee = bulkDistributionEmployee;
  if (!employee) return showNotificationToast("Unable to identify the logged-in employee.", true);
  const lines = getBulkDistributionLines();
  if (!lines.length && !complete) { closeBulkDistributionModal(); return showNotificationToast("Saved entries are already up to date."); }
  for (const line of lines) {
    if (!line.productCode || !Number.isInteger(line.quantity) || line.quantity < 1) {
      selectBulkDistributionBundle(line.bundleNo);
      return showNotificationToast("Select a valid product and quantity for every item in BUNDLE " + bundleDisplayName_(bulkDistributionHolder.deliveryId, line.bundleNo) + ".", true);
    }
  }
  const bundleNumbers = [...new Set(lines.map(line => line.bundleNo))];
  const remarks = document.getElementById("bulkDistributionRemarks").value.trim();
  setBulkDistributionSaving(true);
  let saved = 0;
  function failed(message) {
    setBulkDistributionSaving(false);
    const remaining = getBulkDistributionLines();
    if (remaining.length) selectBulkDistributionBundle(remaining[0].bundleNo);
    showBulkDistributionError((saved ? saved + " bundle(s) saved. Remaining entries are still shown. " : "") + message);
    if (saved) refreshDeliveriesPage();
  }
  function saveNext() {
    if (!bundleNumbers.length) {
      if (complete) {
        secureScriptRun.withSuccessHandler(function(result) {
          if (!result || !result.success) return failed(result && result.message || "Unable to complete distribution.");
          setBulkDistributionSaving(false);
          closeBulkDistributionModal();
          showNotificationToast("Distribution completed.");
          refreshDeliveriesPage();
        }).withFailureHandler(error => failed(error.message || String(error)))
          .completeBulkHolder({deliveryId:bulkDistributionHolder.deliveryId, sheetRow:bulkDistributionHolder.sheetRow, employee:employee, remarks:remarks});
      } else {
        setBulkDistributionSaving(false);
        closeBulkDistributionModal();
        showNotificationToast("Distribution saved. Open BUNDLE to continue.");
        refreshDeliveriesPage();
      }
      return;
    }
    const bundleNo = bundleNumbers.shift();
    secureScriptRun.withSuccessHandler(function(result) {
      if (!result || !result.success) return failed(result && result.message || "Distribution failed.");
      saved++;
      bulkDistributionHolder.actualQuantity = result.actualQuantity;
      bulkDistributionHolder.bundles = result.bundles;
      document.querySelectorAll("#bulkDistributionLines .bulk-distribution-line").forEach(row => {
        if (Number(row.dataset.bundleNo) === bundleNo && row.dataset.saved !== "true") {
          row.dataset.saved = "true";
          row.querySelectorAll("input").forEach(input => { input.readOnly = true; });
        }
      });
      updateBulkDistributionSummary();
      saveNext();
    }).withFailureHandler(function(error) {
      failed((error.message || String(error)) + " Check delivery history before retrying if the connection was interrupted.");
    }).distributeBulkBundle({deliveryId:bulkDistributionHolder.deliveryId, sheetRow:bulkDistributionHolder.sheetRow, bundleNo:bundleNo, employee:employee, remarks:remarks, lines:lines.filter(line => line.bundleNo === bundleNo)});
  }
  document.getElementById("bulkDistributionProductsError").style.display = "none";
  saveNext();
}

function showBulkDistributionError(message){const loading=document.getElementById("bulkDistributionProductsLoading");const error=document.getElementById("bulkDistributionProductsError");if(loading)loading.style.display="none";if(error){error.textContent=String(message||"Unknown error.");error.style.display="block";}}
</script>
