<div
  id="loginOverlay"
  class="generic-overlay-blur"
  style="display:none;"
>

  <div
    class="custom-popup-card"
    style="
      max-width:440px;
      width:94%;
      padding:32px;
    "
  >

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="text-center mb-4">

      <img
        src="https://drive.google.com/thumbnail?sz=w300&id=1MsTEIjhHkeq0i74lngukOKemXDoq_O7u"
        alt="Logo"
        class="mb-3"
        style="
          height:64px;
          width:64px;
          object-fit:cover;
          border-radius:50%;
          border:1px solid var(--border-color);
        "
      >

      <h4 class="fw-bold text-dark mb-1">
        Welcome Back
      </h4>

      <p class="text-muted small mb-0">
        Log in to start your system shift
      </p>

    </div>


    <!-- =====================================================
         EMPLOYEE
    ====================================================== -->

    <div class="mb-3">

      <label class="form-label fw-semibold">
        Cashier Name
      </label>

      <select
        class="form-select"
        id="cashierSelect"
      >
        <option value="">
          Loading employees...
        </option>
      </select>

    </div>


    <!-- =====================================================
         PIN
    ====================================================== -->

    <div class="mb-4">

      <label class="form-label fw-semibold">
        PIN Code
      </label>

      <input
        type="password"
        class="form-control text-center fw-bold"
        id="cashierPin"
        placeholder="••••"
        autocomplete="off"
        style="letter-spacing:4px;"
        onkeydown="
          if(event.key === 'Enter'){
            unlockTerminalSession();
          }
        "
      >

    </div>


    <!-- =====================================================
         PETTY HANDOVER
    ====================================================== -->

    <div
      class="rounded p-3 mb-4"
      style="
        background:var(--pink-light);
        border:1px solid rgba(0,0,0,.06);
      "
    >

      <div
        class="d-flex justify-content-between align-items-start gap-3"
      >

        <div>

          <div class="fw-semibold">
            Starting Petty Cash
          </div>

          <div
            id="pettyHandoverHint"
            class="small text-muted mt-1"
          >
            Loading petty handover...
          </div>

        </div>


        <div
          id="pettyLoadingSpinner"
          class="spinner-border spinner-border-sm text-secondary"
          role="status"
        ></div>

      </div>


      <div class="input-group mt-3">

        <span class="input-group-text bg-white">
          ₱
        </span>

        <input
          type="number"
          class="form-control fw-bold fs-5"
          id="startingPettyCashInput"
          value="0.00"
          min="0"
          step="0.01"
          disabled
        >

      </div>


      <div
        id="pettyHandoverSource"
        class="small mt-2"
        style="display:none;"
      ></div>

    </div>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <button
      id="loginShiftButton"
      type="button"
      class="btn btn-pink w-100 py-2"
      onclick="unlockTerminalSession()"
      disabled
    >
      <span class="app-loading" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Loading shift…</span>
    </button>

  </div>

</div>


<script>

/* ==========================================================
   LOGIN STATE
========================================================== */

var phase10EmployeesLoaded =
  false;

var phase10PettyLoaded =
  false;


/* ==========================================================
   INITIALIZE LOGIN

   IMPORTANT:
   Call this whenever the login screen is opened.
========================================================== */

let loginSetupRequest = null;
let loginSetupGeneration = 0;
function initializeLogin() {
  ++loginSetupGeneration;
  loginSetupRequest = new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getLoginSetup());

  phase10EmployeesLoaded =
    false;

  phase10PettyLoaded =
    false;


  const loginButton =
    document.getElementById(
      "loginShiftButton"
    );


  if (loginButton) {

    loginButton.disabled =
      true;

    loginButton.innerHTML = loadingIndicator("Loading shift…");

  }


  loadEmployees();

  loadPettyHandover();

}


/* ==========================================================
   UPDATE LOGIN READY STATE
========================================================== */

function updateLoginReady() {

  const button =
    document.getElementById(
      "loginShiftButton"
    );


  if (!button) {

    return;

  }


  const ready =
    phase10EmployeesLoaded &&
    phase10PettyLoaded;


  button.disabled =
    !ready;


  button.innerHTML = ready ? "Log In" : loadingIndicator("Loading shift…");

}


/* ==========================================================
   LOAD EMPLOYEES
========================================================== */

function loadEmployees() {

  const select =
    document.getElementById(
      "cashierSelect"
    );


  if (!select) {

    return;

  }


  select.innerHTML = '<option value="">Loading employees...</option>';
  setControlLoading(select, true, 'Loading employees…');


  const generation = loginSetupGeneration;
  loginSetupRequest.then(result=>result.employees).then(
      function(employees) {
        if (generation !== loginSetupGeneration) return;
        setControlLoading(select, false);

        select.innerHTML =
          "";


        const first =
          document.createElement(
            "option"
          );


        first.value =
          "";

        first.textContent =
          "-- Select Employee --";


        select.appendChild(
          first
        );


        (
          Array.isArray(employees)
            ? employees
            : []
        )
          .forEach(
            function(emp) {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                emp.fullName;


              option.textContent =
                emp.fullName;


              select.appendChild(
                option
              );

            }
          );


        phase10EmployeesLoaded =
          true;


        updateLoginReady();

      }
    )


    .catch(
      function(err) {
        if (generation !== loginSetupGeneration) return;
        setControlLoading(select, false);

        console.error(
          "Employee loading error:",
          err
        );


        select.innerHTML =
          '<option value="">Unable to load employees</option>';


        showNotificationToast(
          err &&
          err.message
            ? err.message
            : "Unable to load employees.",
          true
        );

      }
    )


    ;

}


/* ==========================================================
   LOAD PETTY HANDOVER
========================================================== */

function loadPettyHandover() {

  const input =
    document.getElementById(
      "startingPettyCashInput"
    );


  const hint =
    document.getElementById(
      "pettyHandoverHint"
    );


  const source =
    document.getElementById(
      "pettyHandoverSource"
    );


  const spinner =
    document.getElementById(
      "pettyLoadingSpinner"
    );


  if (
    !input ||
    !hint
  ) {

    return;

  }


  input.value =
    "0.00";

  input.disabled =
    true;

  input.readOnly =
    true;


  hint.textContent =
    "Loading petty handover...";


  if (source) {

    source.style.display =
      "none";

    source.textContent =
      "";

  }


  if (spinner) {

    spinner.style.display =
      "inline-block";

  }


  const generation = loginSetupGeneration;
  loginSetupRequest.then(result=>result.petty).then(
      function(data) {
        if (generation !== loginSetupGeneration) return;

        console.log(
          "Phase 10 petty handover:",
          data
        );


        const received =
          Number(
            data &&
            data.received
          ) || 0;


        const previousReportId =
          String(
            data &&
            data.previousReportId
              ? data.previousReportId
              : ""
          ).trim();


        const hasPrevious =
          !!previousReportId;


        input.value =
          received.toFixed(
            2
          );


        /*
          Previous handover:
          amount is controlled by the system.

          No previous handover:
          allow initial petty entry.
        */

        input.disabled =
          false;


        input.readOnly =
          hasPrevious;


        if (hasPrevious) {

          hint.textContent =
            "Petty cash carried from the previous closed shift.";


          if (source) {

            source.style.display =
              "block";


            source.innerHTML = `

              <span class="text-success fw-semibold">
                ✓ Handover ready
              </span>

              <span class="text-muted">
                · ${escapeLoginHtml(
                  previousReportId
                )}
              </span>

            `;

          }

        } else {

          hint.textContent =
            "No previous petty handover found. Enter the initial petty cash.";


          if (source) {

            source.style.display =
              "block";


            source.innerHTML = `

              <span class="text-warning fw-semibold">
                Initial petty setup
              </span>

            `;

          }

        }


        if (spinner) {

          spinner.style.display =
            "none";

        }


        phase10PettyLoaded =
          true;


        updateLoginReady();

      }
    )


    .catch(
      function(err) {
        if (generation !== loginSetupGeneration) return;

        console.error(
          "Phase 10 petty handover error:",
          err
        );


        input.value =
          "0.00";


        input.disabled =
          false;

        input.readOnly =
          false;


        hint.textContent =
          "Unable to load previous petty cash.";


        if (source) {

          source.style.display =
            "block";


          source.innerHTML = `

            <span class="text-danger">
              ${
                escapeLoginHtml(
                  err &&
                  err.message
                    ? err.message
                    : "Unknown server error"
                )
              }
            </span>

          `;

        }


        if (spinner) {

          spinner.style.display =
            "none";

        }


        /*
          Do NOT leave the screen loading forever.

          We deliberately allow login after showing the error,
          but petty becomes manually editable.
        */

        phase10PettyLoaded =
          true;


        updateLoginReady();

      }
    )


    ;

}


/* ==========================================================
   LOGIN / START SHIFT
========================================================== */

let loginAttempt = 0;
function unlockTerminalSession() {
  const name=document.getElementById('cashierSelect').value;
  const pin=document.getElementById('cashierPin').value;
  const petty=Number(document.getElementById('startingPettyCashInput').value);
  const button=document.getElementById('loginShiftButton');
  if(button.disabled)return;
  if(!name||!pin)return showNotificationToast('Please choose your name and enter your PIN.',true);
  if(!Number.isFinite(petty)||petty<0)return showNotificationToast('Starting petty cash cannot be negative.',true);
  const attempt=++loginAttempt;
  button.disabled=true;button.innerHTML=loadingIndicator('Logging in…');
  const failed=error=>{if(attempt!==loginAttempt)return;button.disabled=false;button.textContent='Log In';showNotificationToast(error.message||String(error),true);};
  google.script.run.withSuccessHandler(response=>{
    if(attempt!==loginAttempt)return;
    if(!response||!response.success)return failed(new Error(response&&response.message||'Login failed.'));
    const result=response.employee;
    pageReadCache.clear();
    currentEmployee=result;currentCashier=result.fullName;
    currentShiftPettyCash=Number(response.shift.pettyReceived)||0;
    updateSidebarProfile(result);
    document.getElementById('cashierManagerReportBtn').style.display=Number(result.accessLevel)<=1?'block':'none';
    document.getElementById('loginOverlay').style.display='none';
    document.getElementById('terminalWorkspace').style.display='block';
    document.getElementById('appSidebar').style.display='flex';
    button.disabled=false;button.textContent='Log In';document.getElementById('cashierPin').value='';
    showPage('posPage');saveSession();
    if(typeof refreshInventory==='function')refreshInventory();
  }).withFailureHandler(failed).loginAndStartShift(name,pin,petty);
}

/* ==========================================================
   SAFE HTML
========================================================== */

function escapeLoginHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>
