<div
  id="loginOverlay"
  class="generic-overlay-blur"
  style="display:none;"
>

  <div
    class="custom-popup-card login-card"
    style="
      max-width:440px;
      width:94%;
      padding:32px;
    "
  >

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="text-center login-header">

      <img
        src="https://drive.google.com/thumbnail?sz=w300&id=1MsTEIjhHkeq0i74lngukOKemXDoq_O7u"
        alt="Logo"
        class="mb-3"
        style="
          height:64px;
          width:64px;
          object-fit:cover;
          border-radius:50%;
          border:1px solid var(--border-color);
        "
      >

      <h4 class="fw-bold text-dark mb-1">
        Welcome back
      </h4>

      <p id="loginModeSubtitle" class="text-muted mb-0">
        Sign in to continue.
      </p>

    </div>

    <!-- =====================================================
         USERNAME
    ====================================================== -->

    <div class="mb-3">

      <label class="form-label fw-semibold" for="cashierSelect">
        Username
      </label>

      <input
        type="text"
        class="form-control"
        id="cashierSelect"
        placeholder="name0123@ys.sys"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        oninput="updateLoginReady()"
        onkeydown="if(event.key === 'Enter'){ unlockTerminalSession(); }"
      >

    </div>


    <!-- =====================================================
         PASSWORD
    ====================================================== -->

    <div class="mb-4">

      <label class="form-label fw-semibold" for="cashierPin">
        Password
      </label>

      <div class="login-password-wrap">
        <input
          type="password"
          class="form-control"
          id="cashierPin"
          placeholder="Enter your password"
          autocomplete="current-password"
          oninput="updateLoginReady()"
          onkeydown="
            if(event.key === 'Enter'){
              unlockTerminalSession();
            }
          "
        >
        <button id="loginPasswordToggle" class="login-password-toggle" type="button" aria-label="Show password" aria-controls="cashierPin" aria-pressed="false" onclick="toggleLoginPassword()">Show</button>
      </div>

    </div>


    <!-- =====================================================
         PETTY HANDOVER
    ====================================================== -->

    <div
      id="pettyHandoverPanel"
      class="login-petty-panel mb-4"
    >

      <div
        class="d-flex justify-content-between align-items-start gap-3"
      >

        <div>

          <div class="login-petty-title">
            Petty Cash
          </div>

        </div>


        <div
          id="pettyLoadingSpinner"
          class="spinner-border spinner-border-sm text-secondary"
          role="status"
        ></div>

      </div>

      <div class="input-group login-petty-amount">

        <span class="input-group-text">
          ₱
        </span>

        <input
          type="number"
          class="form-control fw-bold fs-5"
          id="startingPettyCashInput"
          value="0.00"
          min="0"
          step="0.01"
          disabled
        >

      </div>

      <label class="login-petty-confirm" for="confirmPettyHandover">
        <input id="confirmPettyHandover" class="form-check-input" type="checkbox" onchange="updateLoginReady()">
        <span>I received and verify this amount.</span>
      </label>


      <div
        id="pettyHandoverSource"
        class="login-petty-source"
        role="status"
        aria-live="polite"
        style="display:none;"
      ></div>

    </div>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <div class="login-shift-prompt">
      <span id="loginShiftPromptText">Are you a cashier?</span>
      <button id="loginShiftToggle" class="login-shift-link" type="button" aria-expanded="false" aria-controls="pettyHandoverPanel" onclick="changeLoginMode(selectedLoginMode === 'CASHIER' ? 'STAFF' : 'CASHIER')">Start shift</button>
    </div>

    <button
      id="loginShiftButton"
      type="button"
      class="btn btn-pink w-100 py-2 login-submit"
      onclick="unlockTerminalSession()"
      disabled
    >
      Sign in
    </button>

    <p id="loginShiftBlockedReason" class="small text-muted mt-2 mb-0" role="status" aria-live="polite" hidden></p>

  </div>

</div>


<script>

/* ==========================================================
   LOGIN STATE
========================================================== */

var phase10EmployeesLoaded =
  false;

var phase10PettyLoaded =
  false;

var selectedLoginMode = "STAFF";
var loginPettyHandover = null;
var loginPettyError = false;
var loginEmployees = [];
var loginEmployeesError = false;
var loginBusy = false;

function changeLoginMode(mode) {
  selectedLoginMode = mode === "STAFF" ? "STAFF" : "CASHIER";
  const cashierMode = selectedLoginMode === "CASHIER";
  document.getElementById("pettyHandoverPanel").style.display = cashierMode ? "block" : "none";
  const shiftToggle = document.getElementById("loginShiftToggle");
  document.getElementById("loginShiftPromptText").textContent = cashierMode ? "Not starting a shift?" : "Are you a cashier?";
  shiftToggle.textContent = cashierMode ? "Sign in normally" : "Start shift";
  shiftToggle.setAttribute("aria-expanded", String(cashierMode));
  if (!cashierMode) document.getElementById("confirmPettyHandover").checked = false;
  document.getElementById("loginShiftButton").textContent = cashierMode ? "Start cashier shift" : "Sign in";
  updateLoginReady();
}

function toggleLoginPassword() {
  const input = document.getElementById("cashierPin");
  const button = document.getElementById("loginPasswordToggle");
  const showing = input.type === "password";
  input.type = showing ? "text" : "password";
  button.textContent = showing ? "Hide" : "Show";
  button.setAttribute("aria-label", showing ? "Hide password" : "Show password");
  button.setAttribute("aria-pressed", String(showing));
  input.focus();
}


/* ==========================================================
   INITIALIZE LOGIN

   IMPORTANT:
   Call this whenever the login screen is opened.
========================================================== */

let loginSetupRequest = null;
let loginSetupGeneration = 0;
function initializeLogin() {
  ++loginSetupGeneration;
  ++loginAttempt;
  loginBusy = false;
  selectedLoginMode = "STAFF";
  loginEmployees = [];
  loginEmployeesError = false;
  document.getElementById("cashierSelect").value = "";
  document.getElementById("confirmPettyHandover").checked = false;
  document.getElementById("cashierPin").value = "";
  document.getElementById("cashierPin").type = "password";
  document.getElementById("loginPasswordToggle").textContent = "Show";
  document.getElementById("loginPasswordToggle").setAttribute("aria-label", "Show password");
  document.getElementById("loginPasswordToggle").setAttribute("aria-pressed", "false");
  changeLoginMode("STAFF");
  loginSetupRequest = new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getLoginSetup());

  phase10EmployeesLoaded =
    false;

  phase10PettyLoaded =
    false;
  loginPettyHandover = null;
  loginPettyError = false;


  updateLoginReady();
  loadEmployees();

  loadPettyHandover();

}


/* ==========================================================
   UPDATE LOGIN READY STATE
========================================================== */

function updateLoginReady() {

  const button =
    document.getElementById(
      "loginShiftButton"
    );


  if (!button) {

    return;

  }

  if (loginBusy) {
    button.disabled = true;
    document.getElementById('loginShiftBlockedReason').hidden = true;
    if (selectedLoginMode === 'CASHIER') button.textContent = 'Start cashier shift';
    else button.innerHTML = loadingIndicator('Logging in…');
    return;
  }


  const username = document.getElementById("cashierSelect").value.trim().toLowerCase();
  const validUsername = /^[a-z0-9]+(?:\.[a-z0-9]+)?\d+@ys\.sys$/.test(username);
  const account = loginEmployees.find(employee => employee.username === username);
  const hasCredentials =
    !!username &&
    !!document.getElementById("cashierPin").value;
  const pettyAvailable = !loginPettyHandover || !loginPettyHandover.holder ||
    account && loginPettyHandover.holder === account.fullName;
  const ready = selectedLoginMode === "CASHIER"
    ? phase10EmployeesLoaded && hasCredentials && validUsername && !!account && phase10PettyLoaded && pettyAvailable && document.getElementById("confirmPettyHandover").checked
    : hasCredentials;


  button.disabled =
    !ready;


  button.textContent = selectedLoginMode === 'CASHIER' ? 'Start cashier shift' : 'Sign in';
  const reason = document.getElementById('loginShiftBlockedReason');
  let blocked = '';
  if (selectedLoginMode === 'CASHIER' && !ready) {
    if (username && !validUsername) blocked = 'Include your access number before @ys.sys, e.g. micatambalong1@ys.sys.';
    else if (!hasCredentials) blocked = 'Enter your username and password.';
    else if (loginEmployeesError || loginPettyError) blocked = 'Unable to read shift details. Use Retry in the petty cash panel.';
    else if (!phase10EmployeesLoaded || !phase10PettyLoaded) blocked = 'Waiting for petty cash details.';
    else if (!account) blocked = 'Username not recognized. Check your Username in Employees.';
    else if (!pettyAvailable) blocked = 'Petty cash is still with ' + loginPettyHandover.holder + '. They must pause or end their shift first.';
    else if (!document.getElementById('confirmPettyHandover').checked) blocked = 'Confirm that you received and counted the petty cash.';
  }
  reason.hidden = !blocked;
  reason.textContent = blocked;

}


/* ==========================================================
   LOAD EMPLOYEES
========================================================== */

function loadEmployees() {
  const generation = loginSetupGeneration;
  loginSetupRequest.then(result=>result.employees).then(
      function(employees) {
        if (generation !== loginSetupGeneration) return;
        loginEmployees = Array.isArray(employees) ? employees : [];
        loginEmployeesError = false;
        phase10EmployeesLoaded = true;
        updateLoginReady();
      }
    )
    .catch(
      function(err) {
        if (generation !== loginSetupGeneration) return;
        console.error(
          "Employee loading error:",
          err
        );


        phase10EmployeesLoaded = false;
        loginEmployeesError = true;
        loginEmployees = [];
        updateLoginReady();
        if (selectedLoginMode === 'CASHIER') showNotificationToast(
          err &&
          err.message
            ? err.message
            : "Unable to load employees.",
          true
        );

      }
    )


    ;

}


/* ==========================================================
   LOAD PETTY HANDOVER
========================================================== */

function loadPettyHandover() {
  loginPettyError = false;

  const input =
    document.getElementById(
      "startingPettyCashInput"
    );


  const hint =
    document.getElementById(
      "pettyHandoverHint"
    );


  const source =
    document.getElementById(
      "pettyHandoverSource"
    );


  const spinner =
    document.getElementById(
      "pettyLoadingSpinner"
    );


  if (!input) {

    return;

  }


  input.value =
    "0.00";

  input.disabled =
    true;

  input.readOnly =
    true;


  if (hint) {
    hint.textContent = "Loading petty handover...";
  }


  if (source) {

    source.style.display =
      "none";

    source.textContent =
      "";

  }


  if (spinner) {

    spinner.style.display =
      "inline-block";

  }


  const generation = loginSetupGeneration;
  loginSetupRequest.then(result=>result.petty).then(
      function(data) {
        if (generation !== loginSetupGeneration) return;
        if (!data || !data.success) throw new Error(data && data.message || 'Unable to load petty cash.');
        loginPettyHandover = data;

        console.log(
          "Phase 10 petty handover:",
          data
        );


        const received =
          Number(
            data &&
            data.received
          ) || 0;


        const previousReportId =
          String(
            data &&
            data.previousReportId
              ? data.previousReportId
              : ""
          ).trim();

        const previousEmployee = String(data && data.previousEmployee || "").trim();
        const previousCountedAt = String(data && data.previousCountedAt || "").trim();


        const hasPrevious =
          !!previousReportId;


        input.value =
          received.toFixed(
            2
          );


        /*
          Previous handover:
          amount is controlled by the system.

          No previous handover:
          allow initial petty entry.
        */

        input.disabled =
          false;


        input.readOnly =
          hasPrevious;


        if (hasPrevious) {

          if (source) {

            source.style.display =
              "block";


            const countedBy = previousEmployee
              ? `Last counted by ${previousEmployee}${previousCountedAt ? ` · ${previousCountedAt}` : ""}`
              : "Previous petty cash handover";
            source.textContent = countedBy;
          }

        } else {

          if (hint) {
            hint.textContent =
              "No previous petty handover found. Enter the initial petty cash.";
          }


          if (source) {

            source.style.display =
              "block";


            source.innerHTML = `

              <span class="text-warning fw-semibold">
                Initial petty setup
              </span>

            `;

          }

        }


        if (spinner) {

          spinner.style.display =
            "none";

        }


        phase10PettyLoaded = true;


        updateLoginReady();

      }
    )


    .catch(
      function(err) {
        if (generation !== loginSetupGeneration) return;

        console.error(
          "Phase 10 petty handover error:",
          err
        );


        input.value =
          "0.00";


        input.disabled =
          false;

        input.readOnly =
          false;


        if (hint) {
          hint.textContent = "Unable to load previous petty cash.";
        }


        if (source) {

          source.style.display =
            "block";


          source.innerHTML = `

            <span class="text-danger">
              ${
                escapeLoginHtml(
                  err &&
                  err.message
                    ? err.message
                    : "Unknown server error"
                )
              }
            </span>

          `;

        }


        if (spinner) {

          spinner.style.display =
            "none";

        }


        loginPettyError = true;
        phase10PettyLoaded = false;
        input.disabled = true;
        if (source) {
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'btn btn-outline-secondary btn-sm ms-2';
          retry.textContent = 'Retry';
          retry.onclick = reloadLoginPettyHandover;
          source.appendChild(retry);
        }


        updateLoginReady();

      }
    )


    ;

}


/* ==========================================================
   LOGIN / START SHIFT
========================================================== */

let loginAttempt = 0;
function reloadLoginPettyHandover() {
  document.getElementById('confirmPettyHandover').checked = false;
  phase10PettyLoaded = false;
  loginPettyError = false;
  loginSetupRequest = new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getLoginSetup());
  loadEmployees();
  loadPettyHandover();
  updateLoginReady();
}
function unlockTerminalSession() {
  const name=document.getElementById('cashierSelect').value.trim().toLowerCase();
  const pin=document.getElementById('cashierPin').value;
  const cashierMode=selectedLoginMode==='CASHIER';
  const petty=Number(document.getElementById('startingPettyCashInput').value);
  const button=document.getElementById('loginShiftButton');
  if(button.disabled||loginBusy)return;
  if(!/^[a-z0-9]+(?:\.[a-z0-9]+)?\d+@ys\.sys$/.test(name)||!pin)return showNotificationToast('Enter your username (e.g. micatambalong1@ys.sys) and password.',true);
  if(cashierMode&&(!Number.isFinite(petty)||petty<0))return showNotificationToast('Starting petty cash cannot be negative.',true);
  if(cashierMode&&!document.getElementById('confirmPettyHandover').checked)return showNotificationToast('Confirm the petty cash you received before starting your shift.',true);
  const attempt=++loginAttempt;
  loginBusy=true;
  button.disabled=true;
  if(cashierMode)button.textContent='Start cashier shift';
  else button.innerHTML=loadingIndicator('Logging in…');
  const failed=error=>{if(attempt!==loginAttempt)return;loginBusy=false;button.textContent=cashierMode?'Start cashier shift':'Sign in';showNotificationToast(error.message||String(error),true);if(cashierMode)reloadLoginPettyHandover();updateLoginReady();};
  const onLoginSuccess=response=>{
    if(attempt!==loginAttempt)return;
    if(!response||!response.success)return failed(new Error(response&&response.message||'Login failed.'));
    const result=response.employee||(cashierMode?null:response);
    if(!result)return failed(new Error('Employee sign-in did not return an account.'));
    if(cashierMode&&(!response.shift||!response.shift.success))return failed(new Error(response&&response.shift&&response.shift.message||'Unable to start cashier shift.'));
    loginBusy=false;
    pageReadCache.clear();
    localStorage.removeItem('ys_pos_inventory_tab');
    currentEmployee=result;currentCashier=result.fullName;currentSessionIsCashier=cashierMode;
    currentShiftPettyCash=cashierMode?(Number(response.shift.pettyReceived)||0):0;
    currentShiftReportId=cashierMode?response.shift.reportId:'';
    if (typeof clearCashierReportCache === 'function') clearCashierReportCache();
    if (cashierMode && typeof rememberCashierReportContext === 'function') {
      rememberCashierReportContext({...response.shift, managers: loginEmployees
        .filter(employee => Number.isFinite(employee.accessLevel) && employee.accessLevel <= 1)
        .map(employee => String(employee.fullName || '').trim())});
    }
    updateSidebarProfile(result);
    document.getElementById('cashierManagerReportBtn').style.display=Number(result.accessLevel)<=1?'block':'none';
    document.getElementById('loginOverlay').style.display='none';
    document.getElementById('terminalWorkspace').style.display='block';
    document.getElementById('appSidebar').style.display='flex';
    button.disabled=false;button.textContent=cashierMode?'Start cashier shift':'Sign in';document.getElementById('cashierPin').value='';
    updateCashierNavigationAvailability();
    showPage(cashierMode?'posPage':'dashboardPage');saveSession();
    if(typeof refreshInventory==='function')refreshInventory();
  };
  const runner=google.script.run.withSuccessHandler(onLoginSuccess).withFailureHandler(failed);
  if(cashierMode)runner.loginAndStartShift(name,pin,petty,loginPettyHandover&&loginPettyHandover.version);
  else runner.verifyEmployee(name,pin);
}

/* ==========================================================
   SAFE HTML
========================================================== */

function escapeLoginHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>
