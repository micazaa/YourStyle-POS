<div id="acceptDeliveryModal" class="generic-overlay-blur" style="display:none;">

  <div class="custom-popup-card delivery-modal-card">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">

      <div>

        <h5 class="fw-bold mb-1">
          Accept YourFinds Delivery
        </h5>

        <p class="text-muted small mb-0">
          Register newly delivered items
        </p>

      </div>


      <button
        type="button"
        class="btn-close"
        onclick="closeAcceptDeliveryModal()"
      ></button>

    </div>


    <!-- =====================================================
         DELIVERY INFORMATION
    ====================================================== -->

    <div class="mb-4">

      <div class="fw-semibold mb-3">
        Delivery Information
      </div>


      <div class="row g-3">


        <!-- DATE -->

        <div class="col-md-6">

          <label
            class="form-label"
            for="deliveryDate"
          >
            Date Delivered
            <span class="text-danger">*</span>
          </label>

          <input
            type="date"
            id="deliveryDate"
            class="form-control"
            onchange="loadNextYourFindsDeliveryNumber()"
          >

        </div>


        <!-- DELIVERY ID -->

        <div class="col-md-6">

          <label class="form-label">
            Delivery ID
          </label>

          <div
            class="form-control bg-light"
            style="min-height:38px;"
          >
            <span
              id="deliveryNoDisplay"
              class="fw-semibold"
            >
              —
            </span>
          </div>

        </div>

        <!-- DRIVER -->

        <div class="col-md-6">

          <label
          class="form-label"
          for="deliveryDriverName"
        >
          Driver Name
          <span class="text-danger">*</span>
        </label>

          <input
          type="text"
          id="deliveryDriverName"
          class="form-control"
          maxlength="100"
          placeholder="Enter driver name"
          autocomplete="off"
        >

        </div>


        <!-- PLATE -->

        <div class="col-md-6">

          <label
          class="form-label"
          for="deliveryPlateNo"
        >
          Plate No.
          <span class="text-danger">*</span>
        </label>

          <input
          type="text"
          id="deliveryPlateNo"
          class="form-control"
          maxlength="30"
          placeholder="Enter plate number"
          autocomplete="off"
        >

        </div>

      </div>

    </div>


    <div class="mb-4">
      <div class="delivery-items-toolbar mb-3">
        <div class="fw-semibold">Items Received</div>
        <span></span>
        <button type="button" class="btn btn-sm btn-outline-dark delivery-add-item" onclick="addYourFindsDeliveryLine()">+ Add Item</button>
      </div>
      <div class="delivery-line-scroll mb-3">
        <div class="delivery-line-head yourfinds"><span>#</span><span>Type</span><span>Size</span><span>Actual Qty</span><span></span></div>
        <div id="yourFindsDeliveryLines"></div>
      </div>
      <div id="yourFindsDeliverySummary" class="delivery-summary" aria-live="polite"><span>Actual Units <strong>0</strong></span></div>
    </div>

    <!-- =====================================================
         ACCEPTED BY
    ====================================================== -->

    <div class="mb-3">

      <label class="form-label">
        Accepted By
      </label>


      <div class="form-control bg-light" style="min-height:38px;">

        <span
          id="deliveryAcceptedByDisplay"
          class="fw-semibold"
        >
          —
        </span>

      </div>


      <input
        type="hidden"
        id="deliveryAcceptedBy"
      >

    </div>

    <!-- =====================================================
        REMARKS
    ====================================================== -->

    <div class="mb-4">

      <label
        class="form-label"
        for="deliveryRemarks"
      >
        Remarks
      </label>

      <textarea
        id="deliveryRemarks"
        rows="3"
        maxlength="500"
        placeholder="Type remarks here..."
        style="
          display:block;
          width:100%;
          min-height:90px;
          padding:12px;
          border:1px solid #dee2e6;
          border-radius:8px;
          background:#ffffff;
          color:#212529;
          font:inherit;
          resize:vertical;
          outline:none;
          position:relative;
          z-index:10;
          pointer-events:auto;
          user-select:text;
        "
      ></textarea>

    </div>


    <!-- =====================================================
         INFORMATION
    ====================================================== -->

    <div class="p-3 rounded mb-4" style="background-color:var(--pink-light);">

      <div class="small">

        <strong>
          YourFinds receiving
        </strong>

        <div class="text-muted mt-1">

          New pieces will be added to Inventory as
          <strong>INCOMPLETE</strong>
          with Stock 1 and cannot be sold until their
          details are completed.

        </div>

      </div>

    </div>


    <!-- =====================================================
         ACTIONS
    ====================================================== -->

    <div class="d-flex gap-2">


      <button
        type="button"
        class="btn btn-outline-secondary flex-fill py-2"
        onclick="closeAcceptDeliveryModal()"
      >
        Cancel
      </button>


      <button
        type="button"
        id="acceptDeliveryBtn"
        class="btn btn-pink flex-fill py-2 fw-bold"
        onclick="submitYourFindsDelivery()"
      >
        Accept Delivery
      </button>

    </div>

  </div>

</div>


<script>
var yourFindsDeliveryLineCounter = 0;
  /* ==========================================================
   CURRENT EMPLOYEE
========================================================== */




/* ==========================================================
   OPEN
========================================================== */

function openAcceptDeliveryModal() {

  const modal =
    document.getElementById(
      "acceptDeliveryModal"
    );


  if (!modal) {

    console.error(
      "acceptDeliveryModal element not found."
    );

    return;

  }


  const now =
    new Date();


  const localToday =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() * 60000
    )
      .toISOString()
      .split("T")[0];


  const dateInput =
    document.getElementById(
      "deliveryDate"
    );


  dateInput.value =
    localToday;


  dateInput.max =
    localToday;

  loadNextYourFindsDeliveryNumber();
  loadYourFindsCustomSizes();


  /* ================= DETAILS ================= */

  document.getElementById(
    "deliveryDriverName"
  ).value =
    "";


  document.getElementById(
    "deliveryPlateNo"
  ).value =
    "";


  document.getElementById(
    "deliveryRemarks"
  ).value =
    "";


  yourFindsDeliveryLineCounter = 0;
  document.getElementById("yourFindsDeliveryLines").innerHTML = "";
  addYourFindsDeliveryLine();


  /* ================= ACCEPTED BY ================= */

  const employeeName =
    getCurrentDeliveryEmployeeName();


  document.getElementById(
    "deliveryAcceptedBy"
  ).value =
    employeeName;


  document.getElementById(
    "deliveryAcceptedByDisplay"
  ).textContent =
    employeeName || "—";


  /* ================= BUTTON ================= */

  const button =
    document.getElementById(
      "acceptDeliveryBtn"
    );


  button.disabled =
    false;


  button.textContent =
    "Accept Delivery";


  /* ================= SHOW ================= */

  modal.style.display =
    "flex";

}


/* ==========================================================
   CLOSE
========================================================== */

function closeAcceptDeliveryModal() {

  const modal =
    document.getElementById(
      "acceptDeliveryModal"
    );


  if (modal) {

    modal.style.display =
      "none";

  }

}


function addYourFindsDeliveryLine() {
  yourFindsDeliveryLineCounter++;
  const line = document.createElement("div");
  line.className = "yourfinds-delivery-line delivery-line yourfinds";
  line.innerHTML = '<div class="delivery-line-number yourfinds-line-number">' + yourFindsDeliveryLineCounter + '</div>' +
    '<select class="form-select form-select-sm yourfinds-line-type" aria-label="Type" onchange="updateYourFindsDeliveryLineType(this)"><option value="NON_ELECTRONIC">Non-electronic</option><option value="ELECTRONIC">Electronic</option><option value="CUSTOM">Custom</option></select>' +
    '<div class="yourfinds-line-size"></div>' +
    '<input type="number" class="form-control form-control-sm yourfinds-line-qty" min="1" max="999" step="1" value="1" aria-label="Actual quantity" oninput="updateDeliveryTotalQty()">' +
    '<button type="button" class="btn btn-sm btn-outline-danger" aria-label="Remove item" title="Remove item" onclick="removeYourFindsDeliveryLine(this)">×</button>';
  document.getElementById("yourFindsDeliveryLines").appendChild(line);
  renderYourFindsDeliverySize(line);
  renumberYourFindsDeliveryLines();
  updateDeliveryTotalQty();
}

function removeYourFindsDeliveryLine(button) {
  const line = button.closest(".yourfinds-delivery-line");
  if (line) line.remove();
  renumberYourFindsDeliveryLines();
  updateDeliveryTotalQty();
}

function renumberYourFindsDeliveryLines() {
  document.querySelectorAll("#yourFindsDeliveryLines .yourfinds-delivery-line").forEach(function(line, index) {
    line.querySelector(".yourfinds-line-number").textContent = String(index + 1);
  });
}

function updateYourFindsDeliveryLineType(select) {
  const line = select.closest(".yourfinds-delivery-line");
  if (line) renderYourFindsDeliverySize(line);
  updateDeliveryTotalQty();
}

function renderYourFindsDeliverySize(line) {
  const type = line.querySelector(".yourfinds-line-type").value;
  const container = line.querySelector(".yourfinds-line-size");
  if (type === "CUSTOM") {
    container.innerHTML = '<input type="text" list="yourFindsCustomSizeOptions" class="form-control form-control-sm yourfinds-line-custom-size" maxlength="40" placeholder="Select or enter size" aria-label="Custom size">';
    return;
  }
  const sizes = type === "ELECTRONIC"
    ? [{ value:"SE", label:"SE" }, { value:"ME", label:"ME" }, { value:"LE", label:"LE" }, { value:"XLE", label:"XLE" }]
    : [{ value:"SNE", label:"SNE" }, { value:"MNE", label:"MNE" }, { value:"LNE", label:"LNE" }, { value:"XLNE", label:"XLNE" }];
  container.innerHTML = '<select class="form-select form-select-sm yourfinds-line-size-select" aria-label="Size">' + sizes.map(function(size) { return '<option value="' + size.value + '">' + size.label + '</option>'; }).join("") + '</select>';
}

let yourFindsCustomSizeCache = null;
function loadYourFindsCustomSizes() {
  let list = document.getElementById("yourFindsCustomSizeOptions");
  if (!list) {
    list = document.createElement("datalist");
    list.id = "yourFindsCustomSizeOptions";
    document.getElementById("acceptDeliveryModal").appendChild(list);
  }
  const render = function(sizes) {
    list.innerHTML = "";
    (Array.isArray(sizes) ? sizes : []).forEach(function(size) {
      const option = document.createElement("option");
      option.value = size;
      list.appendChild(option);
    });
  };
  if (yourFindsCustomSizeCache && Date.now() - yourFindsCustomSizeCache.time < 60000) {render(yourFindsCustomSizeCache.sizes);return;}
  google.script.run.withSuccessHandler(function(sizes) {yourFindsCustomSizeCache={time:Date.now(),sizes:sizes};render(sizes);}).withFailureHandler(function() {list.innerHTML="";}).prepareYourFindsCustomSizes();
}

function getYourFindsDeliveryLinesFromForm() {
  return Array.from(document.querySelectorAll("#yourFindsDeliveryLines .yourfinds-delivery-line")).map(function(line) {
    const type = line.querySelector(".yourfinds-line-type").value;
    const customInput = line.querySelector(".yourfinds-line-custom-size");
    const sizeSelect = line.querySelector(".yourfinds-line-size-select");
    return {
      type: type,
      size: customInput ? String(customInput.value || "").trim().toUpperCase() : String(sizeSelect.value || "").trim().toUpperCase(),
      quantity: Number(line.querySelector(".yourfinds-line-qty").value)
    };
  });
}

function buildYourFindsDeliveryQuantities(lines) {
  const quantities = { SNE:0, MNE:0, LNE:0, XLNE:0, SE:0, ME:0, LE:0, XLE:0, CUSTOM:0, CUSTOM_LABEL:"" };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!Number.isInteger(line.quantity) || line.quantity < 1 || line.quantity > 999) throw new Error("Item " + (i + 1) + ": quantity must be a whole number from 1 to 999.");
    if (!line.size) throw new Error("Item " + (i + 1) + ": enter a custom size.");
    if (line.type === "CUSTOM") {
      if (quantities.CUSTOM_LABEL && quantities.CUSTOM_LABEL !== line.size) throw new Error("Use one custom size per delivery. Add different custom sizes in separate deliveries.");
      quantities.CUSTOM_LABEL = line.size;
      quantities.CUSTOM += line.quantity;
    } else {
      quantities[line.size] += line.quantity;
    }
  }
  return quantities;
}

function updateDeliveryTotalQty() {
  const total = getYourFindsDeliveryLinesFromForm().reduce(function(sum, line) { return sum + (Number.isFinite(line.quantity) ? line.quantity : 0); }, 0);
  document.getElementById("yourFindsDeliverySummary").innerHTML = '<span>Actual Units <strong>' + total + '</strong></span>';
}

function submitYourFindsDelivery() {

  /* ================= BASIC DETAILS ================= */

  const deliveryDate =
    document.getElementById(
      "deliveryDate"
    ).value;


  const driverName =
    document.getElementById(
      "deliveryDriverName"
    ).value.trim();


  const plateNo =
    document.getElementById(
      "deliveryPlateNo"
    ).value
      .trim()
      .toUpperCase();


  const acceptedBy =
    document.getElementById(
      "deliveryAcceptedBy"
    ).value.trim();


  const remarks =
    document.getElementById(
      "deliveryRemarks"
    ).value.trim();


  const deliveryLines = getYourFindsDeliveryLinesFromForm();

  /* ========================================================
     VALIDATION
  ======================================================== */

  if (!deliveryDate) {

    showNotificationToast(
      "Please select the delivery date.",
      true
    );

    return;

  }


  if (!driverName) {

    showNotificationToast(
      "Please enter the driver name.",
      true
    );

    return;

  }


  if (!plateNo) {

    showNotificationToast(
      "Please enter the plate number.",
      true
    );

    return;

  }


  if (!deliveryLines.length) {

    showNotificationToast(
      "Enter at least one YourFinds item.",
      true
    );

    return;

  }

  let quantities;
  try {
    quantities = buildYourFindsDeliveryQuantities(deliveryLines);
  } catch (error) {
    showNotificationToast(error.message || String(error), true);
    return;
  }


  if (!acceptedBy) {

    showNotificationToast(
      "Unable to identify the logged-in employee. Please log in again.",
      true
    );

    return;

  }


  /* ========================================================
     SUBMIT
  ======================================================== */

  const button =
    document.getElementById(
      "acceptDeliveryBtn"
    );


  button.disabled =
    true;


  button.innerHTML = loadingIndicator("Accepting Delivery...");


  google.script.run

    .withSuccessHandler(
      function(result) {

        /* ================= RESTORE BUTTON ================= */

        button.disabled =
          false;


        button.textContent =
          "Accept Delivery";


        /* ================= FAILED ================= */

        if (
          !result ||
          !result.success
        ) {

          showNotificationToast(
            result &&
            result.message
              ? result.message
              : "Unable to accept delivery.",
            true
          );

          return;

        }


        /* ================= CLOSE DELIVERY MODAL ================= */

        closeAcceptDeliveryModal();


        refreshDeliveriesPage();

        if (typeof pageReadCache !== "undefined") {
          pageReadCache.delete("productMaster");
          yourFindsCustomSizeCache = null;
        }


        /* ================= SUCCESS TOAST ================= */

        showNotificationToast(
          result.totalQty +
          " YourFinds item(s) accepted. " +
          (result.customSizeAdded ? result.customSizeAdded + " added to Product Master. " : "") +
          "Delivery ID: " +
          result.deliveryId
        );


        /* ==================================================
           OPEN LABEL SELECTION

           IMPORTANT:
           Delivery is already saved.

           Closing the label selector does not undo
           the accepted delivery.
        ================================================== */

        if (
          result.deliveryId &&
          typeof openYourFindsLabelModal ===
            "function"
        ) {

          openYourFindsLabelModal(
            result.deliveryId
          );

        }

      }
    )


    .withFailureHandler(
      function(err) {

        button.disabled =
          false;


        button.textContent =
          "Accept Delivery";


        console.error(
          "ACCEPT DELIVERY ERROR:",
          err
        );


        const message =
          err &&
          err.message
            ? err.message
            : String(
                err ||
                "Unknown error"
              );


        showNotificationToast(
          "Accept Delivery Error: " +
          message,
          true
        );

      }
    )


    .acceptYourFindsDelivery(
      deliveryDate,
      driverName,
      plateNo,
      acceptedBy,
      quantities,
      remarks
    );

}

function loadNextYourFindsDeliveryNumber() {

  const deliveryDate =
    document.getElementById(
      "deliveryDate"
    ).value;


  const display =
    document.getElementById(
      "deliveryNoDisplay"
    );


  if (
    !deliveryDate ||
    !display
  ) {

    return;

  }


  display.innerHTML = loadingIndicator();


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          !result ||
          !result.success
        ) {

          display.textContent =
            "—";

          return;

        }


        display.textContent =
          String(
            result.deliveryId
          );

      }
    )


    .withFailureHandler(
      function(err) {

        console.error(
          "DELIVERY NUMBER ERROR:",
          err
        );


        display.textContent =
          "—";

      }
    )


    .getNextYourFindsDeliveryNumber(
      deliveryDate
    );

}

</script>
